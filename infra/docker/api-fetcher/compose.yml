name: rateboard-api-fetcher

services:
  api-fetcher:
    build:
      context: ../../../api-fetcher
    env_file:
      - ${RATEBOARD_SERVICE_ENV_FILE:-/etc/rateboard/api-fetcher.env}
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-api-fetcher
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 18

  alloy:
    image: grafana/alloy:v1.18.0
    env_file:
      - ${RATEBOARD_ALLOY_ENV_FILE:-/etc/rateboard/alloy.env}
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    extra_hosts:
      - "rates-logs:${RATEBOARD_LOGS_IP}"
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/rateboard/logs-ca.crt:/etc/rateboard/logs-ca.crt:ro
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-alloy

volumes:
  alloy_data:
