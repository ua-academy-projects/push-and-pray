name: rateboard-api-fetcher

services:
  api-fetcher:
    build:
      context: ../../../api-fetcher
    env_file:
      - /etc/rateboard/api-fetcher.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 18
