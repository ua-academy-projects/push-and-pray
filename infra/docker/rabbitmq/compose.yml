name: rateboard-messaging

services:
  rabbitmq:
    image: rabbitmq:4-management@sha256:eb5295d083325da5929a5ade766684d4019ffd2bce8bc7e43d6f9a05cafc8646
    env_file:
      - ${RATEBOARD_SERVICE_ENV_FILE:-/etc/rateboard/rabbitmq.env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    env_file:
      - ${RATEBOARD_SERVICE_ENV_FILE:-/etc/rateboard/rabbitmq.env}
    command:
      - /bin/sh
      - -ec
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-redis
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 18

  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    env_file:
      - ${RATEBOARD_ALLOY_ENV_FILE:-/etc/rateboard/alloy.env}
    command: ["run", "--stability.level=experimental", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    extra_hosts:
      - "rates-logs:${RATEBOARD_LOGS_IP}"
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/rateboard/logs-ca.crt:/etc/rateboard/logs-ca.crt:ro
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-alloy

volumes:
  alloy_data:
  rabbitmq_data:
  redis_data:
