name: rateboard-history

services:
  history-service:
    build:
      context: ../../../backend-service
    env_file:
      - ${RATEBOARD_SERVICE_ENV_FILE:-/etc/rateboard/backend-service.env}
    ports:
      - "8081:8081"
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-history-service
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 18

  alloy:
    image: grafana/alloy:v1.18.0
    env_file:
      - ${RATEBOARD_ALLOY_ENV_FILE:-/etc/rateboard/alloy.env}
    command: ["run", "--stability.level=experimental", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    extra_hosts:
      - "rates-logs:${RATEBOARD_LOGS_IP}"
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/rateboard/logs-ca.crt:/etc/rateboard/logs-ca.crt:ro
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: rateboard-alloy

volumes:
  alloy_data:
