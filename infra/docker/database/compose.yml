name: rateboard-database

services:
  postgres:
    image: postgres:16
    env_file:
      - /etc/rateboard/database.env
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  postgresql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/rateboard-data/postgresql
