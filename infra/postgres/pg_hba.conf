# Custom pg_hba.conf for the containerized postgres stack (replaces the file
# initdb would otherwise generate, which only trusts 127.0.0.1/::1).
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Only the project's bridged Vagrant LAN (see ../../Vagrantfile) may
# authenticate remotely -- narrower than 0.0.0.0/0, but not pinned to the
# backend VM's single IP the way the old bare-metal provision.sh was, since
# that would need templating this file per environment. Tighten to a /32
# for the backend VM's IP if you want to match that posture exactly.
host    all             all             192.168.0.0/24          scram-sha-256
