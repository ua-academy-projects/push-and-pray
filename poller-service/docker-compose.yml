services:
  poller:
    build:
      context: .
      network: host
    container_name: academy-poller
    network_mode: host
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    environment:
      PROXY_SERVICE_URL: ${PROXY_SERVICE_URL}
      WATCHED_CITIES: Kyiv,Warsaw,Berlin
      POLL_INTERVAL_SECONDS: 900
