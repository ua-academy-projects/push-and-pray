name: Build and publish an Artifact Registry image

on:
  workflow_call:
    inputs:
      gcp_image_name:
        description: Fully qualified Artifact Registry image name
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      description:
        description: OCI image description
        required: true
        type: string
      image_tag:
        description: Image tag to publish
        required: false
        default: xintaro
        type: string
      gcp_registry_host:
        description: Artifact Registry hostname, for example europe-central2-docker.pkg.dev
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud through GitHub OIDC
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.gcp_registry_host }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Generate GCP image metadata
        id: gcp-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.gcp_image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ inputs.description }}

      - name: Build and publish GCP image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.gcp-metadata.outputs.tags }}
          labels: ${{ steps.gcp-metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.gcp_image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.gcp_image_name }}
