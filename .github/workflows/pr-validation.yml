name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Lint versioned YAML files
        run: yamllint -c .yamllint.yml .

  python:
    env:
      RABBITMQ_URL: amqps://ci:ci@127.0.0.1:5671/oilscope
      RABBITMQ_CA_FILE: /tmp/rabbitmq/ca.pem
      RABBITMQ_QUEUE: price_observations
      RABBITMQ_MAX_ATTEMPTS: '5'
      RABBITMQ_TIMEOUT_SECONDS: '10'
      RABBITMQ_RECONNECT_SECONDS: '5'
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: 'oilscope:session:'
      SESSION_TTL_SECONDS: '2592000'
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  go:
    env:
      RABBITMQ_URL: amqps://ci:ci@127.0.0.1:5671/oilscope
      RABBITMQ_CA_FILE: /tmp/rabbitmq/ca.pem
      RABBITMQ_EXCHANGE: prices
      RABBITMQ_ROUTING_KEY: observations
      RABBITMQ_QUEUE: price_observations
      RABBITMQ_TIMEOUT_SECONDS: '10'
      OUTBOX_POLL_SECONDS: '5'
      OUTBOX_BATCH_SIZE: '50'
    name: Go
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/fetcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/fetcher/go.mod
          cache-dependency-path: services/fetcher/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "${unformatted}"
            echo "Run: gofmt -w ${unformatted}"
            exit 1
          fi

          echo "All Go files are correctly formatted."

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ui/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest

    env:
      RABBITMQ_URL: amqps://ci:ci@127.0.0.1:5671/oilscope
      RABBITMQ_EXCHANGE: prices
      RABBITMQ_ROUTING_KEY: observations
      RABBITMQ_QUEUE: price_observations
      RABBITMQ_TIMEOUT_SECONDS: '10'
      RABBITMQ_RECONNECT_SECONDS: '5'
      RABBITMQ_MAX_ATTEMPTS: '5'
      OUTBOX_POLL_SECONDS: '5'
      OUTBOX_BATCH_SIZE: '50'
      RABBITMQ_CA_DIR: /tmp/rabbitmq
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: 'oilscope:session:'
      SESSION_TTL_SECONDS: '2592000'
      APP_IMAGE_TAG: f4bd2d001dd4ad7abcf04af967dca8e8a0f6d891
      DB_PASSWORD: ci-validation
      DB_LAN_IP: 127.0.0.1
      POSTGRES_IMAGE: postgres:18.6-bookworm
      POSTGRES_PASSWORD: ci-validation
      OILPRICEAPI_KEY: ci-validation
      HISTORY_LAN_IP: 127.0.0.1
      FETCHER_LAN_IP: 127.0.0.1
      UI_LAN_IP: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: infrastructure/docker
        run: |
          status=0

          for file in compose.*.yaml; do
            echo "::group::${file}"

            if docker compose -f "${file}" config --quiet; then
              echo "${file}: OK"
            else
              echo "${file}: INVALID"
              status=1
            fi

            echo "::endgroup::"
          done

          exit "${status}"

  image:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - database
          - fetcher
          - history
          - ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.service }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Terraform changes
        id: changes

        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}

        run: |
          changed=false

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
              ;;
            push)
              base_sha="${PUSH_BASE_SHA}"
              head_sha="${PUSH_HEAD_SHA}"
              ;;
            *)
              echo "Terraform checks are disabled for ${EVENT_NAME}."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac

          if git diff --quiet "${base_sha}" "${head_sha}" \
            -- infrastructure/terraform/; then
            echo "No Terraform changes detected."
          else
            status=$?

            if [ "${status}" -ne 1 ]; then
              echo "Failed to detect Terraform changes."
              exit "${status}"
            fi

            changed=true
            echo "Terraform changes detected."
          fi

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Set up Terraform
        if: steps.changes.outputs.changed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.1"
          terraform_wrapper: false

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Validate
        if: steps.changes.outputs.changed == 'true'
        run: |
          terraform -chdir=infrastructure/terraform init \
            -backend=false \
            -input=false

          terraform -chdir=infrastructure/terraform validate
          terraform -chdir=infrastructure/terraform test

  ansible:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible

      - name: Install this repository's declared Python requirements
        run: pip install -r infrastructure/ansible/requirements.txt

      - name: Install this repository's declared collection requirements
        run: ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Build collection
        working-directory: infrastructure/ansible/oilscope/platform
        run: ansible-galaxy collection build

      - name: Install collection
        working-directory: infrastructure/ansible/oilscope/platform
        run: |
          ansible-galaxy collection install oilscope-platform-*.tar.gz

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          args: ""
          setup_python: "true"
          python-version: "3.14"
          working-directory: infrastructure/ansible
          requirements_file: requirements.yml
