name: Publish application images

on:
  push:
    branches:
      - develop
      - main
      - DL-work
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  fetcher:
    name: Publish Fetcher image
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image-name: ${{ vars.AWS_ECR_REPOSITORY }}/fetcher
      gcp_image_name: ${{ vars.GCP_ARTIFACT_REGISTRY != '' && format('{0}/fetcher', vars.GCP_ARTIFACT_REGISTRY) || '' }}
      gcp_registry_host: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
      dockerfile: infrastructure/docker/Dockerfile.fetcher
      context: .
      description: Petroscope scheduled oil-price fetcher

  history:
    name: Publish History image
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image-name: ${{ vars.AWS_ECR_REPOSITORY }}/history
      gcp_image_name: ${{ vars.GCP_ARTIFACT_REGISTRY != '' && format('{0}/history', vars.GCP_ARTIFACT_REGISTRY) || '' }}
      gcp_registry_host: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
      dockerfile: infrastructure/docker/Dockerfile.history
      context: .
      description: Petroscope price history API and event consumer

  ui:
    name: Publish UI image
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image-name: ${{ vars.AWS_ECR_REPOSITORY }}/ui
      gcp_image_name: ${{ vars.GCP_ARTIFACT_REGISTRY != '' && format('{0}/ui', vars.GCP_ARTIFACT_REGISTRY) || '' }}
      gcp_registry_host: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
      dockerfile: infrastructure/docker/Dockerfile.ui
      context: .
      description: Petroscope web UI and backend service

  database:
    name: Publish database image
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image-name: ${{ vars.AWS_ECR_REPOSITORY }}/database
      gcp_image_name: ${{ vars.GCP_ARTIFACT_REGISTRY != '' && format('{0}/database', vars.GCP_ARTIFACT_REGISTRY) || '' }}
      gcp_registry_host: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
      dockerfile: infrastructure/docker/Dockerfile.database
      context: .
      description: Petroscope database

  database-cnpg:
    name: Publish CloudNativePG database image
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image-name: ${{ vars.AWS_ECR_REPOSITORY }}/database-cnpg
      gcp_image_name: ${{ vars.GCP_ARTIFACT_REGISTRY != '' && format('{0}/database-cnpg', vars.GCP_ARTIFACT_REGISTRY) || '' }}
      gcp_registry_host: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
      image_tag: 18-xintaro
      dockerfile: infrastructure/docker/Dockerfile.database.cnpg
      context: .
      description: Petroscope CloudNativePG database and migration image
