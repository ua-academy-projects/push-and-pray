[defaults]
# Development VMs are frequently recreated at the same address. The SSH
# fingerprints therefore change by design, so the controller must not reject a
# new fingerprint from this project's infrastructure.
host_key_checking = False

[ssh_connection]
# The OpenSSH client used by Ansible applies these settings to its direct
# connection. The ProxyCommand has matching settings in the workload inventory.
ssh_common_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
