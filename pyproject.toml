[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = [
  "services/ui-service/tests",
  "services/provider-service/tests",
  "services/history-service/tests",
]
pythonpath = [
  "services/ui-service/src",
  "services/provider-service/src",
  "services/history-service/src",
]
markers = [
  "mariadb: tests that require a dedicated migrated MariaDB database",
  "rabbitmq: tests that require a dedicated RabbitMQ broker",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
# A combined path scan cannot disambiguate the three independent top-level
# `tests` packages. scripts/typecheck.sh checks each excluded tree separately.
exclude = [
  "^services/history-service/tests/",
  "^services/provider-service/tests/",
  "^services/ui-service/tests/",
]

[tool.uv.workspace]
members = ["services/*-service"]

[tool.uv]
required-version = ">=0.11.29,<0.12"
