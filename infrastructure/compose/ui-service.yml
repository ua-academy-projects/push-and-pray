name: ui-service

services:
  ui-service:
    build: ../../ui-service
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5000"
      FLASK_DEBUG: "false"
      BACKEND_URL: "http://192.168.56.11:5001"
      REDIS_URL: "redis://192.168.56.13:6379/0"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10
