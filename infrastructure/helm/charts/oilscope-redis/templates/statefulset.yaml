apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        oilscope.io/credentials-revision: {{ .Values.credentialsRevision | quote }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.image }}
          command: [sh, -c]
          args:
            - >-
              exec redis-server
              --port 0
              --tls-port {{ .Values.port }}
              --tls-cert-file /tls/tls.crt
              --tls-key-file /tls/tls.key
              --tls-ca-cert-file /tls/ca.crt
              --tls-auth-clients no
              --appendonly yes
              --appendfsync everysec
              --maxmemory {{ .Values.maxmemoryMb }}mb
              --maxmemory-policy noeviction
              --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: {{ .Values.port }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.passwordSecret }}
                  key: {{ .Values.passwordKey }}
          resources:
            requests:
              cpu: 50m
              memory: {{ .Values.memoryMb }}Mi
            limits:
              memory: {{ .Values.memoryMb }}Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --tls
                  --cacert /tls/ca.crt -p {{ .Values.port }} ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --tls
                  --cacert /tls/ca.crt -p {{ .Values.port }} ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
