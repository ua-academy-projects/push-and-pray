{{- if .Values.clusterMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cluster-metrics
  labels:
{{ include "oilscope.labels" (dict "root" . "component" "cluster-metrics") | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cluster-metrics
  labels:
{{ include "oilscope.labels" (dict "root" . "component" "cluster-metrics") | indent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-metrics
  labels:
{{ include "oilscope.labels" (dict "root" . "component" "cluster-metrics") | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cluster-metrics
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cluster-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cluster-metrics
  labels:
{{ include "oilscope.labels" (dict "root" . "component" "cluster-metrics") | indent 4 }}
data:
  collect.sh: |
    set -eu

    SA=/var/run/secrets/kubernetes.io/serviceaccount
    API=https://kubernetes.default.svc

    api() {
      curl -sS --fail-with-body --cacert "${SA}/ca.crt" \
        -H "Authorization: Bearer $(cat ${SA}/token)" "${API}${1}"
    }

    # A resource counts as not-ready unless its Ready condition is exactly
    # "True". A node whose kubelet stopped reporting is "Unknown", and an
    # object with no conditions yet has none at all; both must count.
    not_ready='[.items[]
      | select((([.status.conditions[]? | select(.type == "Ready") | .status]
                 | first) // "Unknown") != "True")] | length'

    nodes_not_ready=$(api /api/v1/nodes | jq "${not_ready}")

    pods_not_ready=$(
      api "/api/v1/namespaces/${NAMESPACE}/pods" \
        | jq '[.items[] | select(.status.phase != "Succeeded")]
               | {items: .}' \
        | jq "${not_ready}"
    )

    jobs_failed=$(
      api "/apis/batch/v1/namespaces/${NAMESPACE}/jobs" \
        | jq '[.items[] | select((.status.failed // 0) > 0)] | length'
    )

    # cert-manager may not be installed, and the CRD may be absent on a fresh
    # cluster. A failure here must not mask the other three metrics.
    certificates_not_ready=$(
      api /apis/cert-manager.io/v1/certificates 2>/dev/null \
        | jq "${not_ready}" 2>/dev/null || echo 0
    )

    aws cloudwatch put-metric-data \
      --region "${AWS_REGION}" \
      --namespace "${METRIC_NAMESPACE}" \
      --metric-data \
      "MetricName=NodesNotReady,Value=${nodes_not_ready},Unit=Count" \
      "MetricName=PodsNotReady,Value=${pods_not_ready},Unit=Count" \
      "MetricName=JobsFailed,Value=${jobs_failed},Unit=Count" \
      "MetricName=CertificatesNotReady,Value=${certificates_not_ready},Unit=Count"

    echo "published nodes=${nodes_not_ready} pods=${pods_not_ready} jobs=${jobs_failed} certs=${certificates_not_ready}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cluster-metrics
  labels:
{{ include "oilscope.labels" (dict "root" . "component" "cluster-metrics") | indent 4 }}
spec:
  schedule: {{ .Values.clusterMetrics.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
{{ include "oilscope.selector" (dict "root" . "component" "cluster-metrics") | indent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-cluster-metrics
          volumes:
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-cluster-metrics
          containers:
            - name: publish
              image: {{ .Values.clusterMetrics.awsCliImage }}
              command: [sh, /scripts/collect.sh]
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: AWS_REGION
                  value: {{ .Values.clusterMetrics.region | quote }}
                - name: METRIC_NAMESPACE
                  value: {{ .Values.clusterMetrics.metricNamespace | quote }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
{{- end }}
