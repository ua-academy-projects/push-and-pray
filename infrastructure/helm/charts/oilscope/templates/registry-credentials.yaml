{{- if .Values.registryCredentials.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.registryCredentials.secret }}]
    verbs: [get, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-registry-refresh
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-registry-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
spec:
  schedule: {{ .Values.registryCredentials.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}
            app.kubernetes.io/component: registry-credentials
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-registry-refresh
          volumes:
            - name: token
              emptyDir:
                medium: Memory
          initContainers:
            - name: mint
              image: {{ .Values.registryCredentials.awsCliImage }}
              command: [sh, -c]
              args:
                - >-
                  aws ecr get-login-password --region "$AWS_REGION"
                  > /token/password
              env:
                - name: AWS_REGION
                  value: {{ .Values.registryCredentials.region | quote }}
              volumeMounts:
                - name: token
                  mountPath: /token
            - name: write
              image: {{ .Values.registryCredentials.kubectlImage }}
              command: [sh, -c]
              args:
                - >-
                  kubectl create secret docker-registry
                  {{ .Values.registryCredentials.secret }}
                  --docker-server="$REGISTRY"
                  --docker-username=AWS
                  --docker-password="$(cat /token/password)"
                  --dry-run=client -o yaml | kubectl apply -f -
              env:
                - name: REGISTRY
                  value: {{ .Values.registryCredentials.registry | quote }}
              volumeMounts:
                - name: token
                  mountPath: /token
                  readOnly: true
          containers:
            - name: done
              image: {{ .Values.registryCredentials.kubectlImage }}
              command: [sh, -c, 'echo "refreshed {{ .Values.registryCredentials.secret }}"']
{{- end }}
