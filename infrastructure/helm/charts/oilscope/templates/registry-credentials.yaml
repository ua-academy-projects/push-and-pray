{{- if .Values.registryCredentials.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.registryCredentials.secret }}]
    verbs: [get, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-registry-refresh
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-registry-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-registry-refresh
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: registry-credentials
spec:
  schedule: {{ .Values.registryCredentials.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}
            app.kubernetes.io/component: registry-credentials
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-registry-refresh
          containers:
            - name: refresh
              image: {{ .Values.registryCredentials.awsCliImage }}
              command:
                - /bin/sh
                - -ec
                - |
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  NS=$(cat "${SA}/namespace")

                  PASSWORD=$(aws ecr get-login-password --region "${AWS_REGION}")
                  AUTH=$(printf 'AWS:%s' "${PASSWORD}" | base64 -w0)
                  CONFIG=$(jq -cn \
                    --arg r "${REGISTRY}" --arg p "${PASSWORD}" --arg a "${AUTH}" \
                    '{auths: {($r): {username: "AWS", password: $p, auth: $a}}}' \
                    | base64 -w0)

                  curl -sS --fail-with-body --cacert "${SA}/ca.crt" \
                    -H "Authorization: Bearer $(cat ${SA}/token)" \
                    -H 'Content-Type: application/strategic-merge-patch+json' \
                    -X PATCH -o /dev/null \
                    "https://kubernetes.default.svc/api/v1/namespaces/${NS}/secrets/${SECRET}" \
                    -d "{\"data\":{\".dockerconfigjson\":\"${CONFIG}\"}}"

                  echo "refreshed ${SECRET} in ${NS}"
              env:
                - name: AWS_REGION
                  value: {{ .Values.registryCredentials.region | quote }}
                - name: REGISTRY
                  value: {{ .Values.registryCredentials.registry | quote }}
                - name: SECRET
                  value: {{ .Values.registryCredentials.secret | quote }}
{{- end }}
