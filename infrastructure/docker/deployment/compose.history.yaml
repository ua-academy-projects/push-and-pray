name: oilscope-history

services:
  history:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/push-and-pray/history:${HISTORY_IMAGE_TAG:?HISTORY_IMAGE_TAG must be a full commit SHA}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://oil_tracker:${DB_PASSWORD:?DB_PASSWORD is required}@10.10.0.12:5432/oil_tracker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@10.10.0.12:5672/oil_tracker
      RABBITMQ_EXCHANGE: oil.price.events
      RABBITMQ_QUEUE: history.price-observations
      RABBITMQ_ROUTING_KEY: prices.observed
      LOG_LEVEL: INFO
      TZ: UTC
    ports:
      - "10.10.0.11:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: oilscope/history
