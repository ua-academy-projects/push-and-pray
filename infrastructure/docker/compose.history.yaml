name: petroscope-history

services:
  history:
    image: petroscope-history:local

    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.history
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.32}

    restart: unless-stopped
    init: true

    environment:
      DATABASE_URL: postgresql+psycopg://oil_tracker:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_LAN_IP:?DB_LAN_IP is required}:5432/oil_tracker


      LOG_LEVEL: INFO
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?required}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:?required}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:?required}
      RABBITMQ_TIMEOUT_SECONDS: ${RABBITMQ_TIMEOUT_SECONDS:?required}
      RABBITMQ_RECONNECT_SECONDS: ${RABBITMQ_RECONNECT_SECONDS:?required}
      RABBITMQ_MAX_ATTEMPTS: ${RABBITMQ_MAX_ATTEMPTS:?required}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:?required}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:?required}
      RABBITMQ_CA_FILE: /run/oilscope/rabbitmq/ca.pem
      TZ: UTC

    ports:
      - "${HISTORY_LAN_IP:?HISTORY_LAN_IP is required}:8001:8001"

    volumes:
      - ${RABBITMQ_CA_DIR:?required}:/run/oilscope/rabbitmq:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: journald
      options:
        tag: petroscope/history
