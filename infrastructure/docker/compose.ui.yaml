name: petroscope-ui

services:
  ui:
    image: petroscope-ui:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ui
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.13.0-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.32}
    restart: unless-stopped
    init: true
    environment:
      HISTORY_SERVICE_URL: http://${HISTORY_LAN_IP:?HISTORY_LAN_IP is required}:8001
      DATABASE_URL: postgresql+psycopg://oil_tracker:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_LAN_IP:?DB_LAN_IP is required}:5432/oil_tracker
      SESSION_TTL_SECONDS: "2592000"
      SESSION_COOKIE_SECURE: "false"
      LOG_LEVEL: INFO
      TZ: UTC
    ports:
      - "${UI_LAN_IP}:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: petroscope/ui
