---
# Ansible collections the controller needs, beyond this repository's own
# oilscope.platform collection.
#
#   ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
collections:
  # Provides the gcp_compute inventory plugin used by inventory/oilscope.yml.
  - name: google.cloud
    version: ">=1.14.0"

  # Provides the aws_ec2 inventory plugin used by inventory/oilscope-aws.yml.
  # >=11.2.0 for the ec2_tags host variable - oilscope_aws uses it instead of
  # the deprecated `tags` variable so tag-keyed groups and composed variables
  # keep working after `tags` is removed.
  - name: amazon.aws
    version: ">=11.2.0"

  # Provides the azure_rm inventory plugin used by
  # inventory/oilscope-azure.yml. >=4.0.0 for the hostvar_expressions,
  # conditional_groups and include_host_filters option set oilscope_azure
  # generates, and for plain_host_names.
  #
  # Unlike the other two, this collection's module_utils imports the whole
  # Azure SDK surface in a single try block, so its own requirements.txt has to
  # be installed as well - see requirements.txt here for the command.
  - name: azure.azcollection
    version: ">=4.0.0"
