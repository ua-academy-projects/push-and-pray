---
# Ansible collections the controller needs, beyond this repository's own
# oilscope.platform collection.
#
#   ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
collections:
  # Provides the GCP delegate used by inventory/oilscope.yml.
  - name: google.cloud
    version: ">=1.14.0"
  # Provides the AWS delegate used when at least one VM selects AWS.
  - name: amazon.aws
    version: ">=10.0.0"
