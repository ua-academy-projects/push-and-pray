---
# Ansible collections the controller needs, beyond this repository's own
# oilscope.platform collection.
#
#   ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
collections:
  # Provides the gcp_compute delegate used by the OilScope inventory wrapper.
  - name: google.cloud
    version: ">=1.14.0"
  # Provides the aws_ec2 delegate used by the same multi-cloud wrapper.
  - name: amazon.aws
    version: ">=11.2.0"
  # Declarative management of Docker networks and Compose v2 projects.
  - name: community.docker
    version: ">=5.0.0,<6.0.0"
