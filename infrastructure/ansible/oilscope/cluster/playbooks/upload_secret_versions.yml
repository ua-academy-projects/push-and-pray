---
# Every value comes from the environment of whoever runs this, under the
# variable name the configuration's secrets block gives it:
#
#  export K3S_TOKEN="$(openssl rand -hex 32)"
#  export TAILSCALE_AUTHKEY="tskey-auth-..."
#   ...
#   ansible-playbook oilscope.cluster.upload_secret_versions --check
#   ansible-playbook oilscope.cluster.upload_secret_versions
- name: Upload cluster secret versions
  hosts: localhost
  gather_facts: false
  roles:
    - role: oilscope.cluster.secret_versions
