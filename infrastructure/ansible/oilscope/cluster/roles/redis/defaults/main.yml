---
redis_kubeconfig: "{{ oilscope_kubeconfig }}"
redis_namespace: "{{ oilscope_namespace }}"
redis_version: ""
redis_repo_url: https://groundhog2k.github.io/helm-charts/

# The release name is also the Service the UI connects to: redis:6379.
redis_release_name: redis

redis_password: ""
redis_cloud: ""
redis_storage_gb: 1

redis_resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
