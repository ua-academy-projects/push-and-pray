---
- name: Read the cluster configuration
  ansible.builtin.set_fact:
    secret_versions_config: >-
      {{ lookup('ansible.builtin.file', secret_versions_config_file) | from_json }}

# The unit of upload is the container. Only k3s_server nodes read secrets, so a
# container exists on every cloud that runs a server - Terraform creates it
# there and nowhere else - and the same value goes to every copy.
- name: Find the servers that read the secrets
  ansible.builtin.set_fact:
    secret_versions_servers: >-
      {{ secret_versions_config.nodes | dict2items
         | selectattr('value.role', 'equalto', 'k3s_server') | list }}

- name: Note where the containers are held
  ansible.builtin.set_fact:
    secret_versions_server_names: >-
      {{ secret_versions_servers | map(attribute='key') | sort | list }}
    secret_versions_server_clouds: >-
      {{ secret_versions_servers | map(attribute='value')
         | map(attribute='cloud', default=secret_versions_config.default_cloud)
         | unique | sort | list }}
    secret_versions_catalog: []

# Two variables naming one container would write two values into it in one
# run, and whichever went last would win.
- name: Refuse a container named twice
  ansible.builtin.assert:
    that: >-
      secret_versions_config.secrets | default({}) | dict2items
      | map(attribute='value') | unique | length
      == secret_versions_config.secrets | default({}) | length
    fail_msg: two variables in the secrets block name the same container
    quiet: true

# The variable is the key of the secrets block itself. The block is the same
# for the whole cluster, so one name means one value everywhere - nothing has
# to be derived from the container ID.
- name: Build the upload catalog
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog + [{
           'secret_id': secret_versions_entry.value,
           'variable': secret_versions_entry.key,
           'read_by': secret_versions_server_names,
           'clouds': secret_versions_server_clouds
         }] }}
  loop: "{{ secret_versions_config.secrets | default({}) | dict2items | sort(attribute='key') }}"
  loop_control:
    loop_var: secret_versions_entry
    label: "{{ secret_versions_entry.key }}"

- name: Keep only the requested containers
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog
         | selectattr('secret_id', 'in', secret_versions_only)
         | list
         + (secret_versions_catalog
            | rejectattr('secret_id', 'in', secret_versions_only)
            | selectattr('variable', 'in', secret_versions_only)
            | list) }}
  when: secret_versions_only | length > 0

- name: Show which variable feeds which container, and where
  ansible.builtin.debug:
    msg: >-
      {{ item.variable }} -> {{ item.secret_id }}
      on {{ item.clouds | join(', ') }}
      (read by {{ item.read_by | join(', ') }})
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.secret_id }}"

- name: List the clouds that hold at least one container
  ansible.builtin.set_fact:
    secret_versions_clouds: >-
      {{ secret_versions_catalog | map(attribute='clouds') | flatten | unique | sort | list }}

- name: Refuse a cloud this role cannot upload to
  ansible.builtin.assert:
    that: secret_versions_clouds | difference(secret_versions_supported_clouds) | length == 0
    fail_msg: >-
      containers are held on
      {{ secret_versions_clouds | difference(secret_versions_supported_clouds) | join(', ') }},
      which this role cannot upload to; supported clouds are
      {{ secret_versions_supported_clouds | join(', ') }}
    quiet: true

# Everything is checked before anything is written. A value that turns out to
# be missing halfway through leaves some hosts on the new credential and some
# on the old one, which is worse than not having started.
- name: Find values that are not in the environment
  ansible.builtin.set_fact:
    secret_versions_absent: >-
      {{ secret_versions_absent | default([])
         + ([item.variable]
            if lookup('ansible.builtin.env', item.variable) | length == 0
            else []) }}
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.variable }}"

- name: Refuse to upload incomplete secret versions
  ansible.builtin.fail:
    msg: >-
      Required secret source variables are missing or empty:
      {{ secret_versions_absent | join(', ') }}
  when: secret_versions_absent | default([]) | length > 0

# Each cloud gets the slice of the catalog it holds, uploaded with its own tool.
- name: Upload to every cloud that holds a container
  ansible.builtin.include_tasks: "upload-{{ secret_versions_cloud }}.yml"
  loop: "{{ secret_versions_clouds }}"
  loop_control:
    loop_var: secret_versions_cloud
