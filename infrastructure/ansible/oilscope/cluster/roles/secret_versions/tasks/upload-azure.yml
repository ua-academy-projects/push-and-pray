---
- name: Select the containers held on Azure
  ansible.builtin.set_fact:
    secret_versions_batch: >-
      {{ secret_versions_catalog | selectattr('clouds', 'contains', 'azure') | list }}

- name: Resolve the target vault
  ansible.builtin.set_fact:
    secret_versions_vault: >-
      {{ secret_versions_key_vault_name
         | default(secret_versions_config.clouds.azure.key_vault_name | default(''), true) }}

- name: Fail when the vault is unknown
  ansible.builtin.assert:
    that: secret_versions_vault | length > 0
    fail_msg: >-
      no Azure Key Vault to upload to; set secret_versions_key_vault_name or
      clouds.azure.key_vault_name in the configuration
    quiet: true

# Key Vault has no empty container: setting a value creates the secret on its
# first upload and adds a version on every later one. The value travels on
# stdin, as on the other clouds - --file reads /dev/stdin, so it never becomes
# an argument.
- name: Put a new version into every secret on Azure
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_az_cli }}"
      - keyvault
      - secret
      - set
      - --vault-name
      - "{{ secret_versions_vault }}"
      - --name
      - "{{ item.secret_id }}"
      - --file
      - /dev/stdin
      - --encoding
      - utf-8
      - --query
      - id
      - --output
      - tsv
    stdin: "{{ lookup('ansible.builtin.env', item.variable) }}"
    stdin_add_newline: false
  loop: "{{ secret_versions_batch }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_added
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Report the new versions on Azure
  ansible.builtin.debug:
    msg: >-
      azure: {{ item.item.secret_id }} <- ${{ item.item.variable }}
      (version {{ item.stdout | trim | regex_replace('^.*/', '') }})
  loop: "{{ secret_versions_added.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"
  when: not ansible_check_mode
