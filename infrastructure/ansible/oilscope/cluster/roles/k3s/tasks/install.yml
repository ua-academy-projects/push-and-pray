---
- name: Get k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Set k3s installed version
  when: not ansible_check_mode and k3s_installed.rc == 0
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_installed.stdout_lines[0].split(' ')[2] }}"

- name: Download artifact only if needed
  when: not ansible_check_mode and (k3s_installed.rc != 0 or k3s_installed_version != k3s_version)
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        timeout: 120
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"

    - name: Run K3s install script
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "{{ k3s_role }}"
      changed_when: true

    - name: Delete the install script
      ansible.builtin.file:
        path: /usr/local/bin/k3s-install.sh
        state: absent
