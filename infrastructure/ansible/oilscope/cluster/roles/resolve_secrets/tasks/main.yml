---
- name: Read the cluster configuration
  ansible.builtin.set_fact:
    resolve_secrets_config: >-
      {{ lookup('ansible.builtin.file', resolve_secrets_config_path) | from_json }}

- name: Derive this host's node key
  ansible.builtin.set_fact:
    resolve_secrets_node_key: >-
      {{ inventory_hostname
         | regex_replace('^' ~ (resolve_secrets_config.name_prefix
                                 ~ '-' ~ resolve_secrets_config.environment
                                 ~ '-') | regex_escape, '') }}

# Only a k3s_server node holds a grant on the secrets - Terraform gives it to
# nothing else - so only a k3s_server node asks. A bastion is no entry of nodes
# at all, an agent is one with another role; both get nothing to read.
- name: Select the secrets this host may read
  ansible.builtin.set_fact:
    resolve_secrets_mappings: >-
      {{ resolve_secrets_config.secrets | default({})
         if (resolve_secrets_config.nodes[resolve_secrets_node_key].role | default('')) == 'k3s_server'
         else {} }}

- name: Refuse a cloud this role cannot read secrets from
  ansible.builtin.assert:
    that: resolve_secrets_cloud in resolve_secrets_supported_clouds
    fail_msg: >-
      cannot resolve secrets for cloud '{{ resolve_secrets_cloud }}';
      supported clouds are {{ resolve_secrets_supported_clouds | join(', ') }}.
      The dynamic inventory normally supplies oilscope_cloud - set
      resolve_secrets_cloud explicitly when running outside it.
    quiet: true
  when: resolve_secrets_mappings | length > 0

- name: Read the secrets from this cloud's secret store
  ansible.builtin.include_tasks: "fetch-{{ resolve_secrets_cloud }}.yml"
  when: resolve_secrets_mappings | length > 0

- name: Default to an empty result when there is nothing to resolve
  ansible.builtin.set_fact:
    resolve_secrets_result: "{{ resolve_secrets_result | default({}) }}"
  no_log: true
