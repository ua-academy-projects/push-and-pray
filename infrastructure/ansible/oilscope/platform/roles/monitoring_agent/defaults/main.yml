---
# Shared by both clouds' task files - a VM only ever runs one cloud's agent,
# never both, so there's no collision risk in reusing one path.
monitoring_agent_work_dir: /opt/oilscope/monitoring

# AWS: CloudWatch Agent. AWS does not publish version-pinned download URLs
# (only "latest" per architecture), so pinning like docker_engine does for
# Docker isn't available here; dpkg's own version check keeps re-runs
# idempotent instead.
monitoring_agent_aws_package_base_url: https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu
monitoring_agent_aws_gpg_key_url: https://amazoncloudwatch-agent.s3.amazonaws.com/assets/amazon-cloudwatch-agent.gpg
# Published at
# https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/verify-CloudWatch-Agent-Package-Signature.html
# - re-verify if this ever needs to change; a mismatch here must block
# installation, not just warn.
monitoring_agent_aws_gpg_fingerprint: "937616F3450B7D806CBD9725D58167303B789C72"
monitoring_agent_aws_ctl: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl

# GCP: Ops Agent. Installed through Google's own installer script (it owns
# the apt repo/key setup itself) rather than reimplemented by hand here -
# unlike AWS's CloudWatch Agent, Google doesn't document the underlying
# repo/key URLs as a stable public contract, only this script. Pinned to a
# major version, matching the script's own documented pinning example
# (`--version=1.*.*`); re-runs only install once (see tasks/gcp.yml) so
# bumping this does not auto-upgrade an already-installed agent.
monitoring_agent_gcp_install_script_url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
monitoring_agent_gcp_version: "2.*.*"
monitoring_agent_gcp_config_path: /etc/google-cloud-ops-agent/config.yaml
monitoring_agent_gcp_service: google-cloud-ops-agent.service

# Azure: the Monitor Agent, installed by Terraform as a VM extension rather
# than by this role. These paths are what the VM shows for it.
monitoring_agent_azure_service: azuremonitoragent.service
monitoring_agent_azure_state_dir: /etc/opt/microsoft/azuremonitoragent/config-cache

# One entry per implemented cloud, so a disable path can never fall through to
# another cloud's unit name or install marker.
monitoring_agent_supported_clouds:
  - aws
  - gcp
  - azure

monitoring_agent_marker_paths:
  aws: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
  gcp: /lib/systemd/system/google-cloud-ops-agent.service
  azure: /lib/systemd/system/azuremonitoragent.service

# Azure is absent on purpose: its agent is removed by Terraform destroying the
# extension, not by stopping a service the next apply would restart.
monitoring_agent_service_names:
  aws: amazon-cloudwatch-agent
  gcp: google-cloud-ops-agent.service
