---
- name: Read the project configuration
  ansible.builtin.set_fact:
    monitoring_agent_outputs: >-
      {{ lookup('ansible.builtin.file', terraform_outputs_path) | from_json }}

- name: Require a known cloud
  ansible.builtin.fail:
    msg: >-
      oilscope_cloud '{{ oilscope_cloud | default('') }}' is not
      {{ monitoring_agent_supported_clouds | join(', ') }}
  when: (oilscope_cloud | default('')) not in monitoring_agent_supported_clouds

- name: Select the current cloud's monitoring output
  ansible.builtin.set_fact:
    monitoring_agent_config: >-
      {{ monitoring_agent_outputs[oilscope_cloud ~ '_monitoring']
         | default(monitoring_agent_outputs) }}

- name: Determine whether this VM has an agent configuration
  ansible.builtin.set_fact:
    monitoring_agent_configured: >-
      {{ oilscope_vm_key in monitoring_agent_config.value.agent_configurations }}

- name: Install and configure the agent on AWS
  ansible.builtin.include_tasks: aws.yml
  when:
    - monitoring_agent_configured
    - oilscope_cloud == 'aws'

- name: Install and configure agent on GCP
  ansible.builtin.include_tasks: gcp.yml
  when:
    - monitoring_agent_configured
    - oilscope_cloud == 'gcp'

- name: Verify the agent Terraform installed on Azure
  ansible.builtin.include_tasks: azure.yml
  when:
    - monitoring_agent_configured
    - oilscope_cloud == 'azure'

# The disable path used to be a pair of AWS-or-else ternaries, which meant a
# third cloud silently followed GCP's unit name and install path. Each cloud
# now names its own, and Azure's removal is an ARM operation rather than a
# local service stop - so it has its own task file on this side too.
- name: Locate a previously installed monitoring agent
  ansible.builtin.stat:
    path: "{{ monitoring_agent_marker_paths[oilscope_cloud] }}"
  register: monitoring_agent_previous
  when:
    - not monitoring_agent_configured
    - oilscope_cloud in monitoring_agent_service_names

- name: Stop an agent when this VM no longer has monitoring configuration
  become: true
  ansible.builtin.systemd_service:
    name: "{{ monitoring_agent_service_names[oilscope_cloud] }}"
    enabled: false
    state: stopped
  when:
    - not monitoring_agent_configured
    - oilscope_cloud in monitoring_agent_service_names
    - monitoring_agent_previous.stat.exists | default(false)

- name: Remove the Azure Monitor Agent when this VM no longer has monitoring configuration
  ansible.builtin.include_tasks: azure_disable.yml
  when:
    - not monitoring_agent_configured
    - oilscope_cloud == 'azure'
