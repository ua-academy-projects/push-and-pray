---
k3s_application_config_file: >-
  {{ project_config_path | default('project-config.json') }}
k3s_application_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'HOME')
     ~ '/.kube/oilscope-'
     ~ k3s_application_config.environment
     ~ '.yaml' }}
k3s_application_namespace: >-
  {{ k3s_application_config.k3s.application.namespace }}
k3s_application_secret_name: >-
  {{ k3s_application_config.name_prefix ~ '-application' }}
k3s_application_registry_secret_name: >-
  {{ k3s_application_config.name_prefix ~ '-registry' }}
k3s_application_image_repository: >-
  {{ k3s_application_config.registry.repository }}
k3s_application_image_tag: >-
  {{ k3s_application_config.registry.image_tag }}
k3s_application_image_pull_policy: IfNotPresent

k3s_application_history_name: history
k3s_application_history_container_port: 8001
k3s_application_history_service_port: >-
  {{ k3s_application_config.service_ports.history_api }}
k3s_application_history_replicas: 1

k3s_application_fetcher_name: fetcher
k3s_application_fetcher_port: 8002
k3s_application_fetcher_replicas: 1
k3s_application_fetch_cron_hours: 0,6,12,18
k3s_application_fetch_timezone: UTC
k3s_application_fetch_on_startup: "true"
k3s_application_request_timeout_seconds: 15

k3s_application_ui_name: ui
k3s_application_ui_port: 8080
k3s_application_ui_replicas: 1
k3s_application_session_ttl_seconds: 2592000
k3s_application_session_cookie_secure: "true"

k3s_application_postgresql_host: postgresql-rw
k3s_application_postgresql_port: >-
  {{ k3s_application_config.service_ports.postgresql }}
k3s_application_postgresql_user: oil_tracker
k3s_application_postgresql_database: oil_tracker
k3s_application_postgresql_sslmode: disable
k3s_application_log_level: INFO
k3s_application_wait_timeout: 300
