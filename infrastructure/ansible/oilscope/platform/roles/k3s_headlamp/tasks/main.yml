---
- name: Read the project configuration
  ansible.builtin.set_fact:
    k3s_headlamp_config: >-
      {{ lookup('ansible.builtin.file', k3s_headlamp_config_file) | from_json }}

- name: Install Headlamp
  kubernetes.core.helm:
    binary_path: "{{ k3s_headlamp_helm_binary }}"
    release_name: "{{ k3s_headlamp_release_name }}"
    release_namespace: "{{ k3s_headlamp_release_namespace }}"
    chart_ref: "{{ k3s_headlamp_chart_ref }}"
    chart_repo_url: "{{ k3s_headlamp_chart_repo_url }}"
    chart_version: "{{ k3s_headlamp_chart_version }}"
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    values_files:
      - "{{ k3s_headlamp_values_file }}"
    create_namespace: true
    atomic: true
    wait: true
    timeout: "{{ k3s_headlamp_timeout }}"

- name: Create the Headlamp administrator service account
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ k3s_headlamp_admin_service_account }}"
        namespace: "{{ k3s_headlamp_release_namespace }}"
        labels:
          app.kubernetes.io/managed-by: Ansible
          app.kubernetes.io/part-of: "{{ k3s_headlamp_config.name_prefix }}"

- name: Grant cluster administrator access to the Headlamp administrator
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ k3s_headlamp_admin_binding }}"
        labels:
          app.kubernetes.io/managed-by: Ansible
          app.kubernetes.io/part-of: "{{ k3s_headlamp_config.name_prefix }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ k3s_headlamp_admin_cluster_role }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ k3s_headlamp_admin_service_account }}"
          namespace: "{{ k3s_headlamp_release_namespace }}"

- name: Restrict Headlamp to traffic from the Tailscale subnet router
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template', 'private-source-middleware.yaml.j2')
         | from_yaml }}

- name: Create the Headlamp HTTPS redirect middleware
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template', 'https-redirect-middleware.yaml.j2')
         | from_yaml }}

- name: Expose Headlamp through its private hostname
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template', 'ingress.yaml.j2') | from_yaml }}

- name: Wait for cert-manager to create the Headlamp Certificate
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ k3s_headlamp_tls_secret_name }}"
    namespace: "{{ k3s_headlamp_release_namespace }}"
  register: k3s_headlamp_certificate
  changed_when: false
  retries: "{{ k3s_headlamp_certificate_discovery_retries }}"
  delay: "{{ k3s_headlamp_certificate_discovery_delay }}"
  until: k3s_headlamp_certificate.resources | length > 0

- name: Wait for the Headlamp Certificate to become ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_headlamp_kubeconfig }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ k3s_headlamp_tls_secret_name }}"
    namespace: "{{ k3s_headlamp_release_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_sleep: 5
    wait_timeout: "{{ k3s_headlamp_certificate_wait_timeout }}"
  changed_when: false
