---
- name: Install the AWS CLI used with the instance role
  ansible.builtin.package:
    name: awscli
    state: present
  become: true
  when: resolve_secrets_mappings | length > 0

- name: Read each mapped AWS secret through the instance role
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - get-parameter
      - --region
      - "{{ resolve_secrets_config.clouds.aws.locations[resolve_secrets_config.defaults.location_profile].region }}"
      - --name
      - "{{ item.value }}"
      - --with-decryption
      - --query
      - Parameter.Value
      - --output
      - text
  register: resolve_secrets_accessed
  changed_when: false
  no_log: true
  loop: "{{ resolve_secrets_mappings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: resolve_secrets_mappings | length > 0

- name: Build the resolved AWS secrets mapping
  ansible.builtin.set_fact:
    resolve_secrets_result: >-
      {{ resolve_secrets_result | default({}) | combine({
           item.item.key: item.stdout
         }) }}
  no_log: true
  loop: "{{ resolve_secrets_accessed.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
