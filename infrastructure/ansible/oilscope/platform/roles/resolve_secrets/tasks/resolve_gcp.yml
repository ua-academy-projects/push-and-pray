---
- name: Select the GCP project
  ansible.builtin.set_fact:
    resolve_secrets_gcp_project: >-
      {{ resolve_secrets_gcp_project_id
         | default(resolve_secrets_config.cloud_settings.gcp.project_id, true) }}

- name: Fetch a GCP service-account access token
  ansible.builtin.uri:
    url: "{{ resolve_secrets_gcp_metadata_url }}"
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: resolve_secrets_gcp_token
  no_log: true

- name: Read each GCP secret version
  ansible.builtin.uri:
    url: >-
      {{ resolve_secrets_gcp_secretmanager_url
         }}/projects/{{ resolve_secrets_gcp_project
         }}/secrets/{{ item.value }}/versions/latest:access
    headers:
      Authorization: >-
        Bearer {{ (resolve_secrets_gcp_token.content | from_json).access_token }}
    return_content: true
  register: resolve_secrets_gcp_accessed
  no_log: true
  loop: "{{ resolve_secrets_mappings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Build the resolved GCP secrets mapping
  ansible.builtin.set_fact:
    resolve_secrets_result: >-
      {{ resolve_secrets_result | combine({
           item.item.key: ((item.content | from_json).payload.data | b64decode)
         }) }}
  no_log: true
  loop: "{{ resolve_secrets_gcp_accessed.results }}"
  loop_control:
    label: "{{ item.item.key }}"
