---
- name: Reset the resolved secrets result
  ansible.builtin.set_fact:
    resolve_secrets_result: {}
  no_log: true

- name: Read the project configuration
  ansible.builtin.set_fact:
    resolve_secrets_config: >-
      {{ lookup('ansible.builtin.file', resolve_secrets_config_path) | from_json }}

# oilscope_vm_key and oilscope_cloud come from the dynamic inventory plugin
# (oilscope_gcp / oilscope_aws), which derives them from the instance's own
# name/tags - not from inventory_hostname here, so a custom hostnames setting
# or a static test inventory can't silently point this at the wrong VM.
- name: Require a known VM key
  ansible.builtin.fail:
    msg: >-
      oilscope_vm_key '{{ oilscope_vm_key | default('') }}' is not a key in
      this configuration's vms - the inventory and the project configuration
      have drifted apart.
  when: (oilscope_vm_key | default('')) not in resolve_secrets_config.vms

- name: Select the host's secret mappings
  ansible.builtin.set_fact:
    resolve_secrets_mappings: >-
      {{ resolve_secrets_config.vms[oilscope_vm_key].secret_mappings | default({}) }}

- name: Require a supported cloud
  ansible.builtin.fail:
    msg: >-
      oilscope_cloud '{{ oilscope_cloud | default('') }}' is not 'gcp' or
      'aws'.
  when:
    - resolve_secrets_mappings | length > 0
    - (oilscope_cloud | default('')) not in ['gcp', 'aws']

- name: Resolve secrets on GCP
  ansible.builtin.include_tasks: gcp.yml
  when:
    - resolve_secrets_mappings | length > 0
    - oilscope_cloud == 'gcp'

- name: Resolve secrets on AWS
  ansible.builtin.include_tasks: aws.yml
  when:
    - resolve_secrets_mappings | length > 0
    - oilscope_cloud == 'aws'
