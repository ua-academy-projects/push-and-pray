---
- name: Read the project configuration
  ansible.builtin.set_fact:
    resolve_secrets_config: >-
      {{ lookup('ansible.builtin.file', resolve_secrets_config_path) | from_json }}

- name: Select cloud and VM key from normalized inventory variables
  ansible.builtin.set_fact:
    resolve_secrets_cloud_provider: "{{ oilscope_cloud }}"
    resolve_secrets_vm_key: "{{ oilscope_vm_key }}"

- name: Validate inventory identity
  ansible.builtin.assert:
    that:
      - resolve_secrets_cloud_provider in ['aws', 'gcp']
      - resolve_secrets_vm_key in resolve_secrets_config.vms
    fail_msg: >-
      Inventory must provide valid oilscope_cloud and oilscope_vm_key variables.

- name: Select this host's secret mappings
  ansible.builtin.set_fact:
    resolve_secrets_mappings: >-
      {{ resolve_secrets_config.vms[resolve_secrets_vm_key].secret_mappings
         | default({}) }}

- name: Run the provider-specific secret resolver
  ansible.builtin.include_tasks: "{{ resolve_secrets_cloud_provider }}.yml"

- name: Default to an empty result when there is nothing to resolve
  ansible.builtin.set_fact:
    resolve_secrets_result: "{{ resolve_secrets_result | default({}) }}"
  no_log: true
