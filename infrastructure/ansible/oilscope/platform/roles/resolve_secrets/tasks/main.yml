---
- name: Read the project configuration
  ansible.builtin.set_fact:
    resolve_secrets_config: >-
      {{ lookup('ansible.builtin.file', resolve_secrets_config_path) | from_json }}

- name: Select this VM's configuration
  ansible.builtin.set_fact:
    resolve_secrets_vm_key: >-
      {{ oilscope_vm_name
         | default(inventory_hostname
                   | regex_replace(
                       '^' ~ (resolve_secrets_config.name_prefix
                              ~ '-' ~ resolve_secrets_config.environment
                              ~ '-') | regex_escape,
                       '')) }}

- name: Resolve this VM's cloud and secret mappings
  ansible.builtin.set_fact:
    resolve_secrets_cloud: >-
      {{ oilscope_cloud
         | default(resolve_secrets_config.vms[resolve_secrets_vm_key].cloud
                   | default(resolve_secrets_config.default_cloud)) }}
    resolve_secrets_mappings: >-
      {{ resolve_secrets_config.vms[resolve_secrets_vm_key].secret_mappings
         | default({}) }}
    resolve_secrets_result: {}

- name: Resolve secrets through the VM's cloud identity
  ansible.builtin.include_tasks: "resolve_{{ resolve_secrets_cloud }}.yml"
  when: resolve_secrets_mappings | length > 0
