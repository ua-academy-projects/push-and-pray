---
# Run with -e project_config_path=<path to a project configuration JSON>,
# e.g. the repository's project-config.example.json, or a real one.
#
# In real use, oilscope_vm_key and oilscope_cloud come from the dynamic
# inventory plugin (oilscope_gcp / oilscope_aws). This static test inventory
# has no plugin behind it, so they're set directly as host vars on
# oilscope-dev-bastion in ./inventory instead, exercising a host with a
# "bastion" vms entry, which has no secret_mappings per the schema.
- name: Test the resolve_secrets role (missing configuration)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Include the role without a configuration file
      ansible.builtin.include_role:
        name: resolve_secrets
      vars:
        resolve_secrets_config_path: /nonexistent/project-config.json
      register: resolve_secrets_no_config
      ignore_errors: true

- name: Test the resolve_secrets role (host with no secret mappings)
  hosts: oilscope-dev-bastion
  connection: local
  gather_facts: false
  tasks:
    - name: Include the role for a host with no secret mappings
      ansible.builtin.include_role:
        name: resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"
