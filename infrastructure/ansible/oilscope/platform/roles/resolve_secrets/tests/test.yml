---
- name: Test the resolve_secrets role (missing configuration)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Exercise missing configuration
      block:
        - name: Include the role without a configuration file
          ansible.builtin.include_role:
            name: resolve_secrets
          vars:
            resolve_secrets_config_path: /nonexistent/project-config.json

        - name: Fail if the missing file was accepted
          ansible.builtin.fail:
            msg: Missing configuration was unexpectedly accepted
      rescue:
        - name: Record the expected rejection
          ansible.builtin.set_fact:
            resolve_secrets_missing_rejected: true

    - name: Verify missing configuration was rejected
      ansible.builtin.assert:
        that:
          - resolve_secrets_missing_rejected | default(false)

- name: Test the resolve_secrets role (host with no secret mappings)
  hosts: oilscope-dev-bastion
  connection: local
  gather_facts: false
  tasks:
    - name: Include the role for a host with no secret mappings
      ansible.builtin.include_role:
        name: resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"
