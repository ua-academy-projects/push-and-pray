---
# secret_mappings names a secret container, which is what AWS's --secret-id and
# GCP's --secret both take. Azure's data plane is addressed by URI instead, so
# the container ID is translated through the same catalog resolve_secrets reads
# rather than rebuilt from a vault name here.
- name: Resolve this workload's password secret for the controller's CLI
  ansible.builtin.set_fact:
    database_migrate_runtime_secret_id: >-
      {{ (lookup('ansible.builtin.file', terraform_outputs_path) | from_json)
           .secret_resource_names.value.azure[
             database_migrate_workload.value.secret_mappings.POSTGRES_PASSWORD]
         if database_connection_config.default_cloud == 'azure'
         else database_migrate_workload.value.secret_mappings.POSTGRES_PASSWORD }}

- name: Read this workload's existing database password
  ansible.builtin.include_tasks: read_secret.yml
  vars:
    database_migrate_secret_id: "{{ database_migrate_runtime_secret_id }}"

- name: Apply this workload's runtime role operation
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ database_migrate_project }}"
      - --file
      - "{{ database_migrate_dir }}/compose.yaml"
      - run
      - --rm
      - --no-deps
      - -T
      - migrate
      - psql
      - -X
      - --set=ON_ERROR_STOP=1
      - "--file=/opt/oilscope/bootstrap/{{ database_migrate_operation }}.sql"
  environment: >-
    {{ database_migrate_environment | combine({
         'RUNTIME_DB_USER': 'oil_tracker_' ~ database_migrate_workload.key,
         'RUNTIME_DB_PASSWORD': database_migrate_secret_value,
         'RUNTIME_DB_ROLE': database_migrate_workload.value.role
       }) }}
  no_log: true
  changed_when: true

- name: Verify login and table access with runtime credentials
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ database_migrate_project }}"
      - --file
      - "{{ database_migrate_dir }}/compose.yaml"
      - run
      - --rm
      - --no-deps
      - -T
      - migrate
      - psql
      - -X
      - --set=ON_ERROR_STOP=1
      - --file=/opt/oilscope/bootstrap/verify.sql
  environment: >-
    {{ database_migrate_environment | combine({
         'DATABASE_ADMIN_USER': 'oil_tracker_' ~ database_migrate_workload.key,
         'DATABASE_ADMIN_PASSWORD': database_migrate_secret_value,
         'RUNTIME_DB_ROLE': database_migrate_workload.value.role
       }) }}
  no_log: true
  changed_when: false
  when: database_migrate_operation == 'grants'
