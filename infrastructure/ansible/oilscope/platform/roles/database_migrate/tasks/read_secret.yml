---
# Runs on the controller under the operator identity, not the VM's role.
#
# Every branch returns the raw secret string in database_migrate_secret_value.
# main.yml decodes that once more for the administrator object; runtime.yml
# uses it as the password it is. Without an explicit branch a new cloud fell
# through to the GCP register, which is undefined here - and no_log turned that
# into a diagnostic pointing at the wrong provider.
- name: Require a cloud this role can read a secret from
  ansible.builtin.fail:
    msg: >-
      default_cloud '{{ database_connection_config.default_cloud }}' has no
      administrator-secret read implementation
      ({{ database_migrate_supported_clouds | join(', ') }} do).
  when: database_connection_config.default_cloud not in database_migrate_supported_clouds

- name: Read an AWS secret with operator credentials
  ansible.builtin.command:
    argv:
      - aws
      - secretsmanager
      - get-secret-value
      - --secret-id
      - "{{ database_migrate_secret_id }}"
      - --region
      - "{{ database_connection_config.region_map[database_connection_config.region].aws.region }}"
      - --query
      - SecretString
      - --output
      - json
  delegate_to: localhost
  become: false
  register: database_migrate_aws_secret
  changed_when: false
  no_log: true
  when: database_connection_config.default_cloud == 'aws'

- name: Read a GCP secret with operator credentials
  ansible.builtin.command:
    argv:
      - gcloud
      - secrets
      - versions
      - access
      - latest
      - --secret
      - "{{ database_migrate_secret_id | basename }}"
      - --project
      - "{{ database_connection_config.clouds.gcp.project_id }}"
      - --quiet
    strip_empty_ends: false
  delegate_to: localhost
  become: false
  register: database_migrate_gcp_secret
  changed_when: false
  no_log: true
  when: database_connection_config.default_cloud == 'gcp'

# --id takes the versionless URI Terraform exported and resolves the current
# version. JSON rather than tsv: tsv escapes tabs and newlines, which would
# silently alter a password that contains them.
- name: Read an Azure secret with operator credentials
  ansible.builtin.command:
    argv:
      - az
      - keyvault
      - secret
      - show
      - --id
      - "{{ database_migrate_secret_id }}"
      - --output
      - json
  delegate_to: localhost
  become: false
  register: database_migrate_azure_secret
  changed_when: false
  no_log: true
  when: database_connection_config.default_cloud == 'azure'

- name: Keep the secret in memory for the current operation
  ansible.builtin.set_fact:
    database_migrate_secret_value: >-
      {{ (database_migrate_aws_secret.stdout | from_json)
         if database_connection_config.default_cloud == 'aws'
         else (database_migrate_azure_secret.stdout | from_json).value
         if database_connection_config.default_cloud == 'azure'
         else database_migrate_gcp_secret.stdout }}
  no_log: true
