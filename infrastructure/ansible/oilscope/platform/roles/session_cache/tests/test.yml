---
- name: Validate the session_cache role
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Expect the role to refuse a missing password
      block:
        - name: Include the role without a password
          ansible.builtin.include_role:
            name: session_cache

        - name: Note that the role did not refuse
          ansible.builtin.set_fact:
            session_cache_refused: false
      rescue:
        - name: Note that the role refused
          ansible.builtin.set_fact:
            session_cache_refused: true

    - name: Verify a missing password is rejected
      ansible.builtin.assert:
        that: session_cache_refused
