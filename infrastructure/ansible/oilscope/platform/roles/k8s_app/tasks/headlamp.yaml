---
- name: Install Headlamp
  kubernetes.core.helm:
    name: headlamp
    chart_ref: headlamp
    chart_repo_url: https://kubernetes-sigs.github.io/headlamp/
    chart_version: "{{ headlamp_chart_version }}"
    release_namespace: headlamp
    create_namespace: true
    values:
      service:
        type: ClusterIP
      ingress:
        enabled: "{{ k8s_app_internal_ingress }}"
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: "{{ k8s_app_internal_issuer }}"
        hosts:
          - host: "{{ k8s_app_headlamp_host }}"
            paths:
              - path: /
                type: Prefix
        tls:
          - secretName: headlamp-tls
            hosts:
              - "{{ k8s_app_headlamp_host }}"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    wait: true
