---
- name: Choose how to reach the k3s API
  ansible.builtin.set_fact:
    k8s_app_api_host: "{{ k8s_server_ip if k8s_app_api_via_tailscale | bool else '127.0.0.1' }}"
    k8s_app_api_port: "{{ 6443 if k8s_app_api_via_tailscale | bool else k8s_api_local_port }}"

- name: Write a local kubeconfig pointing at the API endpoint
  ansible.builtin.copy:
    content: "{{ hostvars[groups['k3s_server'][0]].k3s_kubeconfig_raw.content | b64decode | regex_replace('https://127.0.0.1:6443', 'https://' ~ k8s_app_api_host ~ ':' ~ k8s_app_api_port | string) }}"
    dest: "{{ k8s_local_kubeconfig }}"
    mode: "0600"
  no_log: true

- name: Close any stale API tunnel on the local port
  ansible.builtin.command: pkill -f "{{ k8s_api_local_port }}:localhost:6443"
  register: k8s_tunnel_kill
  changed_when: k8s_tunnel_kill.rc == 0
  failed_when: false
  when: not k8s_app_api_via_tailscale | bool

- name: Start an SSH tunnel to the k3s API
  ansible.builtin.shell:
    cmd: >-
      ssh -f -N -o ExitOnForwardFailure=yes
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
      -o IdentitiesOnly=yes -i {{ k8s_ssh_key }}
      -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o IdentitiesOnly=yes -i {{ k8s_ssh_key }} -W %h:%p -p {{ k8s_bastion_port }} {{ k8s_ssh_user }}@{{ k8s_bastion_host }}"
      -L {{ k8s_api_local_port }}:localhost:6443 {{ k8s_ssh_user }}@{{ k8s_server_ip }}
  register: k8s_tunnel
  changed_when: k8s_tunnel.rc == 0
  failed_when: k8s_tunnel.rc != 0
  when: not k8s_app_api_via_tailscale | bool

- name: Wait for the k3s API to be reachable
  ansible.builtin.wait_for:
    host: "{{ k8s_app_api_host }}"
    port: "{{ k8s_app_api_port }}"
    timeout: 15
