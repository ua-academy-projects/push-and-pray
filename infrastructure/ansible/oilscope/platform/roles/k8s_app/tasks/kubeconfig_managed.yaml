---
- name: Fetch EKS credentials
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - update-kubeconfig
      - --name
      - "{{ k8s_managed_cluster.name }}"
      - --region
      - "{{ k8s_managed_cluster.region }}"
      - --kubeconfig
      - "{{ k8s_local_kubeconfig }}"
  changed_when: false
  when: k8s_app_cluster_kind == 'aws'

- name: Fetch GKE credentials
  ansible.builtin.command:
    argv:
      - gcloud
      - container
      - clusters
      - get-credentials
      - "{{ k8s_managed_cluster.name }}"
      - --zone
      - "{{ k8s_managed_cluster.zone }}"
      - --project
      - "{{ k8s_managed_cluster.project }}"
  environment:
    KUBECONFIG: "{{ k8s_local_kubeconfig }}"
  changed_when: false
  when: k8s_app_cluster_kind == 'gcp'

- name: Fetch AKS credentials
  ansible.builtin.command:
    argv:
      - az
      - aks
      - get-credentials
      - --resource-group
      - "{{ k8s_managed_cluster.resource_group }}"
      - --name
      - "{{ k8s_managed_cluster.name }}"
      - --admin
      - --file
      - "{{ k8s_local_kubeconfig }}"
      - --overwrite-existing
  changed_when: false
  when: k8s_app_cluster_kind == 'azure'

- name: Restrict the kubeconfig permissions
  ansible.builtin.file:
    path: "{{ k8s_local_kubeconfig }}"
    mode: "0600"

- name: Wait for the managed API to answer
  kubernetes.core.k8s_info:
    kind: Namespace
    name: default
  register: k8s_app_api_check
  until: k8s_app_api_check is succeeded
  retries: 10
  delay: 15
