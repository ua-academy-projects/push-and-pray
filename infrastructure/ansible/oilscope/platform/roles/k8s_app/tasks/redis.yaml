---
- name: Install Redis
  kubernetes.core.helm:
    name: redis
    chart_ref: "oci://registry-1.docker.io/bitnamicharts/redis"
    chart_version: "28.2.4"
    release_namespace: oilscope
    create_namespace: true
    values:
      global:
        security:
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/redis
      architecture: standalone
      auth:
        password: "{{ resolve_secrets_result.REDIS_PASSWORD }}"
      master:
        persistence:
          enabled: false
    wait: true
  no_log: true