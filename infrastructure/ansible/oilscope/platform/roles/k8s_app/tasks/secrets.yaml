---
- name: Derive the registry host
  ansible.builtin.set_fact:
    k8s_app_registry_host: "{{ k8s_app_config.registry.repository.split('/')[0] }}"

- name: Create the GHCR image pull secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-pull
        namespace: oilscope
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ {'auths': {k8s_app_registry_host: {'username': k8s_app_config.registry.username, 'password': resolve_secrets_result.GHCR_TOKEN, 'auth': (k8s_app_config.registry.username ~ ':' ~ resolve_secrets_result.GHCR_TOKEN) | b64encode}}} | to_json }}"
  no_log: true

- name: Create the application secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-app
        namespace: oilscope
      type: Opaque
      stringData:
        DATABASE_URL: "postgresql://oil_tracker:{{ resolve_secrets_result.POSTGRES_PASSWORD }}@{{ app_db_host }}:5432/oil_tracker?sslmode=require"
        REDIS_URL: "redis://:{{ resolve_secrets_result.REDIS_PASSWORD }}@redis-master.oilscope.svc:6379/0"
  no_log: true

- name: Create the history secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-history
        namespace: oilscope
      type: Opaque
      stringData:
        DATABASE_URL: "postgresql+psycopg://oil_tracker:{{ resolve_secrets_result.POSTGRES_PASSWORD }}@{{ app_db_host }}:5432/oil_tracker?sslmode=require"
        RABBITMQ_URL: "amqp://oil_tracker:{{ resolve_secrets_result.RABBITMQ_PASSWORD }}@rabbitmq.oilscope.svc:5672/%2F"
  no_log: true

- name: Create the fetcher secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-fetcher
        namespace: oilscope
      type: Opaque
      stringData:
        OILPRICEAPI_KEY: "{{ resolve_secrets_result.OILPRICEAPI_KEY }}"
        DATABASE_URL: "postgres://oil_tracker:{{ resolve_secrets_result.POSTGRES_PASSWORD }}@{{ app_db_host }}:5432/oil_tracker?sslmode=require"
        RABBITMQ_URL: "amqp://oil_tracker:{{ resolve_secrets_result.RABBITMQ_PASSWORD }}@rabbitmq.oilscope.svc:5672/%2F"
  no_log: true

- name: Create the migrate secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-migrate
        namespace: oilscope
      type: Opaque
      stringData:
        PGPASSWORD: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
  no_log: true

- name: Create the cloudflared secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-cloudflared
        namespace: oilscope
      type: Opaque
      stringData:
        TUNNEL_TOKEN: "{{ cloudflared_tunnel_token }}"
  no_log: true