---
- name: Derive the registry host
  ansible.builtin.set_fact:
    k8s_app_registry_host: "{{ k8s_app_config.registry.repository.split('/')[0] }}"

- name: Create the GHCR image pull secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-pull
        namespace: oilscope
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ {'auths': {k8s_app_registry_host: {'username': k8s_app_config.registry.username, 'password': resolve_secrets_result.GHCR_TOKEN, 'auth': (k8s_app_config.registry.username ~ ':' ~ resolve_secrets_result.GHCR_TOKEN) | b64encode}}} | to_json | b64encode }}"
  no_log: true

- name: Create the database owner secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ k8s_app_db_owner_secret }}"
        namespace: oilscope
      type: kubernetes.io/basic-auth
      data:
        username: "{{ k8s_app_db_user | b64encode }}"
        password: "{{ resolve_secrets_result.POSTGRES_PASSWORD | b64encode }}"
  no_log: true

- name: Create the application secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-app
        namespace: oilscope
      type: Opaque
      data:
        DATABASE_URL: "{{ ('postgresql://' ~ k8s_app_db_user ~ ':' ~ resolve_secrets_result.POSTGRES_PASSWORD ~ '@' ~ k8s_app_db_host ~ ':5432/' ~ k8s_app_db_name ~ '?sslmode=require') | b64encode }}"
        REDIS_URL: "{{ ('redis://:' ~ resolve_secrets_result.REDIS_PASSWORD ~ '@redis-master.oilscope.svc:6379/0') | b64encode }}"
  no_log: true

- name: Create the history secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-history
        namespace: oilscope
      type: Opaque
      data:
        DATABASE_URL: "{{ ('postgresql+psycopg://' ~ k8s_app_db_user ~ ':' ~ resolve_secrets_result.POSTGRES_PASSWORD ~ '@' ~ k8s_app_db_host ~ ':5432/' ~ k8s_app_db_name ~ '?sslmode=require') | b64encode }}"
        RABBITMQ_URL: "{{ ('amqp://oil_tracker:' ~ resolve_secrets_result.RABBITMQ_PASSWORD ~ '@rabbitmq.oilscope.svc:5672/%2F') | b64encode }}"
  no_log: true

- name: Create the fetcher secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-fetcher
        namespace: oilscope
      type: Opaque
      data:
        OILPRICEAPI_KEY: "{{ resolve_secrets_result.OILPRICEAPI_KEY | b64encode }}"
        DATABASE_URL: "{{ ('postgres://' ~ k8s_app_db_user ~ ':' ~ resolve_secrets_result.POSTGRES_PASSWORD ~ '@' ~ k8s_app_db_host ~ ':5432/' ~ k8s_app_db_name ~ '?sslmode=require') | b64encode }}"
        RABBITMQ_URL: "{{ ('amqp://oil_tracker:' ~ resolve_secrets_result.RABBITMQ_PASSWORD ~ '@rabbitmq.oilscope.svc:5672/%2F') | b64encode }}"
  no_log: true

- name: Create the migrate secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-migrate
        namespace: oilscope
      type: Opaque
      data:
        PGPASSWORD: "{{ resolve_secrets_result.POSTGRES_PASSWORD | b64encode }}"
  no_log: true

- name: Create the cloudflared secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oilscope-cloudflared
        namespace: oilscope
      type: Opaque
      data:
        TUNNEL_TOKEN: "{{ cloudflared_tunnel_token | b64encode }}"
  no_log: true
