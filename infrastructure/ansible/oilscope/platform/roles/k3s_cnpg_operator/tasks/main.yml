---
- name: Read the project configuration
  ansible.builtin.set_fact:
    k3s_cnpg_operator_config: >-
      {{ lookup('ansible.builtin.file', k3s_cnpg_operator_config_file)
         | from_json }}

- name: Install the CloudNativePG operator
  kubernetes.core.helm:
    binary_path: "{{ k3s_cnpg_operator_helm_binary }}"
    release_name: "{{ k3s_cnpg_operator_release_name }}"
    release_namespace: "{{ k3s_cnpg_operator_release_namespace }}"
    chart_ref: "{{ k3s_cnpg_operator_chart_ref }}"
    chart_version: "{{ k3s_cnpg_operator_chart_version }}"
    kubeconfig: "{{ k3s_cnpg_operator_kubeconfig }}"
    values_files:
      - "{{ k3s_cnpg_operator_values_file }}"
    create_namespace: true
    atomic: true
    wait: true
    timeout: "{{ k3s_cnpg_operator_timeout }}"
