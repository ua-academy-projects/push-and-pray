---
- name: Compare the current AWS secret version
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_python }}"
      - -c
      - |
        import boto3
        import hmac
        import sys

        client = boto3.client("secretsmanager", region_name=sys.argv[1])
        desired = sys.stdin.buffer.read()
        try:
            response = client.get_secret_value(SecretId=sys.argv[2])
        except client.exceptions.ResourceNotFoundException:
            print("missing")
            raise SystemExit(0)

        current = response.get("SecretString")
        matches = current is not None and hmac.compare_digest(current.encode(), desired)
        print("same" if matches else "different")
      - "{{ secret_versions_target.scope }}"
      - "{{ secret_versions_target.secret_id }}"
    stdin: "{{ lookup('ansible.builtin.env', secret_versions_target.variable) }}"
    stdin_add_newline: false
  register: secret_versions_aws_comparison
  changed_when: false
  check_mode: false
  no_log: true

- name: Add the required AWS secret version
  ansible.builtin.include_tasks: upload_aws.yml
  when:
    - not ansible_check_mode
    - >-
      secret_versions_force_upload | bool
      or secret_versions_aws_comparison.stdout | trim != 'same'

- name: Report the current AWS secret version
  ansible.builtin.debug:
    msg: "{{ secret_versions_target.key }} already has the requested value"
  when:
    - not secret_versions_force_upload | bool
    - secret_versions_aws_comparison.stdout | trim == 'same'
