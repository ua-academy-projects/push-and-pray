---
# Not check_mode on the two tasks below - a skipped-in-check-mode result
# still carries the module's resolved arguments, and -vvv prints those
# uncensored even under no_log. An explicit `when` avoids ever producing
# that result for the tasks that carry the secret value.
- name: Write the value to the private temporary file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', secret_versions_item.variable) }}"
    dest: "{{ secret_versions_tempfile.path }}"
    mode: "0600"
  no_log: true
  when: not ansible_check_mode

- name: Add a new version
  ansible.builtin.command:
    argv:
      - aws
      - secretsmanager
      - put-secret-value
      - --secret-id
      - "{{ secret_versions_item.secret_id }}"
      - --region
      - "{{ secret_versions_region }}"
      - --secret-string
      - "file://{{ secret_versions_tempfile.path }}"
      - --query
      - VersionId
      - --output
      - text
  register: secret_versions_put
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Report the new version
  ansible.builtin.debug:
    msg: >-
      {{ secret_versions_item.secret_id }} <- ${{ secret_versions_item.variable }}
      (version {{ secret_versions_put.stdout | trim }})
  when: not ansible_check_mode
