---
# Not check_mode on the two tasks below - a skipped-in-check-mode result still
# carries the module's resolved arguments, and -vvv prints those uncensored
# even under no_log. Same reasoning as put_secret_version.yml on AWS.
- name: Write the value to the private temporary file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', secret_versions_item.variable) }}"
    dest: "{{ secret_versions_azure_tempfile.path }}"
    mode: "0600"
  no_log: true
  when: not ansible_check_mode

# --encoding utf-8 stores the file's bytes as the string value; without it the
# CLI would guess. The file carries no trailing newline (copy writes exactly
# the value), so the stored string matches the source variable byte for byte.
- name: Add a new version
  ansible.builtin.command:
    argv:
      - az
      - keyvault
      - secret
      - set
      - --vault-name
      - "{{ secret_versions_azure_vault }}"
      - --name
      - "{{ secret_versions_item.secret_id }}"
      - --file
      - "{{ secret_versions_azure_tempfile.path }}"
      - --encoding
      - utf-8
      - --query
      - id
      - --output
      - tsv
  register: secret_versions_azure_set
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Report the new version
  ansible.builtin.debug:
    msg: >-
      {{ secret_versions_item.secret_id }} <- ${{ secret_versions_item.variable }}
      (version {{ secret_versions_azure_set.stdout | trim | regex_replace('^.*/', '') }})
  when: not ansible_check_mode
