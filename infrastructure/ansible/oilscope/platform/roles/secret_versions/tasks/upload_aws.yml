---
- name: Add the AWS secret version
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_python }}"
      - -c
      - >-
        import boto3, sys;
        client = boto3.client('secretsmanager', region_name=sys.argv[1]);
        response = client.put_secret_value(
        SecretId=sys.argv[2], SecretString=sys.stdin.read());
        print(response['VersionId'])
      - "{{ secret_versions_target.scope }}"
      - "{{ secret_versions_target.secret_id }}"
    stdin: "{{ lookup('ansible.builtin.env', secret_versions_target.variable) }}"
    stdin_add_newline: false
  register: secret_versions_uploaded
  changed_when: true
  no_log: true

- name: Report the AWS secret version
  ansible.builtin.debug:
    msg: >-
      {{ secret_versions_target.key }} version
      {{ secret_versions_uploaded.stdout | trim }} added
