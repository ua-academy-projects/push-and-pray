---
- name: Verify Azure Key Vault data access
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_python }}"
      - -c
      - |
        import os
        import sys
        import urllib.parse
        import urllib.request

        vault = urllib.parse.quote(sys.argv[1], safe="")
        version = urllib.parse.quote(sys.argv[2], safe="")
        url = f"https://{vault}.vault.azure.net/secrets?api-version={version}&maxresults=1"
        request = urllib.request.Request(
            url,
            headers={"Authorization": f"Bearer {os.environ['AZURE_KEY_VAULT_TOKEN']}"},
        )
        with urllib.request.urlopen(request) as response:
            if response.status != 200:
                raise RuntimeError(f"unexpected Key Vault status: {response.status}")
      - "{{ secret_versions_target.scope }}"
      - "{{ secret_versions_azure_key_vault_api_version }}"
  environment:
    AZURE_KEY_VAULT_TOKEN: "{{ secret_versions_azure_token.stdout | trim }}"
  changed_when: false
  check_mode: false
  no_log: true
