---
- name: Find the latest enabled GCP secret version
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - list
      - "{{ secret_versions_target.secret_id }}"
      - "--project={{ secret_versions_target.scope }}"
      - --filter=state=ENABLED
      - --sort-by=~createTime
      - --limit=1
      - --format=value(name)
  register: secret_versions_gcp_latest
  changed_when: false
  check_mode: false

- name: Read the latest enabled GCP secret version
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - access
      - "{{ secret_versions_gcp_latest.stdout | trim }}"
      - "--secret={{ secret_versions_target.secret_id }}"
      - "--project={{ secret_versions_target.scope }}"
      - --out-file=-
    strip_empty_ends: false
  register: secret_versions_gcp_current
  changed_when: false
  check_mode: false
  no_log: true
  when: secret_versions_gcp_latest.stdout | trim | length > 0

- name: Compare the current GCP secret version
  ansible.builtin.set_fact:
    secret_versions_gcp_matches: >-
      {{ secret_versions_gcp_latest.stdout | trim | length > 0
         and (secret_versions_gcp_current.stdout | default(''))
             == lookup('ansible.builtin.env', secret_versions_target.variable) }}
  no_log: true

- name: Add the required GCP secret version
  ansible.builtin.include_tasks: upload_gcp.yml
  when:
    - not ansible_check_mode
    - >-
      secret_versions_force_upload | bool
      or not secret_versions_gcp_matches | bool

- name: Report the current GCP secret version
  ansible.builtin.debug:
    msg: "{{ secret_versions_target.key }} already has the requested value"
  when:
    - not secret_versions_force_upload | bool
    - secret_versions_gcp_matches | bool
