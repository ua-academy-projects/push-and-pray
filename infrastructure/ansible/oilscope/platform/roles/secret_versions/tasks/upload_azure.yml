---
- name: Add the Azure secret version
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_python }}"
      - -c
      - |
        import json
        import os
        import sys
        import urllib.parse
        import urllib.request

        vault = urllib.parse.quote(sys.argv[1], safe="")
        secret = urllib.parse.quote(sys.argv[2], safe="")
        version = urllib.parse.quote(sys.argv[3], safe="")
        url = f"https://{vault}.vault.azure.net/secrets/{secret}?api-version={version}"
        payload = json.dumps({"value": sys.stdin.read()}).encode()
        request = urllib.request.Request(
            url,
            data=payload,
            method="PUT",
            headers={
                "Authorization": f"Bearer {os.environ['AZURE_KEY_VAULT_TOKEN']}",
                "Content-Type": "application/json",
            },
        )
        with urllib.request.urlopen(request) as response:
            secret_id = json.load(response)["id"]
        print(secret_id.rstrip("/").rsplit("/", 1)[-1])
      - "{{ secret_versions_target.scope }}"
      - "{{ secret_versions_target.secret_id }}"
      - "{{ secret_versions_azure_key_vault_api_version }}"
    stdin: "{{ lookup('ansible.builtin.env', secret_versions_target.variable) }}"
    stdin_add_newline: false
  environment:
    AZURE_KEY_VAULT_TOKEN: "{{ secret_versions_azure_token.stdout | trim }}"
  register: secret_versions_uploaded
  changed_when: true
  no_log: true

- name: Report the Azure secret version
  ansible.builtin.debug:
    msg: >-
      {{ secret_versions_target.key }} version
      {{ secret_versions_uploaded.stdout | trim }} added
