---
- name: Read the project configuration
  ansible.builtin.set_fact:
    secret_versions_config: >-
      {{ lookup('ansible.builtin.file', secret_versions_config_file) | from_json }}

- name: Start with empty cloud secret catalogs
  ansible.builtin.set_fact:
    secret_versions_gcp_pairs: []
    secret_versions_azure_pairs: []
    secret_versions_catalog: []

- name: Collect GCP secret and workload pairs
  ansible.builtin.set_fact:
    secret_versions_gcp_pairs: >-
      {{ secret_versions_gcp_pairs
         + (secret_versions_vm.value.secret_mappings | default({}) | dict2items
            | map(attribute='value') | unique | list
            | zip_longest([], fillvalue=secret_versions_vm.key) | list) }}
  loop: "{{ secret_versions_config.vms | dict2items }}"
  loop_control:
    loop_var: secret_versions_vm
    label: "{{ secret_versions_vm.key }}"
  when: >-
    (secret_versions_vm.value.cloud
     | default(secret_versions_config.default_cloud)) == 'gcp'

- name: Collect Azure secret and workload pairs
  ansible.builtin.set_fact:
    secret_versions_azure_pairs: >-
      {{ secret_versions_azure_pairs
         + (secret_versions_vm.value.secret_mappings | default({}) | dict2items
            | map(attribute='value') | unique | list
            | zip_longest([], fillvalue=secret_versions_vm.key) | list) }}
  loop: "{{ secret_versions_config.vms | dict2items }}"
  loop_control:
    loop_var: secret_versions_vm
    label: "{{ secret_versions_vm.key }}"
  when: >-
    (secret_versions_vm.value.cloud
     | default(secret_versions_config.default_cloud)) == 'azure'

- name: Derive a variable name for every secret
  ansible.builtin.set_fact:
    secret_versions_ids: >-
      {{ (secret_versions_gcp_pairs + secret_versions_azure_pairs)
         | map(attribute='0') | unique | sort | list }}
    secret_versions_prefix: >-
      {{ secret_versions_config.name_prefix }}-{{ secret_versions_config.environment }}-

- name: Prepare short and fully qualified variable names
  ansible.builtin.set_fact:
    secret_versions_short_names: >-
      {{ secret_versions_ids
         | map('regex_replace', '^' ~ (secret_versions_prefix | regex_escape), '')
         | map('upper') | map('regex_replace', '[^A-Z0-9]', '_') | list }}
    secret_versions_full_names: >-
      {{ secret_versions_ids
         | map('upper') | map('regex_replace', '[^A-Z0-9]', '_') | list }}

- name: Choose unambiguous variable names
  ansible.builtin.set_fact:
    secret_versions_variables: >-
      {{ secret_versions_short_names
         if (secret_versions_short_names | unique | length)
            == (secret_versions_short_names | length)
         else secret_versions_full_names }}

- name: Map secret IDs to operator environment variables
  ansible.builtin.set_fact:
    secret_versions_variable_by_id: >-
      {{ dict(secret_versions_ids | zip(secret_versions_variables)) }}

- name: Build the GCP upload catalog
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog + [{
           'cloud': 'gcp',
           'secret_id': item,
           'variable': secret_versions_variable_by_id[item],
           'read_by': secret_versions_gcp_pairs
                      | selectattr('0', 'eq', item)
                      | map(attribute='1') | sort | list
         }] }}
  loop: "{{ secret_versions_gcp_pairs | map(attribute='0') | unique | sort | list }}"
  loop_control:
    label: "{{ item }}"

- name: Build the Azure upload catalog
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog + [{
           'cloud': 'azure',
           'secret_id': item,
           'variable': secret_versions_variable_by_id[item],
           'read_by': secret_versions_azure_pairs
                      | selectattr('0', 'eq', item)
                      | map(attribute='1') | sort | list
         }] }}
  loop: "{{ secret_versions_azure_pairs | map(attribute='0') | unique | sort | list }}"
  loop_control:
    label: "{{ item }}"

- name: Keep only the requested secrets
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog
         | selectattr('secret_id', 'in', secret_versions_only)
         | list
         + (secret_versions_catalog
            | rejectattr('secret_id', 'in', secret_versions_only)
            | selectattr('variable', 'in', secret_versions_only)
            | list) }}
  when: secret_versions_only | length > 0

- name: Show which variable feeds which cloud secret
  ansible.builtin.debug:
    msg: >-
      {{ item.variable }} -> {{ item.cloud }}:{{ item.secret_id }}
      (read by {{ item.read_by | join(', ') }})
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.cloud }}:{{ item.secret_id }}"

- name: Resolve the target GCP project
  ansible.builtin.set_fact:
    secret_versions_project: >-
      {{ secret_versions_project_id
         | default(lookup('ansible.builtin.env', 'GOOGLE_PROJECT'), true)
         | default((secret_versions_config.clouds.gcp | default({})).project_id
                   | default(''), true) }}

- name: Resolve the Azure subscription and resource group
  ansible.builtin.set_fact:
    secret_versions_azure_subscription_id: >-
      {{ lookup('ansible.builtin.env', 'AZURE_SUBSCRIPTION_ID')
         | default((secret_versions_config.clouds.azure | default({})).subscription_id
                   | default(''), true) }}
    secret_versions_azure_resource_group: >-
      {{ secret_versions_config.name_prefix }}-{{ secret_versions_config.environment }}-rg

- name: Prepare Azure CLI subscription arguments
  ansible.builtin.set_fact:
    secret_versions_azure_subscription_args: >-
      {{ ['--subscription', secret_versions_azure_subscription_id]
         if secret_versions_azure_subscription_id | length > 0 else [] }}

- name: Find values that are not in the environment
  ansible.builtin.set_fact:
    secret_versions_absent: >-
      {{ secret_versions_absent | default([])
         + ([item.variable]
            if lookup('ansible.builtin.env', item.variable) | length == 0
            else []) }}
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.variable }}"

- name: Refuse to upload incomplete secret versions
  ansible.builtin.fail:
    msg: >-
      Required secret source variables are missing or empty:
      {{ secret_versions_absent | unique | join(', ') }}
  when: secret_versions_absent | default([]) | length > 0

- name: Look for the GCP secret containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - describe
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - "--format=value(name)"
  loop: "{{ secret_versions_catalog | selectattr('cloud', 'eq', 'gcp') | list }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_gcp_describe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Find the Azure application Key Vault
  ansible.builtin.command:
    argv: >-
      {{ [secret_versions_azure_cli, 'keyvault', 'list',
          '--resource-group', secret_versions_azure_resource_group,
          '--query', "[?tags.service=='application-secrets'].name | [0]",
          '--output', 'tsv'] + secret_versions_azure_subscription_args }}
  register: secret_versions_azure_vault
  changed_when: false
  check_mode: false
  when: >-
    secret_versions_catalog | selectattr('cloud', 'eq', 'azure') | list | length > 0

- name: Require the Azure application Key Vault
  ansible.builtin.assert:
    that:
      - secret_versions_azure_vault.stdout | default('') | trim | length > 0
    fail_msg: >-
      No Terraform-managed application Key Vault was found in
      {{ secret_versions_azure_resource_group }}.
  when: >-
    secret_versions_catalog | selectattr('cloud', 'eq', 'azure') | list | length > 0

- name: Get an Azure Key Vault access token
  ansible.builtin.command:
    argv: >-
      {{ [secret_versions_azure_cli, 'account', 'get-access-token',
          '--resource', 'https://vault.azure.net',
          '--query', 'accessToken', '--output', 'tsv']
         + secret_versions_azure_subscription_args }}
  register: secret_versions_azure_token
  changed_when: false
  no_log: true
  check_mode: false
  when: >-
    secret_versions_catalog | selectattr('cloud', 'eq', 'azure') | list | length > 0

- name: Add a new version to every GCP secret
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - add
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - "--data-file=-"
      - "--format=value(name)"
    stdin: "{{ lookup('ansible.builtin.env', item.variable) }}"
    stdin_add_newline: false
  loop: "{{ secret_versions_catalog | selectattr('cloud', 'eq', 'gcp') | list }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_gcp_added
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Add a new version to every Azure secret
  ansible.builtin.uri:
    url: >-
      https://{{ secret_versions_azure_vault.stdout | trim }}.vault.azure.net/secrets/{{ item.secret_id }}?api-version={{ secret_versions_azure_keyvault_api_version }}
    method: PUT
    headers:
      Authorization: "Bearer {{ secret_versions_azure_token.stdout | trim }}"
      Content-Type: application/json
    body_format: json
    body:
      value: "{{ lookup('ansible.builtin.env', item.variable) }}"
    status_code: 200
    return_content: false
  loop: "{{ secret_versions_catalog | selectattr('cloud', 'eq', 'azure') | list }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_azure_added
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Report the new GCP versions
  ansible.builtin.debug:
    msg: >-
      gcp:{{ item.item.secret_id }} <- ${{ item.item.variable }}
      (version {{ item.stdout | trim | regex_replace('^.*/', '') }})
  loop: "{{ secret_versions_gcp_added.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"
  when: not ansible_check_mode

- name: Report the new Azure versions
  ansible.builtin.debug:
    msg: >-
      azure:{{ item.item.secret_id }} <- ${{ item.item.variable }}
  loop: "{{ secret_versions_azure_added.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"
  when: not ansible_check_mode
