---
- name: Read the project configuration
  ansible.builtin.set_fact:
    secret_versions_config: >-
      {{ lookup('ansible.builtin.file', secret_versions_config_file) | from_json }}
    secret_versions_records: []
    secret_versions_catalog: []
    secret_versions_absent: []

- name: Collect provider and secret records for every VM
  ansible.builtin.include_tasks: collect_vm.yml
  loop: "{{ secret_versions_config.vms | dict2items }}"
  loop_control:
    loop_var: secret_versions_vm
    label: "{{ secret_versions_vm.key }}"

- name: Build one upload target per provider and secret
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog + [{
           'cloud': item.cloud,
           'secret_id': item.secret_id,
           'variable': item.secret_id | upper | regex_replace('[^A-Z0-9]', '_'),
           'read_by': secret_versions_records
                      | selectattr('key', 'equalto', item.key)
                      | map(attribute='vm_name') | unique | sort | list
         }] }}
  loop: "{{ secret_versions_records | unique(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}"

- name: Keep only requested secrets or environment variable names
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog
         | selectattr('secret_id', 'in', secret_versions_only)
         | list
         + (secret_versions_catalog
            | rejectattr('secret_id', 'in', secret_versions_only)
            | selectattr('variable', 'in', secret_versions_only)
            | list) }}
  when: secret_versions_only | length > 0

- name: Show provider-specific upload targets
  ansible.builtin.debug:
    msg: >-
      {{ item.variable }} -> {{ item.cloud }}:{{ item.secret_id }}
      (read by {{ item.read_by | join(', ') }})
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.cloud }}:{{ item.secret_id }}"

- name: Resolve cloud destinations
  ansible.builtin.set_fact:
    secret_versions_project: "{{ secret_versions_config.clouds.gcp.project_id }}"
    secret_versions_aws_region: >-
      {{ secret_versions_config.clouds.aws.locations[
           secret_versions_config.defaults.location_profile
         ].region }}

- name: Find values absent from the controller environment
  ansible.builtin.set_fact:
    secret_versions_absent: >-
      {{ secret_versions_absent
         + ([item.variable]
            if lookup('ansible.builtin.env', item.variable) | length == 0
            else []) }}
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.variable }}"

- name: Refuse an incomplete upload
  ansible.builtin.assert:
    that:
      - secret_versions_absent | unique | length == 0
    fail_msg: >-
      Required secret source variables are missing or empty:
      {{ secret_versions_absent | unique | join(', ') }}

- name: Look for GCP Secret Manager containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - describe
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - "--format=value(name)"
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.secret_id }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.cloud == 'gcp'

- name: Add GCP secret versions
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - add
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - "--data-file=-"
      - "--format=value(name)"
    stdin: "{{ lookup('ansible.builtin.env', item.variable) }}"
    stdin_add_newline: false
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_gcp_added
  changed_when: true
  no_log: true
  when:
    - item.cloud == 'gcp'
    - not ansible_check_mode

- name: Look for AWS SSM parameters
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - ssm
      - get-parameter
      - --region
      - "{{ secret_versions_aws_region }}"
      - --name
      - "{{ item.secret_id }}"
      - --query
      - Parameter.Name
      - --output
      - text
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.secret_id }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.cloud == 'aws'

- name: Create or update AWS Standard SecureString parameters
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - ssm
      - put-parameter
      - --region
      - "{{ secret_versions_aws_region }}"
      - --name
      - "{{ item.secret_id }}"
      - --type
      - SecureString
      - --tier
      - Standard
      - --value
      - file:///dev/stdin
      - --overwrite
      - --query
      - Version
      - --output
      - text
    stdin: "{{ lookup('ansible.builtin.env', item.variable) }}"
    stdin_add_newline: false
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_aws_added
  changed_when: true
  no_log: true
  when:
    - item.cloud == 'aws'
    - not ansible_check_mode

- name: Report uploaded versions
  ansible.builtin.debug:
    msg: >-
      {{ item.item.cloud }}:{{ item.item.secret_id }} from {{ item.item.variable }}
      (version {{ item.stdout | trim | regex_replace('^.*/', '') }})
  loop: >-
    {{ (secret_versions_gcp_added.results | default([]))
       + (secret_versions_aws_added.results | default([])) }}
  loop_control:
    label: "{{ item.item.cloud }}:{{ item.item.secret_id }}"
  when:
    - not ansible_check_mode
    - not item.skipped | default(false)
