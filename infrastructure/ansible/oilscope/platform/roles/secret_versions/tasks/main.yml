---
- name: Read the project configuration
  ansible.builtin.set_fact:
    secret_versions_config: >-
      {{ lookup('ansible.builtin.file', secret_versions_config_file) | from_json }}

- name: Initialize secret upload state
  ansible.builtin.set_fact:
    secret_versions_target_map: {}
    secret_versions_variable_map: {}
    secret_versions_catalog: []
    secret_versions_absent: []

- name: Collect secret targets for each VM
  ansible.builtin.include_tasks: collect_vm.yml
  loop: "{{ secret_versions_config.vms | dict2items }}"
  loop_control:
    loop_var: secret_versions_vm
    label: "{{ secret_versions_vm.key }}"

- name: Map secret IDs to operator environment variables
  ansible.builtin.set_fact:
    secret_versions_variable_map: >-
      {{ secret_versions_variable_map | combine({
           item: item | upper | regex_replace('[^A-Z0-9]', '_')
         }) }}
  loop: >-
    {{ secret_versions_target_map.values()
       | map(attribute='secret_id') | unique | sort | list }}
  loop_control:
    label: "{{ item }}"

- name: Build the upload catalog
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog + [
           item.value | combine({
             'variable': secret_versions_variable_map[item.value.secret_id]
           })
         ] }}
  loop: "{{ secret_versions_target_map | dict2items | sort(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}"

- name: Select requested secret containers
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ ((secret_versions_catalog
           | selectattr('secret_id', 'in', secret_versions_only) | list)
          + (secret_versions_catalog
             | selectattr('variable', 'in', secret_versions_only) | list))
         | unique(attribute='key') | list }}
  when: secret_versions_only | length > 0

- name: Show the upload plan
  ansible.builtin.debug:
    msg: >-
      {{ item.variable }} -> {{ item.cloud }}/{{ item.scope }}/{{ item.secret_id }}
      (read by {{ item.read_by | join(', ') }})
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.key }}"

- name: Find missing source values
  ansible.builtin.set_fact:
    secret_versions_absent: >-
      {{ secret_versions_absent
         + ([item]
            if lookup('ansible.builtin.env', item) | length == 0
            else []) }}
  loop: >-
    {{ secret_versions_catalog
       | map(attribute='variable') | unique | sort | list }}

- name: Refuse an incomplete upload
  ansible.builtin.fail:
    msg: >-
      Required secret source variables are missing or empty:
      {{ secret_versions_absent | join(', ') }}
  when: secret_versions_absent | length > 0

- name: Verify every secret container
  ansible.builtin.include_tasks: "validate_{{ secret_versions_target.cloud }}.yml"
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    loop_var: secret_versions_target
    label: "{{ secret_versions_target.key }}"

- name: Add every secret version
  ansible.builtin.include_tasks: "upload_{{ secret_versions_target.cloud }}.yml"
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    loop_var: secret_versions_target
    label: "{{ secret_versions_target.key }}"
  when: not ansible_check_mode
