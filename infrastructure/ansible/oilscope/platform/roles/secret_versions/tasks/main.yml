---
- name: Read the project configuration
  ansible.builtin.set_fact:
    secret_versions_config: >-
      {{ lookup('ansible.builtin.file', secret_versions_config_file) | from_json }}
    secret_versions_targets: []
    secret_versions_targets_with_requirements: []
    secret_versions_catalog: {}
    secret_versions_catalog_list: []
    secret_versions_absent: []
    secret_versions_existing_keys: []
    secret_versions_generated_values: {}

- name: Collect workload cloud targets
  ansible.builtin.set_fact:
    secret_versions_targets: >-
      {{ secret_versions_targets + [{
           'cloud': item.value.cloud | default(secret_versions_config.default_cloud),
           'location': item.value.location,
           'role': item.value.role
         }] }}
  loop: "{{ secret_versions_config.vms | dict2items }}"
  when: item.value.role != 'bastion'

- name: Collect application roles that need secrets
  ansible.builtin.set_fact:
    secret_versions_roles: >-
      {{ secret_versions_targets | map(attribute='role') | unique | list }}

- name: Read each role's secret requirements
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../{{ item }}/vars/secrets.yml"
    name: secret_versions_role_requirements
  loop: "{{ secret_versions_roles | unique }}"
  register: secret_versions_role_files

- name: Index secret requirements by role
  ansible.builtin.set_fact:
    secret_versions_requirements_by_role: >-
      {{ secret_versions_requirements_by_role | default({})
         | combine({
             item.item: item.ansible_facts.secret_versions_role_requirements
           }) }}
  loop: "{{ secret_versions_role_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Attach role requirements to cloud targets
  ansible.builtin.set_fact:
    secret_versions_targets_with_requirements: >-
      {{ secret_versions_targets_with_requirements + [
           item | combine({
             'secrets': secret_versions_selected_requirements
           })
         ] }}
  loop: "{{ secret_versions_targets }}"
  loop_control:
    label: >-
      {{ item.cloud }}/{{ item.location }}/{{ item.role }}
  vars:
    secret_versions_runtime_envs: >-
      {{ ['POSTGRES_PASSWORD', 'HISTORY_POSTGRES_PASSWORD',
          'FETCHER_POSTGRES_PASSWORD', 'UI_POSTGRES_PASSWORD', 'OILPRICEAPI_KEY']
         if secret_versions_config.database_mode == 'postgres_extensions'
         else ['POSTGRES_PASSWORD', 'HISTORY_POSTGRES_PASSWORD',
               'RABBITMQ_PASSWORD', 'REDIS_PASSWORD', 'OILPRICEAPI_KEY'] }}
    secret_versions_mode_requirements: >-
      {{ secret_versions_requirements_by_role[item.role]
         | dict2items
         | selectattr('value.runtime_env', 'in', secret_versions_runtime_envs)
         | list }}
    secret_versions_selected_requirements: >-
      {{ secret_versions_mode_requirements
         | rejectattr('value.source_env', 'equalto', 'DB_PASSWORD_ADMIN')
         | list
         if secret_versions_config.database_mode == 'managed' and item.cloud == 'aws'
         else secret_versions_mode_requirements }}

- name: Build the provider upload catalog
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog | combine({
           item.0.cloud ~ '/' ~ secret_versions_scope ~ '/' ~ secret_versions_physical_id: {
             'cloud': item.0.cloud,
             'project': secret_versions_project,
             'region': secret_versions_region,
             'runtime_variable': item.1.value.runtime_env,
             'logical_secret_id': item.1.value.secret_id,
             'source_env': item.1.value.source_env,
             'secret_id': secret_versions_physical_id
           }
         }) }}
  vars:
    secret_versions_provider_location: >-
      {{ secret_versions_config.locations[item.0.location][item.0.cloud] }}
    secret_versions_project: >-
      {{ secret_versions_config.clouds.gcp.project_id
         if item.0.cloud == 'gcp' else '' }}
    secret_versions_region: "{{ secret_versions_provider_location.region }}"
    secret_versions_scope: >-
      {{ secret_versions_project
         if item.0.cloud == 'gcp'
         else secret_versions_region }}
    secret_versions_physical_id: >-
      {{ secret_versions_config.name_prefix ~ '-'
         ~ secret_versions_config.environment ~ '-'
         ~ item.1.value.secret_id }}
  loop: "{{ secret_versions_targets_with_requirements | subelements('secrets') }}"
  loop_control:
    label: "{{ item.0.cloud }}/{{ item.0.location }}/{{ item.1.value.secret_id }}"

- name: Select requested secrets
  ansible.builtin.set_fact:
    secret_versions_catalog_list: "{{ secret_versions_catalog_list + [item] }}"
  vars:
    secret_versions_selectors:
      - "{{ item.runtime_variable }}"
      - "{{ item.source_env }}"
      - "{{ item.logical_secret_id }}"
      - "{{ item.secret_id }}"
  loop: "{{ secret_versions_catalog.values() | list }}"
  when: >-
    secret_versions_only | length == 0
    or secret_versions_only | intersect(secret_versions_selectors) | length > 0

- name: Split the upload catalog by provider
  ansible.builtin.set_fact:
    secret_versions_gcp_catalog: >-
      {{ secret_versions_catalog_list | selectattr('cloud', 'eq', 'gcp') | list }}
    secret_versions_aws_catalog: >-
      {{ secret_versions_catalog_list | selectattr('cloud', 'eq', 'aws') | list }}
    secret_versions_azure_catalog: >-
      {{ secret_versions_catalog_list | selectattr('cloud', 'eq', 'azure') | unique(attribute='secret_id') | list }}

- name: Require the Azure secret vault
  ansible.builtin.assert:
    that: secret_versions_config.clouds.azure.key_vault_name | default('') | length > 0
    fail_msg: Set clouds.azure.key_vault_name to the existing application Key Vault.
  when: secret_versions_azure_catalog | length > 0

- name: Look for Azure secrets
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_azure }}"
      - keyvault
      - secret
      - show
      - "--vault-name={{ secret_versions_config.clouds.azure.key_vault_name }}"
      - "--name={{ item.secret_id }}"
      - --query=id
      - --output=tsv
  loop: "{{ secret_versions_catalog_list | selectattr('cloud', 'eq', 'azure') | list }}"
  register: secret_versions_azure_containers
  changed_when: false
  failed_when:
    - secret_versions_azure_containers.rc != 0
    - "'SecretNotFound' not in secret_versions_azure_containers.stderr"
  check_mode: false

- name: Look for GCP secret containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - describe
      - "{{ item.secret_id }}"
      - "--project={{ item.project }}"
      - "--format=value(name)"
  loop: "{{ secret_versions_gcp_catalog }}"
  register: secret_versions_gcp_containers
  changed_when: false
  failed_when:
    - secret_versions_gcp_containers.rc != 0
    - "'NOT_FOUND:' not in secret_versions_gcp_containers.stderr"
  check_mode: false

- name: Look for AWS secret containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - secretsmanager
      - describe-secret
      - "--secret-id={{ item.secret_id }}"
      - "--region={{ item.region }}"
      - "--query=ARN"
      - "--output=text"
  loop: "{{ secret_versions_aws_catalog }}"
  register: secret_versions_aws_containers
  changed_when: false
  failed_when:
    - secret_versions_aws_containers.rc != 0
    - "'(ResourceNotFoundException)' not in secret_versions_aws_containers.stderr"
  check_mode: false

- name: Record existing provider secrets
  ansible.builtin.set_fact:
    secret_versions_existing_keys: >-
      {{ secret_versions_existing_keys + [secret_versions_result_key] }}
  vars:
    secret_versions_result_key: >-
      {{ item.item.cloud ~ '/'
         ~ (item.item.project if item.item.cloud == 'gcp' else item.item.region)
         ~ '/' ~ item.item.secret_id }}
  loop: >-
    {{ (secret_versions_gcp_containers.results | default([]))
       + (secret_versions_aws_containers.results | default([]))
       + (secret_versions_azure_containers.results | default([])) }}
  loop_control:
    label: "{{ secret_versions_result_key }}"
  when: item.rc == 0

- name: Generate missing internal service credentials
  ansible.builtin.set_fact:
    secret_versions_generated_values: >-
      {{ secret_versions_generated_values
         | combine({item.source_env: lookup('ansible.builtin.pipe',
                                            'openssl rand -hex 32')}) }}
  vars:
    secret_versions_item_key: >-
      {{ item.cloud ~ '/'
         ~ (item.project if item.cloud == 'gcp' else item.region)
         ~ '/' ~ item.secret_id }}
  loop: "{{ secret_versions_catalog_list }}"
  when:
    - lookup('ansible.builtin.env', item.source_env) | length == 0
    - secret_versions_item_key not in secret_versions_existing_keys
    - item.source_env in secret_versions_generated_source_envs
  no_log: true

- name: Find missing source values for unprovisioned external secrets
  ansible.builtin.set_fact:
    secret_versions_absent: >-
      {{ secret_versions_absent | default([]) + [item.source_env] }}
  vars:
    secret_versions_item_key: >-
      {{ item.cloud ~ '/'
         ~ (item.project if item.cloud == 'gcp' else item.region)
         ~ '/' ~ item.secret_id }}
  loop: "{{ secret_versions_catalog_list }}"
  when:
    - lookup('ansible.builtin.env', item.source_env) | length == 0
    - secret_versions_item_key not in secret_versions_existing_keys
    - item.source_env not in secret_versions_generated_values
  no_log: true

- name: Refuse an incomplete upload
  ansible.builtin.fail:
    msg: >-
      Required secret source variables are missing or empty:
      {{ secret_versions_absent | default([]) | unique | join(', ') }}
  when: secret_versions_absent | default([]) | length > 0

- name: Create missing GCP secret containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - create
      - "{{ item.item.secret_id }}"
      - "--project={{ item.item.project }}"
      - "--replication-policy=automatic"
  loop: "{{ secret_versions_gcp_containers.results }}"
  changed_when: true
  when:
    - item.rc != 0
    - "'NOT_FOUND:' in item.stderr"
    - not ansible_check_mode

- name: Create missing AWS secret containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - secretsmanager
      - create-secret
      - "--name={{ item.item.secret_id }}"
      - "--region={{ item.item.region }}"
  loop: "{{ secret_versions_aws_containers.results }}"
  changed_when: true
  when:
    - item.rc != 0
    - "'(ResourceNotFoundException)' in item.stderr"
    - not ansible_check_mode

- name: Add GCP secret versions
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - add
      - "{{ item.secret_id }}"
      - "--project={{ item.project }}"
      - "--data-file=-"
    stdin: >-
      {{ lookup('ansible.builtin.env', item.source_env)
         if lookup('ansible.builtin.env', item.source_env) | length > 0
         else secret_versions_generated_values[item.source_env] }}
    stdin_add_newline: false
  loop: "{{ secret_versions_gcp_catalog }}"
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      lookup('ansible.builtin.env', item.source_env) | length > 0 or
      item.source_env in secret_versions_generated_values

- name: Add AWS secret versions
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - secretsmanager
      - put-secret-value
      - "--secret-id={{ item.secret_id }}"
      - "--region={{ item.region }}"
      - "--secret-string=file:///dev/stdin"
    stdin: >-
      {{ lookup('ansible.builtin.env', item.source_env)
         if lookup('ansible.builtin.env', item.source_env) | length > 0
         else secret_versions_generated_values[item.source_env] }}
    stdin_add_newline: false
  loop: "{{ secret_versions_aws_catalog }}"
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      lookup('ansible.builtin.env', item.source_env) | length > 0 or
      item.source_env in secret_versions_generated_values

- name: Add Azure secret versions
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_azure }}"
      - keyvault
      - secret
      - set
      - "--vault-name={{ secret_versions_config.clouds.azure.key_vault_name }}"
      - "--name={{ item.secret_id }}"
      - --file=/dev/stdin
      - --encoding=utf-8
      - --output=none
    stdin: >-
      {{ lookup('ansible.builtin.env', item.source_env)
         if lookup('ansible.builtin.env', item.source_env) | length > 0
         else secret_versions_generated_values[item.source_env] }}
    stdin_add_newline: false
  loop: "{{ secret_versions_azure_catalog }}"
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      lookup('ansible.builtin.env', item.source_env) | length > 0 or
      item.source_env in secret_versions_generated_values
