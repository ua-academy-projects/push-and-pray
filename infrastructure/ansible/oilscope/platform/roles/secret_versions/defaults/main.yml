---
# Project configuration JSON selected by the dynamic inventory.
secret_versions_config_file: "{{ project_config_path | default('') }}"

# Optional GCP project override. The project configuration is used by default.
secret_versions_gcp_project_id: ""

# Upload a subset. Entries match a container ID or a variable name.
secret_versions_only: []

# Force a new version even when the current provider value already matches.
# The general deployment leaves this disabled; the explicit upload playbook
# enables it for deliberate rotation.
secret_versions_force_upload: false

secret_versions_gcloud: gcloud
secret_versions_python: "{{ ansible_playbook_python }}"
