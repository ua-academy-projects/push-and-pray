---
database_runtime_environment: >-
  {{
    database_compose_environment
    | combine({
      'DOCKER_CONFIG': database_docker_config_dir,
      'POSTGRES_PASSWORD': database_postgres_password,
      'POSTGRES_USER': database_postgres_user,
      'POSTGRES_DB': database_postgres_name,
      'POSTGRES_PULL_POLICY': 'never',
      'DATABASE_BIND_ADDRESS': database_bind_address | string,
      'DATABASE_HOST_PORT': database_host_port | string,
      'DATABASE_MODE': database_mode,
      'DATABASE_HOST': database_host,
      'DATABASE_PORT': database_port | string,
      'DATABASE_SSLMODE': database_sslmode,
      'RABBITMQ_PASSWORD': database_rabbitmq_password,
      'RABBITMQ_HOST_PORT': database_rabbitmq_port | string,
      'REDIS_PASSWORD': database_redis_password,
      'REDIS_BIND_ADDRESS': database_redis_bind_address,
      'REDIS_HOST_PORT': database_redis_port | string
    })
  }}
