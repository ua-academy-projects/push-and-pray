---
- name: Bring up the data-tier services
  community.docker.docker_compose_v2:
    project_src: "{{ database_compose_project_dir }}"
    files:
      - compose.yaml
    services: "{{ database_up_services }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
  environment: "{{ database_runtime_environment }}"
  no_log: true

- name: Apply database migrations
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ database_compose_project_name }}"
      - --file
      - "{{ database_compose_file }}"
      - run
      - --rm
      - --no-deps
      - "{{ database_migration_service }}"
  args:
    chdir: "{{ database_compose_project_dir }}"
  environment: "{{ database_runtime_environment }}"
  register: database_migrations
  changed_when: "'Applying ' in database_migrations.stdout"
  no_log: true
