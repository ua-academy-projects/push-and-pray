---
- name: Check the Compose definition
  ansible.builtin.stat:
    path: "{{ database_compose_file }}"
  register: database_compose_definition

- name: Validate the database deployment inputs
  ansible.builtin.assert:
    that:
      - database_compose_definition.stat.exists
      - database_mode in ['self_hosted', 'managed']
      - database_postgres_image is match('^.+:[0-9a-f]{40}$')
      - database_postgres_password | length > 0
      - database_redis_password | length > 0
      - database_mode != 'managed' or database_host | length > 0
      - database_mode != 'managed' or database_rabbitmq_password | length > 0
    fail_msg: >-
      Database deployment inputs are incomplete for {{ database_mode }} mode.
    quiet: true

- name: Reconcile the mode-specific runtime services
  ansible.builtin.import_tasks: runtime.yml

- name: Apply the shared migration set
  ansible.builtin.import_tasks: migrations.yml
