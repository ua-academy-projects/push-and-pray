---
- name: Pull the database runtime and migration image with transient credentials
  block:
    - name: Pull the database runtime and migration image
      ansible.builtin.command:
        argv:
          - docker
          - image
          - pull
          - "{{ database_postgres_image }}"
      environment:
        DOCKER_CONFIG: "{{ database_docker_config_dir }}"
      register: database_image_pull
      changed_when: >-
        'Downloaded newer image' in database_image_pull.stdout or
        'Downloaded newer image' in database_image_pull.stderr or
        'Pull complete' in database_image_pull.stdout or
        'Pull complete' in database_image_pull.stderr
  always:
    - name: Remove transient Docker registry credentials
      ansible.builtin.file:
        path: "{{ database_docker_config_dir }}"
        state: absent
      changed_when: false

- name: Start the database infrastructure services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ database_compose_project_name }}"
      - --file
      - "{{ database_compose_file }}"
      - up
      - --detach
      - --no-deps
      - --remove-orphans
      - "{{ item }}"
  args:
    chdir: "{{ database_compose_project_dir }}"
  environment: "{{ database_runtime_environment }}"
  register: database_compose_up
  changed_when: >-
    'Created' in database_compose_up.stderr or
    'Started' in database_compose_up.stderr or
    'Recreated' in database_compose_up.stderr
  no_log: true
  loop: "{{ database_runtime_services }}"

- name: Get the database infrastructure container IDs
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ database_compose_project_name }}"
      - --file
      - "{{ database_compose_file }}"
      - ps
      - --quiet
      - "{{ item }}"
  args:
    chdir: "{{ database_compose_project_dir }}"
  environment: "{{ database_runtime_environment }}"
  register: database_containers
  changed_when: false
  failed_when: database_containers.stdout | trim | length == 0
  no_log: true
  loop: "{{ database_runtime_services }}"

- name: Wait for the database infrastructure services to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}if .State.Health{{ '}}' }}{{ '{{' }}.State.Health.Status{{ '}}' }}{{ '{{' }}else{{ '}}' }}missing{{ '{{' }}end{{ '}}' }}"
      - "{{ item.stdout | trim }}"
  register: database_health
  changed_when: false
  retries: "{{ database_health_retries }}"
  delay: "{{ database_health_delay }}"
  until: database_health.stdout | trim == 'healthy'
  loop: "{{ database_containers.results }}"
  no_log: true
