---
- name: Validate Azure Monitor Agent inventory values
  ansible.builtin.assert:
    that:
      - azure_resource_group | default('') | length > 0
      - azure_identity_resource_id | default('') | length > 0
    fail_msg: >-
      Azure Monitor Agent requires the resource group and managed identity
      resource ID composed by the Azure dynamic inventory.

- name: Install the Azure Monitor Agent VM extension
  azure.azcollection.azure_rm_virtualmachineextension:
    auth_source: auto
    resource_group: "{{ azure_resource_group }}"
    virtual_machine_name: "{{ inventory_hostname }}"
    name: "{{ azure_monitor_agent_extension_name }}"
    publisher: "{{ azure_monitor_agent_publisher }}"
    virtual_machine_extension_type: "{{ azure_monitor_agent_type }}"
    type_handler_version: "{{ azure_monitor_agent_version }}"
    auto_upgrade_minor_version: true
    enable_automatic_upgrade: true
    settings:
      authentication:
        managedIdentity:
          identifier-name: mi_res_id
          identifier-value: "{{ azure_identity_resource_id }}"
  become: false
  delegate_to: localhost
