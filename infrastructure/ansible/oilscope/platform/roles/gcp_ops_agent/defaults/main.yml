---
gcp_ops_agent_installer_url: >-
  https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
gcp_ops_agent_installer_path: /var/tmp/add-google-cloud-ops-agent-repo.sh
gcp_ops_agent_version: latest
gcp_ops_agent_package: google-cloud-ops-agent
gcp_ops_agent_service: google-cloud-ops-agent
gcp_ops_agent_config_path: /etc/google-cloud-ops-agent/config.yaml
gcp_ops_agent_collect_docker_logs: "{{ 'workloads' in group_names }}"
