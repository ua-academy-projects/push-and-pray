---
- name: Create the K3s installer directory
  ansible.builtin.file:
    path: "{{ k3s_install_script_path | dirname }}"
    state: directory
    mode: "0755"

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: "{{ k3s_server_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Configure a common Flannel VXLAN MTU for multicloud networking
  ansible.builtin.copy:
    content: |
      {
        "Network": "{{ k3s_cluster_cidr }}",
        "EnableIPv4": true,
        "EnableIPv6": false,
        "Backend": {
          "Type": "vxlan",
          "Port": 8472,
          "DirectRouting": false,
          "MTU": {{ k3s_flannel_mtu }}
        }
      }
    dest: "{{ k3s_flannel_config_path }}"
    mode: "0600"
  notify: Restart K3s server

- name: Read the current Flannel VXLAN interface settings
  ansible.builtin.command:
    argv: [ip, -o, link, show, flannel.1]
  register: k3s_flannel_link
  changed_when: false
  failed_when: false

- name: Stop K3s when the existing Flannel interface has the wrong MTU
  ansible.builtin.systemd:
    name: k3s
    state: stopped
  when:
    - k3s_flannel_link.rc == 0
    - k3s_flannel_link.stdout is not search('mtu ' ~ (k3s_flannel_mtu | string) ~ ' ')

- name: Remove the stale Flannel VXLAN interface
  ansible.builtin.command:
    argv: [ip, link, delete, flannel.1]
  when:
    - k3s_flannel_link.rc == 0
    - k3s_flannel_link.stdout is not search('mtu ' ~ (k3s_flannel_mtu | string) ~ ' ')

- name: Start K3s after recreating the Flannel VXLAN interface
  ansible.builtin.systemd:
    name: k3s
    state: started
  when:
    - k3s_flannel_link.rc == 0
    - k3s_flannel_link.stdout is not search('mtu ' ~ (k3s_flannel_mtu | string) ~ ' ')

- name: Download the K3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    mode: "0755"

- name: Configure the desired K3s server state
  ansible.builtin.copy:
    content: |
      write-kubeconfig-mode: "0640"
      flannel-conf: {{ k3s_flannel_config_path }}
      {% if inventory_hostname == groups['k3s_server'][0] %}
      cluster-init: true
      {% endif %}
      {% if public_ip | default('') | length > 0 %}
      tls-san:
        - {{ public_ip }}
      {% endif %}
      {% if inventory_hostname != groups['k3s_server'][0] %}
      server: https://{{ hostvars[groups['k3s_server'][0]].internal_ip }}:6443
      token: {{ hostvars[groups['k3s_server'][0]].k3s_server_token }}
      {% endif %}
      kubelet-arg:
        - image-credential-provider-bin-dir=/var/lib/rancher/credentialprovider/bin
        - image-credential-provider-config=/var/lib/rancher/credentialprovider/config.yaml
    dest: "{{ k3s_server_config_path }}"
    mode: "0600"
  notify: Restart K3s server

- name: Read the installed K3s version
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  register: k3s_server_installed_version
  changed_when: false
  failed_when: false

- name: Install or upgrade the K3s server to the configured version
  ansible.builtin.command:
    cmd: "{{ k3s_install_script_path }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when:
    - k3s_version not in k3s_server_installed_version.stdout

- name: Apply K3s server configuration changes before exposing the token
  ansible.builtin.meta: flush_handlers

- name: Ensure the K3s server is running
  ansible.builtin.systemd:
    name: k3s
    state: started
    daemon_reload: true

- name: Read the K3s node token from the bootstrap control plane
  ansible.builtin.slurp:
    src: "{{ k3s_server_token_path }}"
  register: k3s_server_token_file
  when: inventory_hostname == groups['k3s_server'][0]
  no_log: true

- name: Retain the decoded join token for the following play
  ansible.builtin.set_fact:
    k3s_server_token: "{{ k3s_server_token_file.content | b64decode | trim }}"
  when: inventory_hostname == groups['k3s_server'][0]
  no_log: true

- name: Read the K3s kubeconfig for the controller play
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig_file
  no_log: true

- name: Retain the decoded kubeconfig for the following play
  ansible.builtin.set_fact:
    k3s_server_kubeconfig: "{{ k3s_server_kubeconfig_file.content | b64decode }}"
  no_log: true
