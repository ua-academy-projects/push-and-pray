---
- name: Resolve the subscription, the vault and the server
  ansible.builtin.set_fact:
    managed_database_credentials_subscription: >-
      {{ managed_database_credentials_config.clouds.azure.subscription_id | default('') }}
    managed_database_credentials_vault: >-
      {{ managed_database_credentials_key_vault_name
         | default(managed_database_credentials_config.clouds.azure.key_vault_name | default(''), true) }}
    managed_database_credentials_instance: "{{ managed_database_credentials_prefix }}-database"

- name: Fail when the subscription or the vault is unknown
  ansible.builtin.assert:
    that:
      - managed_database_credentials_subscription | length > 0
      - managed_database_credentials_vault | length > 0
    fail_msg: >-
      clouds.azure needs subscription_id and key_vault_name in the configuration
    quiet: true

- name: Address the server through Resource Manager
  ansible.builtin.set_fact:
    managed_database_credentials_server_url: >-
      https://management.azure.com/subscriptions/{{ managed_database_credentials_subscription
      }}/resourceGroups/{{ managed_database_credentials_prefix
      }}-rg/providers/Microsoft.DBforPostgreSQL/flexibleServers/{{ managed_database_credentials_instance
      }}?api-version={{ managed_database_credentials_azure_api_version }}

# The same variable name upload_secret_versions derives for this container:
# the ID with the project prefix dropped, upper-cased, non-alphanumerics to _.
- name: Name the environment variable that may hold the password
  ansible.builtin.set_fact:
    managed_database_credentials_variable: >-
      {{ managed_database_credentials_secret_id
         | regex_replace('^' ~ (managed_database_credentials_prefix ~ '-') | regex_escape, '')
         | upper | regex_replace('[^A-Z0-9]', '_') }}

- name: Take the password from the environment
  ansible.builtin.set_fact:
    managed_database_credentials_password: >-
      {{ lookup('ansible.builtin.env', managed_database_credentials_variable) }}
  no_log: true

# Not in the environment: read the version that was uploaded earlier. Needs
# getSecret on the vault, which a version manager does not have - exporting
# the variable is the way that needs no extra grant.
- name: Read the password from Key Vault
  ansible.builtin.command:
    argv:
      - "{{ managed_database_credentials_az_cli }}"
      - keyvault
      - secret
      - show
      - --vault-name
      - "{{ managed_database_credentials_vault }}"
      - --name
      - "{{ managed_database_credentials_secret_id }}"
      - --query
      - value
      - --output
      - tsv
  register: managed_database_credentials_stored
  changed_when: false
  no_log: true
  when: managed_database_credentials_password | length == 0

- name: Keep the stored password
  ansible.builtin.set_fact:
    managed_database_credentials_password: "{{ managed_database_credentials_stored.stdout }}"
  no_log: true
  when: managed_database_credentials_stored is not skipped

- name: Fail when no password is available
  ansible.builtin.assert:
    that: managed_database_credentials_password | length > 0
    fail_msg: >-
      no password for {{ managed_database_credentials_secret_id }}: export
      ${{ managed_database_credentials_variable }} (the value
      upload_secret_versions reads) or grant yourself getSecret on
      {{ managed_database_credentials_vault }}
    quiet: true

# The API takes the password in a request body. az would take it on the
# command line, where every process on the machine can read it.
- name: Get an access token for Resource Manager
  ansible.builtin.command:
    argv:
      - "{{ managed_database_credentials_az_cli }}"
      - account
      - get-access-token
      - --resource
      - https://management.azure.com/
      - --query
      - accessToken
      - --output
      - tsv
  register: managed_database_credentials_token
  changed_when: false
  no_log: true

- name: Read the server
  ansible.builtin.uri:
    url: "{{ managed_database_credentials_server_url }}"
    headers:
      Authorization: "Bearer {{ managed_database_credentials_token.stdout | trim }}"
    return_content: true
  register: managed_database_credentials_server
  check_mode: false
  no_log: true

# The administrator login is fixed when the server is created and cannot be
# renamed, so a mismatch is something only re-creating the server fixes.
- name: Fail when the administrator is not the application role
  ansible.builtin.assert:
    that: >-
      managed_database_credentials_server.json.properties.administratorLogin
      == managed_database_credentials_username
    fail_msg: >-
      {{ managed_database_credentials_instance }} was created with the
      administrator
      '{{ managed_database_credentials_server.json.properties.administratorLogin }}',
      but database.username is '{{ managed_database_credentials_username }}';
      the workloads connect as the administrator
    quiet: true

- name: Set the administrator's password
  ansible.builtin.uri:
    url: "{{ managed_database_credentials_server_url }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ managed_database_credentials_token.stdout | trim }}"
    body_format: json
    body:
      properties:
        administratorLoginPassword: "{{ managed_database_credentials_password }}"
    status_code: [200, 202]
  register: managed_database_credentials_update
  changed_when: true
  no_log: true
  when: not ansible_check_mode

# 202 means the server is still applying the change; the deployment that
# follows must not connect before it has.
- name: Wait for the server to apply the password
  ansible.builtin.uri:
    url: "{{ managed_database_credentials_update.azure_asyncoperation }}"
    headers:
      Authorization: "Bearer {{ managed_database_credentials_token.stdout | trim }}"
    return_content: true
  register: managed_database_credentials_operation
  until: managed_database_credentials_operation.json.status | default('') in ['Succeeded', 'Failed', 'Canceled']
  retries: "{{ managed_database_credentials_azure_poll_retries }}"
  delay: "{{ managed_database_credentials_azure_poll_delay }}"
  no_log: true
  when:
    - not ansible_check_mode
    - managed_database_credentials_update.status == 202

- name: Fail when the server refused the password
  ansible.builtin.assert:
    that: managed_database_credentials_operation.json.status == 'Succeeded'
    fail_msg: >-
      {{ managed_database_credentials_instance }} did not apply the password:
      {{ managed_database_credentials_operation.json.error | default({}) }}
    quiet: true
  when: managed_database_credentials_operation is not skipped

- name: Report
  ansible.builtin.debug:
    msg: >-
      azure: the administrator {{ managed_database_credentials_username }} of
      {{ managed_database_credentials_instance }} now has the password of
      {{ managed_database_credentials_secret_id }}
