---
- name: Read the project configuration
  ansible.builtin.set_fact:
    k3s_redis_config: >-
      {{ lookup('ansible.builtin.file', k3s_redis_config_file) | from_json }}

- name: Install Redis
  kubernetes.core.helm:
    binary_path: "{{ k3s_redis_helm_binary }}"
    release_name: "{{ k3s_redis_release_name }}"
    release_namespace: "{{ k3s_redis_release_namespace }}"
    chart_ref: "{{ k3s_redis_chart_ref }}"
    chart_version: "{{ k3s_redis_chart_version }}"
    kubeconfig: "{{ k3s_redis_kubeconfig }}"
    values_files:
      - "{{ k3s_redis_values_file }}"
    release_values:
      auth:
        existingSecret: "{{ k3s_redis_existing_secret }}"
      service:
        port: "{{ k3s_redis_service_port | int }}"
      persistence:
        size: "{{ k3s_redis_storage_size }}"
    atomic: true
    wait: true
    timeout: "{{ k3s_redis_timeout }}"
