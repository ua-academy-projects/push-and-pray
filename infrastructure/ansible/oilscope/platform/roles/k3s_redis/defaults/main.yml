---
k3s_redis_config_file: "{{ project_config_path | default('project-config.json') }}"
k3s_redis_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'HOME')
     ~ '/.kube/oilscope-'
     ~ k3s_redis_config.environment
     ~ '.yaml' }}
k3s_redis_values_file: >-
  {{ lookup('ansible.builtin.env', 'PWD')
     ~ '/infrastructure/kubernetes/values/redis.yaml' }}
k3s_redis_helm_binary: helm
k3s_redis_release_name: redis
k3s_redis_release_namespace: >-
  {{ k3s_redis_config.k3s.application.namespace }}
k3s_redis_chart_ref: oci://registry-1.docker.io/cloudpirates/redis
k3s_redis_chart_version: "0.35.4"
k3s_redis_existing_secret: >-
  {{ k3s_redis_config.name_prefix ~ '-application' }}
k3s_redis_storage_size: >-
  {{ k3s_redis_config.k3s.data_services.redis.storage_gb ~ 'Gi' }}
k3s_redis_service_port: >-
  {{ k3s_redis_config.service_ports.redis }}
k3s_redis_timeout: 10m0s
