---
- name: Wait for the queue to drain
  ansible.builtin.command:
    argv: "{{ database_transfer_local_psql + [database_transfer_queue_depth_sql] }}"
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  register: database_transfer_queue_depth
  changed_when: false
  retries: "{{ database_transfer_drain_retries }}"
  delay: "{{ database_transfer_drain_delay }}"
  until: database_transfer_queue_depth.stdout | trim == '0'

- name: Count the rows at the source
  ansible.builtin.command:
    argv: "{{ database_transfer_local_psql + [database_transfer_count_sql] }}"
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  register: database_transfer_source_count
  changed_when: false

- name: Bring the managed schema up to date
  ansible.builtin.command:
    argv: "{{ database_transfer_remote_run }}"
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  register: database_transfer_migrations
  changed_when: "'Applying ' in database_transfer_migrations.stdout"
  no_log: true

- name: Check what the target holds
  ansible.builtin.include_tasks: target_check.yml
  vars:
    database_transfer_target_psql: "{{ database_transfer_remote_psql }}"

- name: Dump the source inside its container
  ansible.builtin.command:
    argv: >-
      {{ database_transfer_compose_argv
         + ['exec', '-T', database_transfer_postgres_service]
         + database_transfer_dump_argv
         + ['-U', database_transfer_postgres_user, '-d', database_transfer_postgres_name,
            '-f', '/tmp/oilscope-transfer.dump'] }}
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  changed_when: true

- name: Copy the dump out of the container
  ansible.builtin.command:
    argv: >-
      {{ database_transfer_compose_argv
         + ['cp', database_transfer_postgres_service ~ ':/tmp/oilscope-transfer.dump',
            database_transfer_dump] }}
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  changed_when: true

- name: Restore into the managed database
  ansible.builtin.command:
    argv: >-
      {{ database_transfer_remote_run
         + database_transfer_restore_argv
         + ['--dbname', database_transfer_postgres_name,
            '/transfer/' ~ (database_transfer_dump | basename)] }}
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  changed_when: true
  no_log: true

- name: Count the rows at the target
  ansible.builtin.command:
    argv: "{{ database_transfer_remote_psql + [database_transfer_count_sql] }}"
  args:
    chdir: "{{ database_transfer_compose_project_dir }}"
  environment: "{{ database_transfer_runtime_environment }}"
  register: database_transfer_target_count
  changed_when: false
  no_log: true

- name: Verify every row arrived
  ansible.builtin.assert:
    that: database_transfer_target_count.stdout | trim == database_transfer_source_count.stdout | trim
    fail_msg: >-
      the managed database holds {{ database_transfer_target_count.stdout | trim }}
      observations, the container {{ database_transfer_source_count.stdout | trim }}
    quiet: true

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ database_transfer_source_count.stdout | trim }} observations moved to
      {{ database_transfer_managed_host }}; dump kept at {{ database_transfer_dump }}
