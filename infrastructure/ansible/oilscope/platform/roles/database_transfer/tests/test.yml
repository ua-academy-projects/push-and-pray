---
- name: Validate the database_transfer role
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Expect the role to refuse an unknown direction
      block:
        - name: Include the role with an unknown direction
          ansible.builtin.include_role:
            name: database_transfer
          vars:
            database_transfer_direction: sideways
            database_transfer_postgres_password: test-only

        - name: Note that the role did not refuse
          ansible.builtin.set_fact:
            database_transfer_refused: false
      rescue:
        - name: Note that the role refused
          ansible.builtin.set_fact:
            database_transfer_refused: true

    - name: Verify an unknown direction is rejected
      ansible.builtin.assert:
        that: database_transfer_refused
