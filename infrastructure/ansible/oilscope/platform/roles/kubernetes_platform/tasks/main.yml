---
- name: Load the shared project configuration
  ansible.builtin.include_vars:
    file: "{{ kubernetes_platform_project_config_path }}"
    name: kubernetes_platform_config

- name: Require the Kubernetes deployment configuration
  ansible.builtin.assert:
    that:
      - kubernetes_platform_config.kubernetes.enabled | bool
      - groups.k3s_server | length == 3
      - kubernetes_platform_config.default_cloud == 'gcp'
      - hostvars[groups.k3s_server[0]].k3s_server_kubeconfig is defined

- name: Create the controller Kubernetes work directory
  ansible.builtin.file:
    path: "{{ kubernetes_platform_work_dir }}"
    state: directory
    mode: "0700"

- name: Write a controller kubeconfig addressed to the public server IP
  ansible.builtin.copy:
    content: >-
      {{ hostvars[groups.k3s_server[0]].k3s_server_kubeconfig
         | replace('127.0.0.1', hostvars[groups.k3s_server[0]].public_ip) }}
    dest: "{{ kubernetes_platform_kubeconfig }}"
    mode: "0600"
  no_log: true

- name: Require the kubectl client
  ansible.builtin.command:
    argv: [kubectl, version, --client=true]
  changed_when: false

- name: Require the remaining controller tools
  ansible.builtin.command:
    argv: ["{{ item }}", version]
  changed_when: false
  loop: [helm, gcloud]

- name: Read application secrets from GCP Secret Manager
  ansible.builtin.command:
    argv:
      - gcloud
      - secrets
      - versions
      - access
      - latest
      - --project
      - "{{ kubernetes_platform_config.clouds.gcp.project_id }}"
      - --secret
      - "{{ item.value }}"
  loop: "{{ kubernetes_platform_config.kubernetes.secrets | dict2items }}"
  register: kubernetes_platform_secret_values
  changed_when: false
  no_log: true

- name: Create the application secret manifest
  ansible.builtin.template:
    src: application-secret.yaml.j2
    dest: "{{ kubernetes_platform_work_dir }}/application-secret.yaml"
    mode: "0600"
  no_log: true

- name: Apply the application secrets
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ kubernetes_platform_kubeconfig }}", apply, -f, "{{ kubernetes_platform_work_dir }}/application-secret.yaml"]
  changed_when: false
  no_log: true

- name: Derive the Artifact Registry hostname for Kubernetes image pulls
  ansible.builtin.set_fact:
    kubernetes_platform_registry_host: >-
      {{ kubernetes_platform_config.registry.repository.split('/') | first }}

- name: Obtain a short-lived Artifact Registry access token
  ansible.builtin.command:
    argv: [gcloud, auth, print-access-token]
  register: kubernetes_platform_registry_access_token
  changed_when: false
  no_log: true

- name: Render the Artifact Registry pull secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --namespace
      - "{{ kubernetes_platform_config.kubernetes.namespace | default('oilscope') }}"
      - create
      - secret
      - docker-registry
      - "{{ kubernetes_platform_registry_pull_secret_name }}"
      - "--docker-server={{ kubernetes_platform_registry_host }}"
      - --docker-username=oauth2accesstoken
      - "--docker-password={{ kubernetes_platform_registry_access_token.stdout | trim }}"
      - --dry-run=client
      - --output=yaml
  register: kubernetes_platform_registry_pull_secret_manifest
  changed_when: false
  no_log: true

- name: Apply the refreshed Artifact Registry pull secret
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ kubernetes_platform_kubeconfig }}", apply, -f, -]
    stdin: "{{ kubernetes_platform_registry_pull_secret_manifest.stdout }}"
  changed_when: false
  no_log: true

- name: Add the cert-manager Helm repository
  ansible.builtin.command:
    argv: [helm, repo, add, jetstack, https://charts.jetstack.io, --force-update]
  changed_when: false

- name: Install cert-manager with Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cert-manager
      - jetstack/cert-manager
      - --version
      - v1.17.2
      - --namespace
      - cert-manager
      - --create-namespace
      - --set
      - crds.enabled=true
      - --set
      - startupapicheck.enabled=false
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --wait
      - --timeout
      - 5m
  changed_when: false

- name: Add the CloudNativePG Helm repository
  ansible.builtin.command:
    argv: [helm, repo, add, cnpg, https://cloudnative-pg.github.io/charts, --force-update]
  changed_when: false

- name: Refresh the CloudNativePG Helm repository index
  ansible.builtin.command:
    argv: [helm, repo, update, cnpg]
  changed_when: false

- name: Install the CloudNativePG operator with Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cnpg
      - cnpg/cloudnative-pg
      - --version
      # Chart version 0.28.3 packages CloudNativePG operator appVersion 1.29.1.
      - 0.28.3
      - --namespace
      - cnpg-system
      - --create-namespace
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --wait
      - --timeout
      - 5m
  changed_when: false

- name: Remove superseded standalone messaging and database workloads
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --namespace
      - "{{ kubernetes_platform_config.kubernetes.namespace | default('oilscope') }}"
      - delete
      - statefulset
      - postgres
      - rabbitmq
      - --ignore-not-found=true
  changed_when: false

- name: Remove superseded standalone service endpoints
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --namespace
      - "{{ kubernetes_platform_config.kubernetes.namespace | default('oilscope') }}"
      - delete
      - service
      - postgres
      - rabbitmq
      - --ignore-not-found=true
  changed_when: false

- name: Recreate the migration job for the current database image
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --namespace
      - "{{ kubernetes_platform_config.kubernetes.namespace | default('oilscope') }}"
      - delete
      - job
      - oilscope-migrations
      - --ignore-not-found=true
  changed_when: false

- name: Render the cluster issuer and application workloads
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ kubernetes_platform_work_dir }}/{{ item }}"
    mode: "0600"
  loop: [cluster-issuer.yaml, platform.yaml]
  no_log: true

- name: Apply the cluster issuer and workloads
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ kubernetes_platform_kubeconfig }}", apply, -f, "{{ kubernetes_platform_work_dir }}/{{ item }}"]
  loop: [cluster-issuer.yaml, platform.yaml]
  changed_when: false

- name: Wait for the CloudNativePG cluster to become ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --namespace
      - "{{ kubernetes_platform_config.kubernetes.namespace | default('oilscope') }}"
      - wait
      - --for=condition=Ready
      - cluster/postgres
      - --timeout=10m
  changed_when: false

- name: Wait for the database migrations to complete
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_platform_kubeconfig }}"
      - --namespace
      - "{{ kubernetes_platform_config.kubernetes.namespace | default('oilscope') }}"
      - wait
      - --for=condition=complete
      - job/oilscope-migrations
      - --timeout=10m
  changed_when: false
