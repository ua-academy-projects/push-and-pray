---
- name: Read the project configuration
  ansible.builtin.set_fact:
    k3s_ingress_config: >-
      {{ lookup('ansible.builtin.file', k3s_ingress_config_file) | from_json }}

- name: Create the UI HTTPS redirect middleware
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_ingress_kubeconfig }}"
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template', 'https-redirect-middleware.yaml.j2')
         | from_yaml }}

- name: Expose the UI through Traefik
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_ingress_kubeconfig }}"
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template', 'ui-ingress.yaml.j2') | from_yaml }}

- name: Wait for cert-manager to create the production Certificate
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_ingress_kubeconfig }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ k3s_ingress_tls_secret_name }}"
    namespace: "{{ k3s_ingress_namespace }}"
  register: k3s_ingress_certificate
  changed_when: false
  retries: "{{ k3s_ingress_certificate_discovery_retries }}"
  delay: "{{ k3s_ingress_certificate_discovery_delay }}"
  until: k3s_ingress_certificate.resources | length > 0

- name: Wait for the production Certificate to become ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_ingress_kubeconfig }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ k3s_ingress_tls_secret_name }}"
    namespace: "{{ k3s_ingress_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_sleep: 5
    wait_timeout: "{{ k3s_ingress_certificate_wait_timeout }}"
  changed_when: false
