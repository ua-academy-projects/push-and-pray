---
k3s_ingress_config_file: >-
  {{ project_config_path | default('project-config.json') }}
k3s_ingress_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'HOME')
     ~ '/.kube/oilscope-'
     ~ k3s_ingress_config.environment
     ~ '.yaml' }}
k3s_ingress_namespace: >-
  {{ k3s_ingress_config.k3s.application.namespace }}
k3s_ingress_name: ui
k3s_ingress_class_name: traefik
k3s_ingress_hostname: >-
  {{ k3s_ingress_config.k3s.application.hostname }}
k3s_ingress_service_name: ui
k3s_ingress_service_port: 8080
k3s_ingress_https_redirect_middleware_name: ui-https-redirect
k3s_ingress_https_redirect_permanent: true
k3s_ingress_cluster_issuer: letsencrypt-production
k3s_ingress_tls_secret_name: >-
  {{ k3s_ingress_config.name_prefix ~ '-ui-tls' }}
k3s_ingress_certificate_discovery_retries: 30
k3s_ingress_certificate_discovery_delay: 2
k3s_ingress_certificate_wait_timeout: 600
