---
- name: Bring up the UI service
  community.docker.docker_compose_v2:
    project_src: "{{ ui_compose_project_dir }}"
    files:
      - compose.yaml
    services:
      - ui
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
  environment: "{{ ui_runtime_environment }}"
  no_log: true
