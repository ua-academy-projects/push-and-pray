---
- name: Deploy only UI
  environment:
    DOCKER_CONFIG: "{{ ui_docker_config_dir }}"
    POSTGRES_PASSWORD: "{{ ui_postgres_password }}"
    POSTGRES_USER: "{{ database_connection.username }}"
    POSTGRES_DB: "{{ database_connection.database_name }}"
    DATABASE_HOST: "{{ database_connection.host }}"
    DATABASE_PORT: "{{ database_connection.port | string }}"
    HISTORY_SERVICE_URL: >-
      http://{{ hostvars[groups['history'][0]].internal_ip }}:8001
  no_log: true
  block:
    - name: Pull the UI image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ ui_compose_project_dir }}"
        files: ["{{ ui_compose_file | basename }}"]
        project_name: "{{ ui_compose_project_name }}"
        services: [ui]
        policy: always

    - name: Start only UI
      community.docker.docker_compose_v2:
        project_src: "{{ ui_compose_project_dir }}"
        files: ["{{ ui_compose_file | basename }}"]
        project_name: "{{ ui_compose_project_name }}"
        services: [ui]
        dependencies: false
        pull: never
        state: present

    - name: Get the UI container ID
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - ps
          - --quiet
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_container
      changed_when: false
      failed_when: ui_container.stdout | trim | length == 0

- name: Wait for UI to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}if .State.Health{{ '}}' }}{{ '{{' }}.State.Health.Status{{ '}}' }}{{ '{{' }}else{{ '}}' }}missing{{ '{{' }}end{{ '}}' }}"
      - "{{ ui_container.stdout | trim }}"
  register: ui_health
  changed_when: false
  retries: "{{ ui_health_retries }}"
  delay: "{{ ui_health_delay }}"
  until: ui_health.stdout | trim == 'healthy'
