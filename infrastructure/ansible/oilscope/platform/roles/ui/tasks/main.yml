---
- name: Refuse the redis backend without a cache password
  ansible.builtin.assert:
    that: ui_session_backend != 'redis' or ui_redis_password | length > 0
    fail_msg: ui_redis_password must be set when the session backend is redis
    quiet: true

# Passwords reach the Compose file twice: as the value itself, and
# percent-encoded for the places that build a URL out of it.
- name: Deploy only UI
  environment:
    DOCKER_CONFIG: "{{ ui_docker_config_dir }}"
    POSTGRES_PASSWORD: "{{ ui_postgres_password }}"
    POSTGRES_USER: "{{ ui_postgres_user }}"
    POSTGRES_DB: "{{ ui_postgres_name }}"
    DATABASE_HOST: "{{ ui_database_host }}"
    DATABASE_PORT: "{{ ui_database_port | string }}"
    DATABASE_SSLMODE: "{{ ui_database_sslmode }}"
    SESSION_BACKEND: "{{ ui_session_backend }}"
    REDIS_HOST: "{{ ui_redis_host }}"
    REDIS_PORT: "{{ ui_redis_port | string }}"
    REDIS_PASSWORD_URL: "{{ ui_redis_password | urlencode }}"
    HISTORY_SERVICE_URL: "{{ ui_history_url }}"
  no_log: true
  block:
    - name: Pull the UI image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - pull
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_compose_pull
      changed_when: >-
        'Downloaded newer image' in ui_compose_pull.stdout or
        'Downloaded newer image' in ui_compose_pull.stderr or
        'Pull complete' in ui_compose_pull.stdout or
        'Pull complete' in ui_compose_pull.stderr

    - name: Start only UI
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - up
          - --detach
          - --no-deps
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_compose_up
      changed_when: >-
        'Created' in ui_compose_up.stderr or
        'Started' in ui_compose_up.stderr or
        'Recreated' in ui_compose_up.stderr

    - name: Get the UI container ID
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - ps
          - --quiet
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_container
      changed_when: false
      failed_when: ui_container.stdout | trim | length == 0

- name: Wait for UI to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}if .State.Health{{ '}}' }}{{ '{{' }}.State.Health.Status{{ '}}' }}{{ '{{' }}else{{ '}}' }}missing{{ '{{' }}end{{ '}}' }}"
      - "{{ ui_container.stdout | trim }}"
  register: ui_health
  changed_when: false
  retries: "{{ ui_health_retries }}"
  delay: "{{ ui_health_delay }}"
  until: ui_health.stdout | trim == 'healthy'
