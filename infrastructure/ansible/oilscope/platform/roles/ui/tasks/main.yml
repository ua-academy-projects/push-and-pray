---
- name: Load ui secret requirements
  ansible.builtin.include_vars:
    file: secrets.yml
    name: ui_secret_requirements

- name: Select UI secret requirements for the database mode
  ansible.builtin.set_fact:
    ui_required_secrets: >-
      {{ {'ui_postgres_password': ui_secret_requirements.ui_postgres_password}
         if ui_database_mode == 'postgres_extensions'
         else {'ui_redis_password': ui_secret_requirements.ui_redis_password} }}

- name: Resolve ui secrets
  ansible.builtin.include_role:
    name: oilscope.platform.resolve_secrets
  vars:
    resolve_secrets_mappings: "{{ ui_required_secrets }}"
  when: >-
    (ui_database_mode == 'postgres_extensions' and ui_postgres_password | length == 0) or
    (ui_database_mode == 'managed' and ui_redis_password | length == 0)

- name: Assign ui runtime credentials
  ansible.builtin.set_fact:
    ui_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
  no_log: true
  when:
    - ui_database_mode == 'postgres_extensions'
    - ui_postgres_password | length == 0

- name: Assign ui Redis credential
  ansible.builtin.set_fact:
    ui_redis_password: "{{ resolve_secrets_result.REDIS_PASSWORD }}"
  no_log: true
  when:
    - ui_database_mode == 'managed'
    - ui_redis_password | length == 0

- name: Stop Redis when PostgreSQL extensions mode is selected
  ansible.builtin.command:
    argv:
      - docker
      - container
      - rm
      - --force
      - "{{ ui_compose_project_name }}-redis-1"
  register: ui_remove_redis
  changed_when: ui_remove_redis.rc == 0
  failed_when: false
  when: ui_database_mode == 'postgres_extensions'

- name: Start Redis in managed mode
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ ui_compose_project_name }}"
      - --file
      - "{{ ui_compose_file }}"
      - up
      - --detach
      - --wait
      - redis
  args:
    chdir: "{{ ui_compose_project_dir }}"
  environment:
    HISTORY_SERVICE_URL: "{{ ui_history_service_url }}"
    REDIS_PASSWORD: "{{ ui_redis_password }}"
  register: ui_redis_up
  changed_when: >-
    'Created' in ui_redis_up.stderr or
    'Started' in ui_redis_up.stderr or
    'Recreated' in ui_redis_up.stderr
  no_log: true
  when: ui_database_mode == 'managed'

- name: Deploy only UI
  environment:
    DOCKER_CONFIG: "{{ ui_docker_config_dir }}"
    POSTGRES_PASSWORD: "{{ ui_postgres_password }}"
    POSTGRES_USER: "{{ ui_postgres_user }}"
    DATABASE_MODE: "{{ ui_database_mode }}"
    DATABASE_HOST: "{{ ui_database_host }}"
    DATABASE_PORT: "{{ ui_database_port }}"
    DATABASE_SSLMODE: "{{ ui_database_sslmode }}"
    REDIS_PASSWORD: "{{ ui_redis_password }}"
    HISTORY_SERVICE_URL: "{{ ui_history_service_url }}"
  no_log: true
  block:
    - name: Pull the UI image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - pull
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_compose_pull
      changed_when: >-
        'Downloaded newer image' in ui_compose_pull.stdout or
        'Downloaded newer image' in ui_compose_pull.stderr or
        'Pull complete' in ui_compose_pull.stdout or
        'Pull complete' in ui_compose_pull.stderr

    - name: Start only UI
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - up
          - --detach
          - --no-deps
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_compose_up
      changed_when: >-
        'Created' in ui_compose_up.stderr or
        'Started' in ui_compose_up.stderr or
        'Recreated' in ui_compose_up.stderr

    - name: Get the UI container ID
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ ui_compose_project_name }}"
          - --file
          - "{{ ui_compose_file }}"
          - ps
          - --quiet
          - ui
      args:
        chdir: "{{ ui_compose_project_dir }}"
      register: ui_container
      changed_when: false
      failed_when: ui_container.stdout | trim | length == 0

- name: Wait for UI to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}if .State.Health{{ '}}' }}{{ '{{' }}.State.Health.Status{{ '}}' }}{{ '{{' }}else{{ '}}' }}missing{{ '{{' }}end{{ '}}' }}"
      - "{{ ui_container.stdout | trim }}"
  register: ui_health
  changed_when: false
  retries: "{{ ui_health_retries }}"
  delay: "{{ ui_health_delay }}"
  until: ui_health.stdout | trim == 'healthy'
