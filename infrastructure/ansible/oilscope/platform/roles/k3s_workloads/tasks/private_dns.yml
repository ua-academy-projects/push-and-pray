---
- name: Select the private dashboard gateway from project configuration
  ansible.builtin.set_fact:
    k3s_workloads_private_gateway: "{{ (lookup('ansible.builtin.file', project_config_path) | from_json).kubernetes.private_access_gateway | default('primary') }}"

- name: Require a supported private dashboard gateway
  ansible.builtin.assert:
    that: k3s_workloads_private_gateway in ['primary', 'bastion']

- name: Read the primary node's Tailscale IPv4
  ansible.builtin.command:
    argv: [tailscale, ip, -4]
  register: k3s_workloads_private_dns_ip
  changed_when: false

- name: Require the primary node to be connected to Tailscale
  ansible.builtin.assert:
    that:
      - k3s_workloads_private_dns_ip.stdout | trim is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')

- name: Check whether the private dashboard proxy is ready on the bastion
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, oilscope-private-access]
  delegate_to: "{{ oilscope_bastion_host }}"
  register: k3s_workloads_private_gateway_service
  changed_when: false
  failed_when: false
  when: k3s_workloads_private_gateway == 'bastion'

- name: Keep the primary DNS answer until the private dashboard proxy is running
  ansible.builtin.set_fact:
    k3s_workloads_private_gateway_ready: "{{ k3s_workloads_private_gateway == 'bastion' and k3s_workloads_private_gateway_service.rc | default(1) == 0 }}"

- name: Read the bastion Tailscale IPv4
  ansible.builtin.command:
    argv: [tailscale, ip, -4]
  delegate_to: "{{ oilscope_bastion_host }}"
  become: false
  register: k3s_workloads_private_gateway_ip
  changed_when: false
  when: k3s_workloads_private_gateway_ready

- name: Select the private DNS answer
  ansible.builtin.set_fact:
    k3s_workloads_private_dns_target_ip: "{{ k3s_workloads_private_gateway_ip.stdout | trim if k3s_workloads_private_gateway_ready else k3s_workloads_private_dns_ip.stdout | trim }}"

- name: Require a connected private dashboard gateway
  ansible.builtin.assert:
    that: k3s_workloads_private_dns_target_ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')

- name: Install the small DNS resolver without a default system service
  ansible.builtin.apt:
    name: dnsmasq-base
    state: present

- name: Configure only the private OilScope names
  ansible.builtin.template:
    src: private-dns.conf.j2
    dest: /etc/oilscope-private-dns.conf
    owner: root
    group: root
    mode: '0644'
  register: k3s_workloads_private_dns_config

- name: Install the Tailscale-only resolver service
  ansible.builtin.copy:
    src: oilscope-private-dns.service
    dest: /etc/systemd/system/oilscope-private-dns.service
    owner: root
    group: root
    mode: '0644'
  register: k3s_workloads_private_dns_unit

- name: Keep the private resolver running
  ansible.builtin.systemd_service:
    name: oilscope-private-dns
    enabled: true
    daemon_reload: "{{ k3s_workloads_private_dns_unit.changed }}"
    state: "{{ 'restarted' if k3s_workloads_private_dns_config.changed or k3s_workloads_private_dns_unit.changed else 'started' }}"
