---
- name: Read the primary node's Tailscale IPv4
  ansible.builtin.command:
    argv: [tailscale, ip, -4]
  register: k3s_workloads_private_dns_ip
  changed_when: false

- name: Require the primary node to be connected to Tailscale
  ansible.builtin.assert:
    that:
      - k3s_workloads_private_dns_ip.stdout | trim is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')

- name: Install the small DNS resolver without a default system service
  ansible.builtin.apt:
    name: dnsmasq-base
    state: present

- name: Configure only the private OilScope names
  ansible.builtin.template:
    src: private-dns.conf.j2
    dest: /etc/oilscope-private-dns.conf
    owner: root
    group: root
    mode: '0644'
  register: k3s_workloads_private_dns_config

- name: Install the Tailscale-only resolver service
  ansible.builtin.copy:
    src: oilscope-private-dns.service
    dest: /etc/systemd/system/oilscope-private-dns.service
    owner: root
    group: root
    mode: '0644'
  register: k3s_workloads_private_dns_unit

- name: Keep the private resolver running
  ansible.builtin.systemd_service:
    name: oilscope-private-dns
    enabled: true
    daemon_reload: "{{ k3s_workloads_private_dns_unit.changed }}"
    state: "{{ 'restarted' if k3s_workloads_private_dns_config.changed or k3s_workloads_private_dns_unit.changed else 'started' }}"
