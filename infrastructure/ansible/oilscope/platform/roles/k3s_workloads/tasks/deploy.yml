---
- name: Deploy OilScope applications and UI ingress
  ansible.builtin.command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ lookup('ansible.builtin.template', 'apps.yaml.j2') }}"
  register: k3s_workloads_apps_apply
  changed_when: "'created' in k3s_workloads_apps_apply.stdout or 'configured' in k3s_workloads_apps_apply.stdout"

- name: Wait for OilScope applications
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, rollout, status, "deployment/{{ item }}", --timeout=180s]
  loop: [history, fetcher, ui]
  changed_when: false
