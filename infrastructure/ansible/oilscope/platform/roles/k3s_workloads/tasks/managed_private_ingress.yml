---
- name: Read the existing AKS Traefik service selector
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    api_version: v1
    kind: Service
    name: traefik
    namespace: kube-system
  register: k3s_workloads_public_ingress_service

- name: Require the existing public ingress controller
  ansible.builtin.assert:
    that:
      - k3s_workloads_public_ingress_service.resources | length == 1
      - k3s_workloads_public_ingress_service.resources[0].spec.selector | length > 0

- name: Expose only the private Traefik entry point within Azure
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: traefik-private
        namespace: kube-system
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
      spec:
        type: LoadBalancer
        selector: "{{ k3s_workloads_public_ingress_service.resources[0].spec.selector }}"
        loadBalancerSourceRanges:
          - "{{ k3s_workloads_config.network.cloud_cidrs.azure.vpc_cidr }}"
        ports:
          - name: private
            port: 80
            targetPort: 8081
            protocol: TCP

- name: Route only private management hostnames on the private entry point
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'managed-private-ingress.yaml.j2') | from_yaml_all | list }}"
