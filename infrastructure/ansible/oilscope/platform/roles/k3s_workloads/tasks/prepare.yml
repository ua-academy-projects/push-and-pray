---
- name: Read the active project configuration
  ansible.builtin.set_fact:
    k3s_workloads_config: "{{ lookup('ansible.builtin.file', project_config_path) | from_json }}"
    k3s_workloads_image_tag: "{{ lookup('ansible.builtin.env', 'OILSCOPE_IMAGE_TAG') }}"

- name: Require an application mode and image tag
  ansible.builtin.assert:
    that:
      - database_mode in ['managed', 'postgres_extensions']
      - k3s_workloads_image_tag | length > 0

- name: Read the active cloud registry from Terraform
  ansible.builtin.command:
    argv: [terraform, "-chdir={{ k3s_workloads_terraform_directory }}", output, -json, container_registry]
  delegate_to: localhost
  become: false
  register: k3s_workloads_registry_output
  changed_when: false

- name: Select the registry and database endpoint
  ansible.builtin.set_fact:
    k3s_workloads_registry: "{{ k3s_workloads_registry_output.stdout | from_json }}"
    k3s_workloads_database_host: "{{ managed_database.host if database_mode == 'managed' else 'oilscope-db-rw.oilscope.svc.cluster.local' }}"
    k3s_workloads_database_port: "{{ managed_database.port if database_mode == 'managed' else 5432 }}"
    k3s_workloads_database_sslmode: "{{ managed_database.sslmode if database_mode == 'managed' else 'require' }}"

- name: Require a registry for this cloud
  ansible.builtin.assert:
    that:
      - k3s_workloads_registry.cloud == oilscope_cloud
      - k3s_workloads_registry.images.history is defined
      - k3s_workloads_registry.images.fetcher is defined
      - k3s_workloads_registry.images.ui is defined

- name: Select the existing cloud secret IDs
  ansible.builtin.set_fact:
    k3s_workloads_secret_mappings: >-
      {{
        {
          'history_postgres': {'runtime_env': 'HISTORY_POSTGRES_PASSWORD', 'secret_id': 'db-password-history'},
          'fetcher_api': {'runtime_env': 'OILPRICEAPI_KEY', 'secret_id': 'oilpriceapi-key'}
        }
        | combine(
            {
              'rabbitmq': {'runtime_env': 'RABBITMQ_PASSWORD', 'secret_id': 'rabbitmq-password'},
              'redis': {'runtime_env': 'REDIS_PASSWORD', 'secret_id': 'redis-password'}
            }
            if database_mode == 'managed'
            else {
              'database_admin': {'runtime_env': 'POSTGRES_PASSWORD', 'secret_id': 'db-password-admin'},
              'fetcher_postgres': {'runtime_env': 'FETCHER_POSTGRES_PASSWORD', 'secret_id': 'db-password-fetcher'},
              'ui_postgres': {'runtime_env': 'UI_POSTGRES_PASSWORD', 'secret_id': 'db-password-ui'}
            }
          )
      }}

- name: Resolve application secrets through the existing cloud secret role
  ansible.builtin.include_role:
    name: oilscope.platform.resolve_secrets
  vars:
    resolve_secrets_mappings: "{{ k3s_workloads_secret_mappings }}"
    resolve_secrets_name_prefix: "{{ k3s_workloads_config.name_prefix }}"
    resolve_secrets_environment: "{{ k3s_workloads_config.environment }}"

- name: Build private application connection URLs
  ansible.builtin.set_fact:
    k3s_workloads_history_database_url: >-
      {{ 'postgresql+psycopg://' ~ k3s_workloads_config.database.admin_user ~ '_history:'
         ~ (resolve_secrets_result.HISTORY_POSTGRES_PASSWORD | urlencode | replace('/', '%2F'))
         ~ '@' ~ k3s_workloads_database_host ~ ':' ~ k3s_workloads_database_port
         ~ '/' ~ k3s_workloads_config.database.name
         ~ '?sslmode=' ~ k3s_workloads_database_sslmode }}
    k3s_workloads_fetcher_database_url: >-
      {{ 'postgres://' ~ k3s_workloads_config.database.admin_user ~ '_fetcher:'
         ~ (resolve_secrets_result.FETCHER_POSTGRES_PASSWORD | default('') | urlencode | replace('/', '%2F'))
         ~ '@' ~ k3s_workloads_database_host ~ ':' ~ k3s_workloads_database_port
         ~ '/' ~ k3s_workloads_config.database.name
         ~ '?sslmode=' ~ k3s_workloads_database_sslmode }}
    k3s_workloads_ui_database_url: >-
      {{ 'postgresql://' ~ k3s_workloads_config.database.admin_user ~ '_ui:'
         ~ (resolve_secrets_result.UI_POSTGRES_PASSWORD | default('') | urlencode | replace('/', '%2F'))
         ~ '@' ~ k3s_workloads_database_host ~ ':' ~ k3s_workloads_database_port
         ~ '/' ~ k3s_workloads_config.database.name
         ~ '?sslmode=' ~ k3s_workloads_database_sslmode }}
    k3s_workloads_rabbitmq_url: >-
      {{ 'amqp://' ~ k3s_workloads_config.database.admin_user ~ ':'
         ~ (resolve_secrets_result.RABBITMQ_PASSWORD | default('') | urlencode | replace('/', '%2F'))
         ~ '@rabbitmq:5672/oil_tracker' }}
    k3s_workloads_redis_url: >-
      redis://:{{ resolve_secrets_result.REDIS_PASSWORD | default('') | urlencode | replace('/', '%2F') }}@redis:6379/0
  no_log: true

- name: Get an Azure registry access token
  ansible.builtin.command:
    argv: [az, acr, login, "--name={{ k3s_workloads_registry.name }}", --expose-token, --query=accessToken, --output=tsv]
  delegate_to: localhost
  become: false
  register: k3s_workloads_registry_azure_token
  changed_when: false
  no_log: true
  when: oilscope_cloud == 'azure'

- name: Get an AWS registry access token
  ansible.builtin.command:
    argv: [aws, ecr, get-login-password, "--region={{ k3s_workloads_registry.region }}"]
  delegate_to: localhost
  become: false
  register: k3s_workloads_registry_aws_token
  changed_when: false
  no_log: true
  when: oilscope_cloud == 'aws'

- name: Get a GCP registry access token
  ansible.builtin.command:
    argv: [gcloud, auth, print-access-token]
  delegate_to: localhost
  become: false
  register: k3s_workloads_registry_gcp_token
  changed_when: false
  no_log: true
  when: oilscope_cloud == 'gcp'

- name: Select registry credentials
  ansible.builtin.set_fact:
    k3s_workloads_registry_username: "{{ {'azure': '00000000-0000-0000-0000-000000000000', 'aws': 'AWS', 'gcp': 'oauth2accesstoken'}[oilscope_cloud] }}"
    k3s_workloads_registry_token: >-
      {{
        {
          'azure': k3s_workloads_registry_azure_token.stdout | default(''),
          'aws': k3s_workloads_registry_aws_token.stdout | default(''),
          'gcp': k3s_workloads_registry_gcp_token.stdout | default('')
        }[oilscope_cloud] | trim
      }}
  no_log: true

- name: Require a registry access token
  ansible.builtin.assert:
    that: k3s_workloads_registry_token | length > 0
  no_log: true

- name: Require the Cloudflare token for certificate issuance
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | length > 0
  no_log: true
  when: k3s_workloads_config.cloudflare.enabled | default(false) | bool

- name: Create the namespace and shared configuration
  ansible.builtin.command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ lookup('ansible.builtin.template', 'config.yaml.j2') }}"
  register: k3s_workloads_config_apply
  changed_when: "'created' in k3s_workloads_config_apply.stdout or 'configured' in k3s_workloads_config_apply.stdout"

- name: Create Kubernetes Secrets
  ansible.builtin.command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  register: k3s_workloads_secrets_apply
  changed_when: "'created' in k3s_workloads_secrets_apply.stdout or 'configured' in k3s_workloads_secrets_apply.stdout"
  no_log: true

- name: Prepare CloudNativePG before application deployment
  ansible.builtin.import_tasks: cnpg.yml
  when: database_mode == 'postgres_extensions'

- name: Install the private Kubernetes UI
  ansible.builtin.import_tasks: headlamp.yml

- name: Install the private Homepage dashboard
  ansible.builtin.import_tasks: homepage.yml

- name: Install lightweight application monitoring
  ansible.builtin.import_tasks: monitoring.yml

- name: Remove the old K3s-managed Traefik resources
  ansible.builtin.command:
    argv: [kubectl, -n, kube-system, delete, helmchartconfig/traefik, helmchart/traefik, --ignore-not-found, --wait=true]
  register: k3s_workloads_old_traefik_delete
  changed_when: "'deleted' in k3s_workloads_old_traefik_delete.stdout"

- name: Wait for the old Traefik release to stop
  ansible.builtin.command:
    argv: [helm, -n, kube-system, list, --filter, '^traefik$', -q]
  register: k3s_workloads_old_traefik_release
  retries: 18
  delay: 5
  until: k3s_workloads_old_traefik_release.stdout | trim | length == 0
  changed_when: false
  when: "'deleted' in k3s_workloads_old_traefik_delete.stdout"

- name: Install the Traefik ingress controller from the control host
  kubernetes.core.helm:
    release_name: traefik
    release_namespace: kube-system
    chart_ref: oci://ghcr.io/traefik/helm/traefik
    chart_version: 41.6.0
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    wait: true
    release_values:
      deployment:
        kind: DaemonSet
      gateway:
        enabled: false
      service:
        enabled: false
      providers:
        kubernetesIngress:
          publishedService:
            enabled: false
      ports:
        web:
          hostPort: 80
          http:
            redirections:
              entryPoint: "{{ {'to': 'websecure', 'scheme': 'https', 'permanent': true} if k3s_workloads_config.cloudflare.enabled | default(false) | bool else {} }}"
        websecure:
          hostPort: 443

- name: Remove the old K3s Helm controller cert-manager resource
  ansible.builtin.command:
    argv: [kubectl, -n, kube-system, delete, helmchart/cert-manager, --ignore-not-found, --wait=true]
  register: k3s_workloads_old_cert_manager_delete
  changed_when: "'deleted' in k3s_workloads_old_cert_manager_delete.stdout"

- name: Wait for the old Helm controller release to stop
  ansible.builtin.command:
    argv: [helm, -n, cert-manager, list, --filter, '^cert-manager$', -q]
  register: k3s_workloads_old_cert_manager_release
  retries: 18
  delay: 5
  until: k3s_workloads_old_cert_manager_release.stdout | trim | length == 0
  changed_when: false
  when: "'deleted' in k3s_workloads_old_cert_manager_delete.stdout"

- name: Install cert-manager from its official chart
  kubernetes.core.helm:
    release_name: cert-manager
    release_namespace: cert-manager
    create_namespace: true
    chart_ref: oci://quay.io/jetstack/charts/cert-manager
    chart_version: v1.21.2
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    wait: true
    release_values:
      crds:
        enabled: true
  when: k3s_workloads_config.cloudflare.enabled | default(false) | bool

- name: Remove cert-manager when Cloudflare TLS is disabled
  kubernetes.core.helm:
    release_name: cert-manager
    release_namespace: cert-manager
    release_state: absent
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    wait: true
  when: not (k3s_workloads_config.cloudflare.enabled | default(false) | bool)

- name: Configure Let's Encrypt with Cloudflare DNS
  ansible.builtin.command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ lookup('ansible.builtin.template', 'issuer.yaml.j2') }}"
  register: k3s_workloads_issuer_apply
  retries: 12
  delay: 5
  until: k3s_workloads_issuer_apply.rc == 0
  changed_when: "'created' in k3s_workloads_issuer_apply.stdout or 'configured' in k3s_workloads_issuer_apply.stdout"
  when: k3s_workloads_config.cloudflare.enabled | default(false) | bool

- name: Wait for the Let's Encrypt issuer
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, wait, --for=condition=Ready, issuer/letsencrypt-prod, --timeout=120s]
  changed_when: false
  when: k3s_workloads_config.cloudflare.enabled | default(false) | bool

- name: Deploy the managed-mode RabbitMQ queue
  ansible.builtin.command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ lookup('ansible.builtin.template', 'managed.yaml.j2') }}"
  register: k3s_workloads_managed_apply
  changed_when: "'created' in k3s_workloads_managed_apply.stdout or 'configured' in k3s_workloads_managed_apply.stdout"
  when: database_mode == 'managed'

- name: Preserve the Redis data claim for the Helm release
  ansible.builtin.command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ lookup('ansible.builtin.template', 'redis-pvc.yaml.j2') }}"
  register: k3s_workloads_redis_pvc_apply
  changed_when: "'created' in k3s_workloads_redis_pvc_apply.stdout or 'configured' in k3s_workloads_redis_pvc_apply.stdout"
  when: database_mode == 'managed'

- name: Remove the old hand-written Redis deployment
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, delete, deployment/redis, --ignore-not-found]
  register: k3s_workloads_old_redis_delete
  changed_when: "'deleted' in k3s_workloads_old_redis_delete.stdout"
  when: database_mode == 'managed'

- name: Check ownership of the Redis Service
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, get, service, redis, -o, json]
  register: k3s_workloads_redis_service
  changed_when: false
  failed_when: >-
    k3s_workloads_redis_service.rc != 0 and
    'NotFound' not in k3s_workloads_redis_service.stderr
  when: database_mode == 'managed'

- name: Remove the old hand-written Redis Service
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, delete, service/redis, --ignore-not-found]
  register: k3s_workloads_old_redis_service_delete
  changed_when: "'deleted' in k3s_workloads_old_redis_service_delete.stdout"
  when:
    - database_mode == 'managed'
    - k3s_workloads_redis_service.rc == 0
    - >-
      ((k3s_workloads_redis_service.stdout | from_json).metadata.annotations | default({})).get('meta.helm.sh/release-name', '') == ''

- name: Install Redis from its Helm chart
  kubernetes.core.helm:
    release_name: redis
    release_namespace: oilscope
    chart_ref: oci://ghcr.io/cloudpirates-io/helm-charts/redis
    chart_version: 0.35.4
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    wait: true
    release_values:
      fullnameOverride: redis
      auth:
        enabled: true
        existingSecret: redis-env
        existingSecretPasswordKey: REDIS_PASSWORD
      persistence:
        existingClaim: redis-data
      extraConfig: |
        appendonly yes
        appendfsync everysec
        maxmemory-policy noeviction
  when: database_mode == 'managed'

- name: Wait for RabbitMQ
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, rollout, status, deployment/rabbitmq, --timeout=180s]
  changed_when: false
  when: database_mode == 'managed'

- name: Remove the Redis Helm release in PostgreSQL extensions mode
  kubernetes.core.helm:
    release_name: redis
    release_namespace: oilscope
    release_state: absent
    kubeconfig: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
    wait: true
  when: database_mode == 'postgres_extensions'

- name: Remove managed-mode dependencies in PostgreSQL extensions mode
  ansible.builtin.command:
    argv: [kubectl, -n, oilscope, delete, deployment/rabbitmq, deployment/redis, service/rabbitmq, service/redis, secret/rabbitmq-env, secret/redis-env, --ignore-not-found]
  register: k3s_workloads_managed_delete
  changed_when: "'deleted' in k3s_workloads_managed_delete.stdout"
  when: database_mode == 'postgres_extensions'
