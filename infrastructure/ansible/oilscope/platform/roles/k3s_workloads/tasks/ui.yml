---
- name: Check for a legacy Nginx service
  ansible.builtin.service_facts:

- name: Stop the old Nginx entry point
  ansible.builtin.systemd_service:
    name: nginx
    state: stopped
    enabled: false
  when: "'nginx.service' in ansible_facts.services"

- name: Check for the old Traefik Compose project
  ansible.builtin.stat:
    path: /opt/oilscope/proxy/compose.yaml
  register: k3s_workloads_legacy_proxy

- name: Stop the old Traefik Compose project
  ansible.builtin.command:
    argv: [docker, compose, --project-name, oilscope-proxy, --file, /opt/oilscope/proxy/compose.yaml, down]
  register: k3s_workloads_legacy_proxy_down
  changed_when: >-
    'Stopped' in k3s_workloads_legacy_proxy_down.stderr or
    'Removed' in k3s_workloads_legacy_proxy_down.stderr or
    'Stopped' in k3s_workloads_legacy_proxy_down.stdout or
    'Removed' in k3s_workloads_legacy_proxy_down.stdout
  when: k3s_workloads_legacy_proxy.stat.exists
