---
- name: Ensure the shared edge network exists
  community.docker.docker_network:
    name: "{{ edge_proxy_network_name }}"
    state: present

- name: Create the dynamic configuration directory
  ansible.builtin.file:
    path: "{{ edge_proxy_dir }}/dynamic"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Traefik dynamic routing configuration
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ edge_proxy_dir }}/dynamic/dynamic.yml"
    owner: root
    group: root
    mode: "0644"

- name: Check whether acme.json already exists
  ansible.builtin.stat:
    path: "{{ edge_proxy_dir }}/acme.json"
  register: edge_proxy_acme_stat

- name: Create acme.json only if it does not already exist
  ansible.builtin.file:
    path: "{{ edge_proxy_dir }}/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: not edge_proxy_acme_stat.stat.exists


- name: Pull the Traefik image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ edge_proxy_dir }}"
    files: ["{{ edge_proxy_compose_file | basename }}"]
    project_name: "{{ edge_proxy_compose_project_name }}"
    services: [traefik]
    policy: always


- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ edge_proxy_dir }}"
    files: ["{{ edge_proxy_compose_file | basename }}"]
    project_name: "{{ edge_proxy_compose_project_name }}"
    services: [traefik]
    pull: never
    state: present
    wait: true
    wait_timeout: 60
