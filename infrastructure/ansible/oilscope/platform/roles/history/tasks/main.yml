---
- name: Bring up History
  community.docker.docker_compose_v2:
    project_src: "{{ history_compose_project_dir }}"
    files:
      - compose.yaml
    services:
      - history
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
  environment: "{{ history_runtime_environment }}"
  no_log: true

- name: Wait for History to become healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:8001/health
    status_code: 200
    return_content: true
    use_proxy: false
  register: history_health
  retries: "{{ history_health_retries }}"
  delay: "{{ history_health_delay }}"
  until:
    - (history_health.json | default({})).get('status', '') == 'ok'
    - >-
      (history_health.json | default({})).get('database', '') == 'connected'
    - >-
      (history_health.json | default({})).get('consumer', '') == 'ready'
