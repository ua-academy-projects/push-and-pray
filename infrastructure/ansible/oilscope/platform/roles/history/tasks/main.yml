---
- name: Deploy only History
  environment:
    DOCKER_CONFIG: "{{ history_docker_config_dir }}"
    POSTGRES_PASSWORD: "{{ history_postgres_password }}"
    POSTGRES_USER: "{{ database_connection.username }}"
    POSTGRES_DB: "{{ database_connection.database_name }}"
    DATABASE_HOST: "{{ database_connection.host }}"
    DATABASE_PORT: "{{ database_connection.port | string }}"
    DATABASE_SSLMODE: "{{ database_connection.sslmode }}"
    MESSAGING_PROVIDER: "{{ messaging_connection.provider }}"
    RABBITMQ_URL: >-
      {{
        'amqp://' ~ messaging_connection.username ~ ':' ~ history_rabbitmq_password
        ~ '@' ~ messaging_connection.host ~ ':' ~ (messaging_connection.port | string)
        ~ '/' ~ messaging_connection.vhost
        if messaging_connection.provider == 'rabbitmq' else ''
      }}
    RABBITMQ_EXCHANGE: "{{ messaging_connection.exchange | default('', true) }}"
    RABBITMQ_QUEUE: "{{ messaging_connection.queue }}"
    RABBITMQ_ROUTING_KEY: >-
      {{ messaging_connection.routing_key | default('', true) }}
    RABBITMQ_MAX_ATTEMPTS: "{{ messaging_connection.max_attempts | string }}"
    PGMQ_QUEUE: "{{ messaging_connection.queue }}"
  no_log: true
  block:
    - name: Pull the History image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ history_compose_project_dir }}"
        files: ["{{ history_compose_file | basename }}"]
        project_name: "{{ history_compose_project_name }}"
        services: [history]
        policy: always

    - name: Start only History
      community.docker.docker_compose_v2:
        project_src: "{{ history_compose_project_dir }}"
        files: ["{{ history_compose_file | basename }}"]
        project_name: "{{ history_compose_project_name }}"
        services: [history]
        dependencies: false
        pull: never
        state: present

- name: Wait for History to become healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:8001/health
    status_code: 200
    return_content: true
    use_proxy: false
  register: history_health
  retries: "{{ history_health_retries }}"
  delay: "{{ history_health_delay }}"
  until:
    - (history_health.json | default({})).get('status', '') == 'ok'
    - >-
      (history_health.json | default({})).get('database', '') == 'connected'
    - >-
      (history_health.json | default({})).get(
        'messaging_provider', ''
      ) == messaging_connection.provider
    - >-
      (history_health.json | default({})).get(
        'messaging_consumer', ''
      ) == 'ready'
