---
- name: Validate the registry_auth role
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Include the role without credentials
      ansible.builtin.include_role:
        name: registry_auth
      register: registry_auth_missing_credentials
      ignore_errors: true

    - name: Verify missing credentials are rejected
      ansible.builtin.fail:
        msg: The registry_auth role accepted missing credentials.
      when: registry_auth_missing_credentials is not failed
