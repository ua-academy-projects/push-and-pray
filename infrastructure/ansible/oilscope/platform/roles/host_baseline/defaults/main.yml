---
# defaults file for host_baseline
host_baseline_deploy_user: deploy
host_baseline_deploy_group: deploy

host_baseline_packages:
  - ca-certificates
  - curl
  - jq

# Packages only one provider's hosts need, keyed by cloud so adding a provider
# adds an entry and not a conditional. AWS signs every Secrets Manager request,
# so its hosts need a client able to do that with the instance role; GCP accepts
# a bearer token from the metadata server and needs nothing extra.
host_baseline_packages_by_cloud:
  gcp: []
  aws:
    - awscli

host_baseline_cloud: "{{ oilscope_cloud | default('') }}"

host_baseline_directories:
  - path: /opt/oilscope
    owner: root
    group: root
    mode: "0755"

  - path: /opt/oilscope/app
    owner: "{{ host_baseline_deploy_user }}"
    group: "{{ host_baseline_deploy_group }}"
    mode: "0750"

  - path: /opt/oilscope/deploy
    owner: "{{ host_baseline_deploy_user }}"
    group: "{{ host_baseline_deploy_group }}"
    mode: "0750"

  - path: /var/lib/oilscope
    owner: "{{ host_baseline_deploy_user }}"
    group: "{{ host_baseline_deploy_group }}"
    mode: "0750"

# Journal settings. Every container logs through docker.service, so the
# per-unit rate limit that suits an ordinary daemon would silently drop a
# chatty container's lines; the size cap keeps the journal off a small boot
# disk's last gigabytes.
host_baseline_journald_config_path: /etc/systemd/journald.conf.d/oilscope.conf
host_baseline_journald_config:
  Storage: persistent
  SystemMaxUse: 500M
  RateLimitIntervalSec: 30s
  RateLimitBurst: 50000
