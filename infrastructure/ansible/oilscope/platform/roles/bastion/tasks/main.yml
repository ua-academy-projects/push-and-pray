---
- name: Require the project configuration path
  ansible.builtin.assert:
    that:
      - bastion_project_config_path | length > 0
    fail_msg: >-
      bastion_project_config_path must point to the project configuration JSON.

- name: Read the project configuration
  ansible.builtin.set_fact:
    bastion_project_config: >-
      {{ lookup('ansible.builtin.file', bastion_project_config_path) | from_json }}

- name: Require a bastion VM configuration
  ansible.builtin.assert:
    that:
      - bastion_project_config.vms is defined
      - bastion_project_config.vms.bastion is defined
    fail_msg: vms.bastion is required in the project configuration.

- name: Validate the bastion VM configuration
  ansible.builtin.assert:
    that:
      - bastion_project_config.vms.bastion.role | default('') == 'bastion'
      - bastion_project_config.vms.bastion.ssh_port is defined
      - >-
        bastion_project_config.vms.bastion.ssh_port | type_debug == 'int'
      - bastion_project_config.vms.bastion.ssh_port | int >= 1
      - bastion_project_config.vms.bastion.ssh_port | int <= 65535
    fail_msg: >-
      vms.bastion must declare role bastion and an integer ssh_port from 1 to
      65535.

- name: Record the configured bastion SSH port
  ansible.builtin.set_fact:
    bastion_ssh_port: "{{ bastion_project_config.vms.bastion.ssh_port | int }}"

- name: Check whether the SSH socket is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - ssh.socket
  register: bastion_ssh_socket
  changed_when: false
  failed_when: false

- name: Create the SSH daemon drop-in directory
  become: true
  ansible.builtin.file:
    path: "{{ bastion_sshd_drop_in_dir }}"
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Install the bastion SSH configuration
  become: true
  ansible.builtin.template:
    src: 00-oilscope-bastion.conf.j2
    dest: "{{ bastion_sshd_drop_in_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart bastion SSH

- name: Validate the complete SSH daemon configuration
  become: true
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false

- name: Read the effective SSH daemon configuration
  become: true
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
  register: bastion_sshd_effective_config
  changed_when: false

- name: Verify the effective bastion SSH policy
  ansible.builtin.assert:
    that:
      - >-
        bastion_sshd_effective_config.stdout_lines
        | select('match', '^port ')
        | list
        == ['port ' ~ (bastion_ssh_port | string)]
      - "'pubkeyauthentication yes' in bastion_sshd_effective_config.stdout_lines"
      - "'passwordauthentication no' in bastion_sshd_effective_config.stdout_lines"
      - "'kbdinteractiveauthentication no' in bastion_sshd_effective_config.stdout_lines"
      - "'permitemptypasswords no' in bastion_sshd_effective_config.stdout_lines"
      - "'permitrootlogin no' in bastion_sshd_effective_config.stdout_lines"
      - "'allowtcpforwarding yes' in bastion_sshd_effective_config.stdout_lines"
      - "'allowagentforwarding no' in bastion_sshd_effective_config.stdout_lines"
      - "'gatewayports no' in bastion_sshd_effective_config.stdout_lines"
      - "'x11forwarding no' in bastion_sshd_effective_config.stdout_lines"
      - "'permittunnel no' in bastion_sshd_effective_config.stdout_lines"
    fail_msg: The effective SSH daemon policy does not match the bastion role.

- name: Apply pending SSH handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for SSH on the configured bastion port
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ bastion_ssh_port }}"
    connect_timeout: "{{ bastion_ssh_connect_timeout }}"
    delay: "{{ bastion_ssh_connect_delay }}"
    timeout: >-
      {{ bastion_ssh_connect_retries * bastion_ssh_connect_delay }}
    state: started
  delegate_to: localhost
  become: false
  changed_when: false
