---
aws_cloudwatch_agent_architectures:
  aarch64: arm64
  x86_64: amd64

aws_cloudwatch_agent_architecture: >-
  {{ aws_cloudwatch_agent_architectures.get(ansible_facts['architecture'], '') }}
aws_cloudwatch_agent_package_url: >-
  https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/{{ aws_cloudwatch_agent_architecture }}/latest/amazon-cloudwatch-agent.deb
aws_cloudwatch_agent_package_path: /var/tmp/amazon-cloudwatch-agent.deb
aws_cloudwatch_agent_config_path: >-
  /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
aws_cloudwatch_agent_service: amazon-cloudwatch-agent
aws_cloudwatch_agent_collection_interval: 60
