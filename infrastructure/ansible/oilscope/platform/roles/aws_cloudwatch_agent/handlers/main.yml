---
- name: Apply the Amazon CloudWatch Agent configuration
  become: true
  ansible.builtin.command:
    argv:
      - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
      - -a
      - fetch-config
      - -m
      - ec2
      - -s
      - -c
      - "file:{{ aws_cloudwatch_agent_config_path }}"
  changed_when: true
