---
- name: Require one cloud for the application SSH and private service paths
  ansible.builtin.assert:
    that:
      - >-
        (groups['all'] | map('extract', hostvars, 'oilscope_cloud')
         | unique | list | length) == 1
    fail_msg: >-
      Deploy one application in one cloud. Mixed-cloud Terraform provisioning
      and discovery are supported, but cross-cloud private connectivity is not.
    quiet: true

- name: Gather facts after topology validation
  ansible.builtin.setup:
