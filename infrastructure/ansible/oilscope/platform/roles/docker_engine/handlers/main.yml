---
- name: Refresh the apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Restart Docker
  become: true
  ansible.builtin.systemd_service:
    name: "{{ docker_engine_service }}"
    state: restarted

- name: Restart the container exit recorder
  become: true
  ansible.builtin.systemd_service:
    name: "{{ docker_engine_events_service }}"
    state: restarted
    daemon_reload: true
