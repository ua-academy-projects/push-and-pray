---
- name: Render the K3s agent configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_agent_config_path }}"
    owner: root
    group: root
    mode: "0600"
  register: k3s_agent_config
  no_log: true

- name: Check the installed K3s agent version
  ansible.builtin.command:
    argv:
      - k3s
      - --version
  register: k3s_agent_installed_version
  changed_when: false
  failed_when: false

- name: Install the pinned K3s agent release
  ansible.builtin.command:
    argv:
      - "{{ k3s_agent_installer_path }}"
  environment:
    INSTALL_K3S_EXEC: agent
    INSTALL_K3S_SKIP_START: "true"
    INSTALL_K3S_VERSION: "{{ k3s_agent_version }}"
  when: >-
    k3s_agent_installed_version.rc != 0
    or k3s_agent_version not in k3s_agent_installed_version.stdout
  changed_when: true

- name: Enable and start the K3s agent
  ansible.builtin.systemd_service:
    name: "{{ k3s_agent_service }}"
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if k3s_agent_config.changed else 'started' }}"

- name: Wait for the K3s agent service to become active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ k3s_agent_service }}"
  register: k3s_agent_service_status
  retries: 30
  delay: 10
  until: k3s_agent_service_status.stdout | trim == 'active'
  changed_when: false
