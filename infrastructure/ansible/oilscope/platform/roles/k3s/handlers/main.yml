---
- name: Restart K3s when configuration changes
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if k3s_mode == 'server' else 'k3s-agent' }}"
    daemon_reload: true
    state: restarted
  when:
    - k3s_service_file.stat.exists
    - not k3s_needs_install or k3s_legacy_ingress_override is changed
