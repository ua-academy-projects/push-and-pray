---
- name: Bring up the Fetcher service
  community.docker.docker_compose_v2:
    project_src: "{{ fetcher_compose_project_dir }}"
    files:
      - compose.yaml
    services:
      - "{{ fetcher_service }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
  environment: "{{ fetcher_runtime_environment }}"
  no_log: true
