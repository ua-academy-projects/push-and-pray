---
fetcher_runtime_environment: >-
  {{
    fetcher_compose_environment
    | combine({
      'DOCKER_CONFIG': fetcher_docker_config_dir,
      'POSTGRES_PASSWORD': fetcher_postgres_password,
      'POSTGRES_USER': fetcher_postgres_user,
      'POSTGRES_DB': fetcher_postgres_name,
      'DATABASE_HOST': fetcher_database_host,
      'DATABASE_PORT': fetcher_database_port | string,
      'DATABASE_URL': (
        'postgres://' ~ fetcher_postgres_user ~ ':' ~ fetcher_postgres_password
        ~ '@' ~ fetcher_database_host ~ ':' ~ (fetcher_database_port | string)
        ~ '/' ~ fetcher_postgres_name ~ '?sslmode=disable'
        if messaging_connection.provider == 'pgmq' else ''
      ),
      'MESSAGING_PROVIDER': messaging_connection.provider,
      'RABBITMQ_URL': (
        'amqp://' ~ messaging_connection.username ~ ':' ~ fetcher_rabbitmq_password
        ~ '@' ~ messaging_connection.host ~ ':' ~ (messaging_connection.port | string)
        ~ '/' ~ messaging_connection.vhost
        if messaging_connection.provider == 'rabbitmq' else ''
      ),
      'RABBITMQ_EXCHANGE': messaging_connection.exchange | default('', true),
      'RABBITMQ_QUEUE': messaging_connection.queue,
      'RABBITMQ_ROUTING_KEY': messaging_connection.routing_key | default('', true),
      'PGMQ_QUEUE': messaging_connection.queue,
      'OILPRICEAPI_KEY': fetcher_oilpriceapi_key,
      'FETCHER_BIND_ADDRESS': fetcher_bind_address | string,
      'FETCHER_HOST_PORT': fetcher_host_port | string
    })
  }}
