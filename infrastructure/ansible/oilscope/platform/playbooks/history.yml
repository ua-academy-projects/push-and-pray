---
- name: Deploy History
  hosts: history
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.host_baseline

    - role: oilscope.platform.docker_engine

    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"

    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.database_connection
      vars:
        database_connection_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.registry_auth
      vars:
        registry_auth_registry: >-
          {{ compose_project_config.registry.repository
             | regex_replace('/.*$', '') }}
        registry_auth_username: >-
          {{ compose_project_config.registry.username | default('') }}
        registry_auth_token: >-
          {{ resolve_secrets_result.GHCR_TOKEN | default('') }}

    - role: oilscope.platform.cloud_registry_auth
      when: compose_project_config.manage_db | bool
      vars:
        cloud_registry_auth_registry: >-
          {{ managed_service_images[oilscope_cloud].registry }}

    - role: oilscope.platform.database_migrations
      when: oilscope_database_connection.managed | bool
      vars:
        database_migrations_image: >-
          {{
            compose_project_config.registry.repository
            ~ '/database:'
            ~ compose_project_config.registry.image_sha
          }}
        database_migrations_host: "{{ oilscope_database_connection.host }}"
        database_migrations_port: "{{ oilscope_database_connection.port }}"
        database_migrations_name: "{{ oilscope_database_connection.name }}"
        database_migrations_user: "{{ oilscope_database_connection.user }}"
        database_migrations_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        database_migrations_sslmode: "{{ oilscope_database_connection.sslmode }}"

    - role: oilscope.platform.history
      vars:
        history_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        history_database_host: "{{ oilscope_database_connection.host }}"
        history_database_port: "{{ oilscope_database_connection.port }}"
        history_postgres_user: "{{ oilscope_database_connection.user }}"
        history_postgres_name: "{{ oilscope_database_connection.name }}"
        history_database_sslmode: "{{ oilscope_database_connection.sslmode }}"
        history_queue_backend: >-
          {{ 'rabbitmq' if compose_project_config.manage_db | bool else 'postgres' }}
        history_rabbitmq_password: >-
          {{ resolve_secrets_result.RABBITMQ_PASSWORD | default('') }}
        history_rabbitmq_host: "{{ internal_ip }}"
        history_rabbitmq_port: >-
          {{ compose_project_config.service_ports.rabbitmq | default(5672) }}
        history_rabbitmq_username: >-
          {{ compose_project_config.get('managed_services', {}).get('rabbitmq_username', 'oil_tracker') }}
        history_rabbitmq_vhost: >-
          {{ compose_project_config.get('managed_services', {}).get('rabbitmq_vhost', 'oil_tracker') }}
        history_rabbitmq_queue: >-
          {{ compose_project_config.get('managed_services', {}).get('rabbitmq_queue', 'history.price-observations') }}
        history_redis_password: >-
          {{ resolve_secrets_result.REDIS_PASSWORD | default('') }}
