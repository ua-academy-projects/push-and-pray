---
- name: Deploy History
  hosts: history
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: history

    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.registry_auth
      vars:
        registry_auth_registry: >-
          {{ compose_project_config.registry.repository
             | regex_replace('/.*$', '') }}
        registry_auth_username: >-
          {{ compose_project_config.registry.username | default('') }}
        registry_auth_token: >-
          {{ resolve_secrets_result.GHCR_TOKEN | default('') }}

    - role: oilscope.platform.history
      vars:
        history_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        history_messaging_backend: >-
          {{ 'rabbitmq' if compose_project_config.database.mode == 'managed' else 'pgmq' }}
        history_database_host: >-
          {{
            'cloud-sql-proxy'
            if compose_project_config.database.mode == 'managed'
               and compose_project_config.default_cloud == 'gcp'
            else ('postgres.' ~ compose_project_config.name_prefix ~ '-'
                  ~ compose_project_config.environment ~ '.internal')
            if compose_project_config.database.mode == 'managed'
            else hostvars[groups['infrastructure'][0]].internal_ip
          }}
        history_rabbitmq_url: >-
          {{
            'amqp://oil_tracker:'
            ~ (resolve_secrets_result.RABBITMQ_PASSWORD | urlencode)
            ~ '@' ~ hostvars[groups['infrastructure'][0]].internal_ip
            ~ ':5672/oil_tracker'
            if compose_project_config.database.mode == 'managed'
            else ''
          }}
        history_cloud_sql_connection_name: >-
          {{
            compose_project_config.cloud_settings.gcp.project_id ~ ':'
            ~ compose_project_config.locations[compose_project_config.default_location].gcp.region ~ ':'
            ~ compose_project_config.name_prefix ~ '-'
            ~ compose_project_config.environment ~ '-postgres'
          }}
        history_database_sslmode: >-
          {{
            'require'
            if compose_project_config.database.mode == 'managed'
               and compose_project_config.default_cloud == 'aws'
            else 'disable'
          }}
