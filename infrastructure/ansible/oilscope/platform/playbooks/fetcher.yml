---
- name: Deploy Fetcher
  hosts: fetcher
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.host_baseline

    - role: oilscope.platform.docker_engine

    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"

    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.database_connection
      vars:
        database_connection_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.cloud_registry_auth
      vars:
        cloud_registry_auth_registry: "{{ deployment_contract.registry.host }}"

    - role: oilscope.platform.fetcher
      vars:
        fetcher_database_host: >-
          {{ oilscope_database_connection.host }}
        fetcher_database_port: "{{ oilscope_database_connection.port }}"
        fetcher_postgres_user: "{{ oilscope_database_connection.user }}"
        fetcher_postgres_name: "{{ oilscope_database_connection.name }}"
        fetcher_database_sslmode: "{{ oilscope_database_connection.sslmode }}"
        fetcher_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        fetcher_oilpriceapi_key: "{{ resolve_secrets_result.OILPRICEAPI_KEY }}"
        fetcher_queue_backend: >-
          {{ 'rabbitmq' if compose_project_config.manage_db | bool else 'postgres' }}
        fetcher_queue_name: >-
          {{ compose_project_config.get('managed_services', {}).get('rabbitmq_queue', 'price_observations') }}
        fetcher_rabbitmq_password: >-
          {{ resolve_secrets_result.RABBITMQ_PASSWORD | default('') }}
        fetcher_rabbitmq_host: "{{ hostvars[groups['history'][0]].internal_ip }}"
        fetcher_rabbitmq_port: >-
          {{ compose_project_config.service_ports.rabbitmq | default(5672) }}
        fetcher_rabbitmq_username: >-
          {{ compose_project_config.get('managed_services', {}).get('rabbitmq_username', 'oil_tracker') }}
        fetcher_rabbitmq_vhost: >-
          {{ compose_project_config.get('managed_services', {}).get('rabbitmq_vhost', 'oil_tracker') }}
