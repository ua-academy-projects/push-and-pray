---
- name: Release public web ports used by older Compose deployments
  hosts: k3s_server:k3s_agent
  become: true
  gather_facts: false
  tasks:
    - name: Stop older web services on the public node
      ansible.builtin.import_role:
        name: k3s_workloads
        tasks_from: ui
      when: public_ip | default('') | length > 0

- name: Deploy OilScope from the Ansible control host
  hosts: k3s_primary
  become: true
  gather_facts: false
  tasks:
    - name: Install and configure workloads
      block:
        - name: Prepare controller access to the K3s API
          ansible.builtin.import_role:
            name: k3s_workloads
            tasks_from: control

        - name: Prepare Kubernetes resources and Helm releases
          ansible.builtin.import_role:
            name: k3s_workloads
            tasks_from: prepare
          delegate_to: localhost
          become: false
          environment:
            KUBECONFIG: "{{ k3s_workloads_control_dir.path }}/kubeconfig"

        - name: Deploy application resources
          ansible.builtin.import_role:
            name: k3s_workloads
            tasks_from: deploy
          delegate_to: localhost
          become: false
          environment:
            KUBECONFIG: "{{ k3s_workloads_control_dir.path }}/kubeconfig"
      always:
        - name: Close the control-host API tunnel
          ansible.builtin.command:
            argv: [ssh, -S, "{{ k3s_workloads_control_dir.path }}/ssh.sock", -O, exit, "{{ ansible_user }}@{{ ansible_host }}"]
          delegate_to: localhost
          become: false
          changed_when: false
          failed_when: false
          when: k3s_workloads_control_dir is defined and k3s_workloads_control_dir.path is defined

        - name: Remove the temporary kubeconfig
          ansible.builtin.file:
            path: "{{ k3s_workloads_control_dir.path }}"
            state: absent
          delegate_to: localhost
          become: false
          changed_when: false
          when: k3s_workloads_control_dir is defined and k3s_workloads_control_dir.path is defined
