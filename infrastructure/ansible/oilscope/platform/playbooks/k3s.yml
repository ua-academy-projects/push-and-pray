---
- name: Initialize the k3s control plane
  hosts: k3s_server[0]
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.host_baseline
    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"
    - role: oilscope.platform.k3s
      vars:
        k3s_node_role: server

- name: Join the remaining k3s servers
  hosts: k3s_server[1:]
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  roles:
    - role: oilscope.platform.host_baseline
    - role: oilscope.platform.k3s
      vars:
        k3s_node_role: server

- name: Join the k3s agents to the cluster
  hosts: k3s_agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.host_baseline
    - role: oilscope.platform.k3s
      vars:
        k3s_node_role: agent

- name: Resolve secrets on the bastion for a managed cluster
  hosts: bastion
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Resolve the application secrets
      ansible.builtin.include_role:
        name: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"
      when: groups.get('k3s_server', []) | length == 0

- name: Deploy the application
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  environment:
    KUBECONFIG: "{{ k8s_local_kubeconfig }}"
  vars:
    k8s_bastion: "{{ hostvars[groups['bastion'][0]] }}"
    k8s_local_kubeconfig: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/oilscope-k3s.yaml"
    k8s_api_local_port: 6444
    k8s_secrets_host: "{{ groups['k3s_server'][0] if groups.get('k3s_server', []) | length > 0 else groups['bastion'][0] }}"
    resolve_secrets_result: "{{ hostvars[k8s_secrets_host].resolve_secrets_result }}"
    k8s_ssh_key: "{{ k8s_bastion.ansible_ssh_private_key_file }}"
    k8s_ssh_user: "{{ k8s_bastion.ansible_user }}"
    k8s_bastion_host: "{{ k8s_bastion.ansible_host }}"
    k8s_bastion_port: "{{ k8s_bastion.bastion_ssh_port }}"
    k8s_server_ip: "{{ hostvars[groups['k3s_server'][0]].internal_ip if groups.get('k3s_server', []) | length > 0 else '' }}"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: oilscope.platform.k8s_app

- name: Point the internal DNS zone at the managed cluster nodes
  hosts: bastion
  become: true
  gather_facts: false
  vars:
    bastion_project_config: "{{ lookup('ansible.builtin.file', project_config_path) | from_json }}"
    bastion_internal_dns: "{{ bastion_project_config.internal_dns | default({'enabled': false}) }}"
  tasks:
    - name: Configure CoreDNS
      ansible.builtin.include_role:
        name: oilscope.platform.internal_dns
      vars:
        internal_dns_domain: "{{ bastion_internal_dns.domain }}"
        internal_dns_targets: "{{ hostvars['localhost'].k8s_app_node_ips }}"
      when: bastion_internal_dns.enabled | bool and hostvars['localhost'].k8s_app_node_ips is defined
