---
- name: Require the K3s inventory before deployment
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require one primary and a valid server quorum
      ansible.builtin.assert:
        that:
          - groups.get('k3s_primary', []) | length == 1
          - groups.get('k3s_server', []) | length >= 3
          - groups.get('k3s_server', []) | length % 2 == 1
        fail_msg: Discover one K3s primary and at least three odd-numbered K3s servers before deployment.

- name: Prepare the managed cloud database
  ansible.builtin.import_playbook: database.yml
  when: database_mode == 'managed'

- name: Install K3s cluster
  ansible.builtin.import_playbook: deploy_k3s.yml

- name: Deploy K3s workloads
  ansible.builtin.import_playbook: deploy_k3s_workloads.yml
