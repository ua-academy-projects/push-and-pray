---
- name: Connect K3s nodes to the private tailnet
  hosts: k3s_server:k3s_agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - oilscope.platform.tailscale

- name: Preserve transport addresses of an existing K3s cluster
  hosts: k3s_server:k3s_agent
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check whether this node already has K3s installed
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ 'k3s' if inventory_hostname in groups['k3s_server'] else 'k3s-agent' }}.service"
      register: k3s_existing_service

    - name: Check whether this node was initialized for Tailnet transport
      ansible.builtin.stat:
        path: /etc/rancher/k3s/.oilscope-tailnet-transport
      register: k3s_tailnet_marker

    - name: Identify existing servers that still use private transport
      ansible.builtin.set_fact:
        k3s_existing_private_server: >-
          {{ inventory_hostname in groups['k3s_server'] and
             k3s_existing_service.stat.exists and
             not k3s_tailnet_marker.stat.exists }}

    - name: Select one transport for the whole cluster
      vars:
        k3s_private_servers: >-
          {{ groups['k3s_server'] | map('extract', hostvars, 'k3s_existing_private_server')
             | select('equalto', true) | list }}
      ansible.builtin.set_fact:
        k3s_cluster_uses_tailscale: "{{ k3s_private_servers | length == 0 }}"
        k3s_transport_ip: "{{ tailscale_ip if k3s_private_servers | length == 0 else internal_ip }}"

- name: Stop older K3s agents on nodes becoming servers
  hosts: k3s_server
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Prepare servers before bootstrapping the quorum
      ansible.builtin.import_role:
        name: oilscope.platform.k3s
        tasks_from: promote_server

- name: Bootstrap the first K3s server
  hosts: k3s_primary
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    k3s_primary_server: "{{ groups['k3s_primary'][0] }}"
    k3s_first_server: true
    k3s_mode: server
    k3s_api_sans: "{{ (lookup('ansible.builtin.file', project_config_path) | from_json).get('k3s', {}).get('api_sans', []) }}"
  pre_tasks:
    - name: Require a valid embedded etcd quorum
      ansible.builtin.assert:
        that:
          - groups['k3s_server'] | length >= 3
          - groups['k3s_server'] | length % 2 == 1
        fail_msg: K3s embedded etcd requires at least three, and an odd number of, server nodes.
  roles:
    - oilscope.platform.k3s

- name: Join the other K3s servers
  hosts: "k3s_server:!k3s_primary"
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_primary_server: "{{ groups['k3s_primary'][0] }}"
    k3s_first_server: false
    k3s_mode: server
    k3s_api_sans: "{{ (lookup('ansible.builtin.file', project_config_path) | from_json).get('k3s', {}).get('api_sans', []) }}"
  tasks:
    - name: Join a server
      ansible.builtin.import_role:
        name: oilscope.platform.k3s

- name: Join K3s agents
  hosts: k3s_agent
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    k3s_primary_server: "{{ groups['k3s_primary'][0] }}"
    k3s_first_server: false
    k3s_mode: agent
    k3s_api_sans: "{{ (lookup('ansible.builtin.file', project_config_path) | from_json).get('k3s', {}).get('api_sans', []) }}"
  roles:
    - oilscope.platform.k3s
