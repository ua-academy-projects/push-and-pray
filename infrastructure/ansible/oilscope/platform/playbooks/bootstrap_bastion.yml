---
# Terraform boots the bastion listening on the final port already, so this
# connects and applies the role's sshd policy in one pass. Safe to re-run at
# any time to re-assert the policy on an already-configured bastion.
- name: Configure the bastion
  hosts: bastion
  become: true
  gather_facts: false
  roles:
    - role: oilscope.platform.bastion
