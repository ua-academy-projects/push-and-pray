---
- name: Configure the bastion
  hosts: bastion
  become: true
  gather_facts: false
  pre_tasks:
    - name: Use the discovered bootstrap SSH port
      ansible.builtin.set_fact:
        ansible_port: >-
          {{ lookup('ansible.builtin.env', 'OILSCOPE_BASTION_CONNECT_PORT')
             | default(ansible_port, true) | int }}

    - name: Gather facts through the bootstrap SSH port
      ansible.builtin.setup:

    - name: Load the project configuration
      ansible.builtin.include_vars:
        file: >-
          {{ project_config_path
             | default(lookup('ansible.builtin.env', 'OILSCOPE_PROJECT_CONFIG'), true) }}
        name: bootstrap_project_config
  roles:
    - role: oilscope.platform.bastion_nat
      when: oilscope_cloud == 'aws'
      vars:
        bastion_nat_enabled: >-
          {{ bootstrap_project_config.clouds.aws.bastion_nat | default(true) }}
        bastion_nat_workload_cidr: >-
          {{ bootstrap_project_config.clouds.aws.network.workload_subnet_cidr
             | default(bootstrap_project_config.network.workload_subnet_cidr, true) }}

    - role: oilscope.platform.bastion
  post_tasks:
    - name: Wait for the final bastion SSH port from the controller
      become: false
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: "{{ bastion_ssh_port }}"
        state: started
        connect_timeout: 5
        timeout: 60
      delegate_to: localhost

    - name: Use the final bastion SSH port
      ansible.builtin.set_fact:
        ansible_port: "{{ bastion_ssh_port }}"

    - name: Reset the bootstrap SSH connection
      ansible.builtin.meta: reset_connection

    - name: Check the SSH connection on the final port
      ansible.builtin.ping:
      changed_when: false
