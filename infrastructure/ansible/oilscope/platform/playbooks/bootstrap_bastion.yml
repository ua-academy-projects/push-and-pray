---
- name: Detect the bastion's current SSH port
  hosts: bastion
  gather_facts: false
  connection: local
  tasks:
    - name: Check whether sshd already moved to the final port
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ bastion_ssh_port }}"
        timeout: 5
      register: bastion_final_port

      ignore_errors: true

    - name: Fall back to 22 on a bastion this role has not configured yet
      ansible.builtin.set_fact:
        ansible_port: 22
      when: bastion_final_port is failed

- name: Configure the bastion
  hosts: bastion
  become: true
  gather_facts: false
  roles:
    - role: oilscope.platform.bastion
  post_tasks:
    - name: Wait for the final bastion SSH port from the controller
      become: false
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: "{{ bastion_ssh_port }}"
        state: started
        connect_timeout: 5
        timeout: 60
      delegate_to: localhost

    - name: Use the final bastion SSH port
      ansible.builtin.set_fact:
        ansible_port: "{{ bastion_ssh_port }}"

    - name: Reset the connection opened on the previous port
      ansible.builtin.meta: reset_connection

    - name: Check the SSH connection on the final port
      ansible.builtin.ping:
      changed_when: false

- name: Join the bastion to the tailnet as a subnet router
  hosts: bastion
  become: true
  gather_facts: false
  vars:
    bastion_project_config: "{{ lookup('ansible.builtin.file', project_config_path) | from_json }}"
    bastion_tailscale: "{{ bastion_project_config.tailscale | default({'enabled': false}) }}"
  tasks:
    - name: Configure Tailscale
      ansible.builtin.include_role:
        name: oilscope.platform.tailscale
      vars:
        tailscale_hostname: "{{ bastion_tailscale.hostname | default(bastion_project_config.name_prefix ~ '-bastion') }}"
        tailscale_advertise_routes:
          - "{{ bastion_project_config.network.management_subnet_cidr }}"
          - "{{ bastion_project_config.network.workload_subnet_cidr }}"
      when: bastion_tailscale.enabled | bool
