---
- name: Configure the bastion
  hosts: bastion
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for the bastion SSH port from the controller
      become: false
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port }}"
        state: started
        connect_timeout: 5
        timeout: 300
      delegate_to: localhost

  roles:
    - role: oilscope.platform.bastion

  post_tasks:
    - name: Check the SSH connection on the final port
      ansible.builtin.ping:
      changed_when: false
