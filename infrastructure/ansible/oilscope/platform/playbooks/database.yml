---
- name: Deploy Database
  hosts: database
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true

  pre_tasks:
    - name: Load database deployment mode
      ansible.builtin.include_vars:
        file: "{{ project_config_path }}"
        name: database_project_config

  roles:
    - role: oilscope.platform.host_baseline
      when: not (database_project_config.manage_db | bool)

    - role: oilscope.platform.docker_engine
      when: not (database_project_config.manage_db | bool)

    - role: oilscope.platform.compose_project
      when: not (database_project_config.manage_db | bool)
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"

    - role: oilscope.platform.resolve_secrets
      when: not (database_project_config.manage_db | bool)
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.cloud_registry_auth
      when: not (database_project_config.manage_db | bool)
      vars:
        cloud_registry_auth_registry: "{{ deployment_contract.registry.host }}"

    - role: oilscope.platform.database
      when: not (database_project_config.manage_db | bool)
      vars:
        database_postgres_image: >-
          {{ deployment_contract.registry.images.database }}
        database_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
