---
- name: Deploy Database
  hosts: database
  become: true
  gather_facts: false
  force_handlers: true
  any_errors_fatal: true

  roles:
    - role: oilscope.platform.topology_guard

    - role: oilscope.platform.host_baseline

    - role: oilscope.platform.docker_engine

    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"

    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.registry_auth
      vars:
        registry_auth_registry: >-
          {{ compose_project_config.registry.repository
             | regex_replace('/.*$', '') }}
        registry_auth_username: >-
          {{ compose_project_config.registry.username | default('') }}
        registry_auth_token: >-
          {{ resolve_secrets_result.GHCR_TOKEN | default('') }}

    - role: oilscope.platform.database
      vars:
        database_postgres_image: >-
          {{
            compose_project_config.registry.repository
            ~ '/database:'
            ~ compose_project_config.registry.image_sha
          }}
        database_host_port: "{{ compose_project_config.service_ports.postgresql }}"
        database_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        database_mode: "{{ compose_project_config.database_mode | default('self_hosted') }}"
        database_host: >-
          {{ resolve_secrets_result.DATABASE_HOST | default('postgres') }}
        database_port: "{{ compose_project_config.service_ports.postgresql }}"
        database_sslmode: >-
          {{ 'require' if (compose_project_config.database_mode | default('self_hosted')) == 'managed' else 'disable' }}
        database_rabbitmq_password: >-
          {{ resolve_secrets_result.RABBITMQ_PASSWORD | default('') }}
        database_rabbitmq_port: >-
          {{ compose_project_config.service_ports.rabbitmq | default(5672) }}
        database_redis_password: "{{ resolve_secrets_result.REDIS_PASSWORD }}"
        database_redis_bind_address: "{{ internal_ip }}"
        database_redis_port: "{{ compose_project_config.service_ports.redis }}"
