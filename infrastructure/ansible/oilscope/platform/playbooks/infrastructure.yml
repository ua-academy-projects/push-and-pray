---
- name: Deploy Infrastructure
  hosts: infrastructure
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true

  roles:
    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: infrastructure

    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.registry_auth
      vars:
        registry_auth_registry: >-
          {{ compose_project_config.registry.repository | regex_replace('/.*$', '') }}
        registry_auth_username: "{{ compose_project_config.registry.username | default('') }}"
        registry_auth_token: "{{ resolve_secrets_result.GHCR_TOKEN | default('') }}"

    - role: oilscope.platform.infrastructure
      vars:
        infrastructure_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        infrastructure_rabbitmq_password: >-
          {{ resolve_secrets_result.RABBITMQ_PASSWORD | default('') }}
        infrastructure_redis_password: >-
          {{ resolve_secrets_result.REDIS_PASSWORD | default('') }}
        infrastructure_internal_ip: "{{ internal_ip }}"
        infrastructure_database_host: >-
          {{
            'cloud-sql-proxy'
            if compose_project_config.database.mode == 'managed'
               and compose_project_config.default_cloud == 'gcp'
            else ('postgres.' ~ compose_project_config.name_prefix ~ '-'
                  ~ compose_project_config.environment ~ '.internal')
            if compose_project_config.database.mode == 'managed'
            else 'postgres'
          }}
        infrastructure_cloud_sql_connection_name: >-
          {{
            compose_project_config.cloud_settings.gcp.project_id ~ ':'
            ~ compose_project_config.locations[compose_project_config.default_location].gcp.region ~ ':'
            ~ compose_project_config.name_prefix ~ '-'
            ~ compose_project_config.environment ~ '-postgres'
          }}
        infrastructure_database_sslmode: >-
          {{
            'require'
            if compose_project_config.database.mode == 'managed'
               and compose_project_config.default_cloud == 'aws'
            else 'disable'
          }}
