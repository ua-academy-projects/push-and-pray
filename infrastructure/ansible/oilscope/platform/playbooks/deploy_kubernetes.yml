---
- name: Configure Tailscale subnet routers
  hosts: bastion
  become: true
  roles:
    - role: oilscope.platform.host_baseline
    - role: oilscope.platform.tailscale_subnet_router
      tailscale_advertise_route: "{{ hostvars[inventory_hostname].oilscope_vpc_cidr }}"

- name: Provision the K3s control plane
  hosts: k3s_server
  serial: 1
  become: true
  roles:
    - role: oilscope.platform.host_baseline
    - role: oilscope.platform.k3s_registry_auth
    - role: oilscope.platform.k3s_server

- name: Join K3s agents
  hosts: k3s_agent
  become: true
  roles:
    - role: oilscope.platform.host_baseline
    - role: oilscope.platform.k3s_registry_auth
    - role: oilscope.platform.k3s_agent

- name: Install platform services from the controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: oilscope.platform.kubernetes_platform
