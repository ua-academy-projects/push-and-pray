---
- name: Deploy UI
  hosts: ui
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.host_baseline

    - role: oilscope.platform.docker_engine

    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"

    - role: oilscope.platform.resolve_secrets
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.database_connection
      vars:
        database_connection_config_path: "{{ project_config_path }}"

    - role: oilscope.platform.registry_auth
      vars:
        registry_auth_registry: >-
          {{ compose_project_config.registry.repository
             | regex_replace('/.*$', '') }}
        registry_auth_username: >-
          {{ compose_project_config.registry.username | default('') }}
        registry_auth_token: >-
          {{ resolve_secrets_result.GHCR_TOKEN | default('') }}

    - role: oilscope.platform.compose_project
      when: compose_project_config.vms.ui.public_endpoint is defined
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_dir: /opt/oilscope/proxy
        compose_project_workload: proxy

    - role: oilscope.platform.edge_proxy
      when: compose_project_config.vms.ui.public_endpoint is defined

    - role: oilscope.platform.ui
      vars:
        ui_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        ui_database_host: "{{ oilscope_database_connection.host }}"
        ui_database_port: "{{ oilscope_database_connection.port }}"
        ui_postgres_user: "{{ oilscope_database_connection.user }}"
        ui_postgres_name: "{{ oilscope_database_connection.name }}"
        ui_database_sslmode: "{{ oilscope_database_connection.sslmode }}"
        ui_session_backend: >-
          {{ 'redis' if compose_project_config.manage_db | bool else 'postgres' }}
        ui_redis_password: >-
          {{ resolve_secrets_result.REDIS_PASSWORD | default('') }}
        ui_redis_host: "{{ hostvars[groups['history'][0]].internal_ip }}"
        ui_redis_port: >-
          {{ compose_project_config.service_ports.redis | default(6379) }}
