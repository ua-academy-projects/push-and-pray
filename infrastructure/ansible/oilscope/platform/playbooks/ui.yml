---
- name: Deploy UI
  hosts: ui
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.host_baseline

    - role: oilscope.platform.docker_engine

    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"

    - role: oilscope.platform.registry_auth

    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_dir: /opt/oilscope/proxy
        compose_project_workload: proxy

    - role: oilscope.platform.edge_proxy

    - role: oilscope.platform.ui
      vars:
        ui_database_mode: "{{ compose_project_config.database_mode }}"
        ui_database_host: >-
          {{ managed_database.host
             if compose_project_config.database_mode == 'managed'
             else hostvars[groups['database'][0]].internal_ip }}
        ui_database_port: >-
          {{ managed_database.port
             if compose_project_config.database_mode == 'managed' else 5432 }}
        ui_database_sslmode: >-
          {{ managed_database.sslmode
             if compose_project_config.database_mode == 'managed' else 'disable' }}
