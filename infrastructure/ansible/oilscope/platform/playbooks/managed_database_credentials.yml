---
# After terraform apply, before deploy_workloads: give the managed database
# and the workloads one password to agree on. Does nothing in self-hosted mode.
- name: Reconcile the managed database credentials
  hosts: localhost
  gather_facts: false
  roles:
    - role: oilscope.platform.managed_database_credentials
      vars:
        managed_database_credentials_config_path: "{{ project_config_path }}"
