---
- name: Apply the workload host baseline
  hosts: workloads
  gather_facts: true
  roles:
    - role: oilscope.platform.host_baseline
      tags:
        - baseline

- name: Install Docker on workload hosts
  hosts: workloads
  gather_facts: true
  roles:
    - role: oilscope.platform.docker_engine
      tags:
        - docker

- name: Install the non-secret Compose project
  hosts: workloads
  become: true
  gather_facts: false
  roles:
    - role: oilscope.platform.compose_project
      vars:
        compose_project_config_path: "{{ project_config_path }}"
        compose_project_workload: "{{ oilscope_role }}"
      tags:
        - compose

- name: Deploy and migrate the database
  hosts: database
  become: true
  gather_facts: false
  vars:
    deploy_project_config: >-
      {{ lookup('ansible.builtin.file', project_config_path) | from_json }}
    deploy_workload_config: >-
      {{
        deploy_project_config.vms
        | dict2items
        | selectattr('value.role', 'equalto', 'database')
        | map(attribute='value')
        | first
      }}
    deploy_database_image: >-
      {{ deploy_project_config.registry.repository }}/database:{{ deploy_project_config.registry.image_sha }}
  roles:
    - role: oilscope.platform.runtime_secrets
      vars:
        runtime_secrets_project_id: "{{ deploy_project_config.project_id }}"
        runtime_secrets_mappings: "{{ deploy_workload_config.secret_mappings }}"
      tags:
        - database

    - role: oilscope.platform.database
      vars:
        database_application_image_tag: >-
          {{ deploy_project_config.registry.image_sha }}
        database_host_port: >-
          {{ deploy_project_config.service_ports.postgresql }}
        database_postgres_image: "{{ deploy_database_image }}"
        database_postgres_password: >-
          {{
            runtime_secrets_access_results.results
            | selectattr('item.key', 'equalto', 'POSTGRES_PASSWORD')
            | map(attribute='json.payload.data')
            | first
            | b64decode
          }}
      no_log: true
      tags:
        - database

