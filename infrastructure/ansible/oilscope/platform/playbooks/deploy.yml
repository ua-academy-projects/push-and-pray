---
- name: Synchronize deployment secrets
  ansible.builtin.import_playbook: synchronize_secret_versions.yml

- name: Prepare workload hosts
  ansible.builtin.import_playbook: prepare_workloads.yml

- name: Configure AWS observability when AWS hosts exist
  ansible.builtin.import_playbook: configure_aws_observability.yml

- name: Configure GCP observability when GCP hosts exist
  ansible.builtin.import_playbook: configure_gcp_observability.yml

- name: Deploy Infrastructure workload
  ansible.builtin.import_playbook: infrastructure.yml

- name: Deploy History workload
  ansible.builtin.import_playbook: history.yml

- name: Deploy Fetcher workload
  ansible.builtin.import_playbook: fetcher.yml

- name: Deploy UI workload
  ansible.builtin.import_playbook: ui.yml
