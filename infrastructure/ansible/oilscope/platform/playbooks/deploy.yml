        runtime_secrets_project_id: "{{ deploy_project_config.project_id }}"
        runtime_secrets_mappings: "{{ deploy_workload_config.secret_mappings }}"
      tags:
        - fetcher

    - role: oilscope.platform.fetcher
      vars:
        fetcher_compose_environment:
          APP_IMAGE_TAG: "{{ deploy_project_config.registry.image_sha }}"
          POSTGRES_IMAGE: "{{ deploy_database_image }}"
        fetcher_database_host: "{{ hostvars[groups['database'][0]].internal_ip }}"
        fetcher_oilpriceapi_key: >-
          {{
            runtime_secrets_access_results.results
            | selectattr('item.key', 'equalto', 'OILPRICEAPI_KEY')
            | map(attribute='json.payload.data')
            | first
            | b64decode
