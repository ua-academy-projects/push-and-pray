---
- name: Test the Compose project role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_config_path: >-
      {{ playbook_dir }}/../../../../../project-config.example.json
    oilscope_config: >-
      {{ lookup('ansible.builtin.file', project_config_path) | from_json }}
  tasks:
    - name: Render the Compose definition for each workload role
      ansible.builtin.include_role:
        name: compose_project
      vars:
        compose_project_dir: >-
          /tmp/oilscope-compose-project-test/{{ compose_project_workload }}
        compose_project_owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
        compose_project_group: "{{ lookup('ansible.builtin.pipe', 'id -gn') }}"
        compose_project_public_endpoint:
          domain: oilscope.example.com
          acme_email: example-operator@example.com
      loop:
        - rabbitmq
        - redis
        - history
        - fetcher
        - ui
        - proxy
      loop_control:
        loop_var: compose_project_workload

    - name: Validate each rendered Compose definition
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - /tmp/oilscope-compose-project-test/{{ item }}/compose.yaml
          - config
          - --quiet
      environment:
        DATABASE_URL: postgresql+psycopg://oil_tracker:test-only@127.0.0.1:5432/oil_tracker
        RABBITMQ_URL: amqp://oil_tracker:test-only@127.0.0.1:5672/oil_tracker
        RABBITMQ_PASSWORD: test-only
        REDIS_URL: redis://:test-only@127.0.0.1:6379/0
        REDIS_PASSWORD: test-only
        HISTORY_SERVICE_URL: http://127.0.0.1:8001
        OILPRICEAPI_KEY: test-only
      changed_when: false
      loop:
        - rabbitmq
        - redis
        - history
        - fetcher
        - ui
        - proxy
