---
- name: Test a host without secret mappings
  hosts: oilscope-dev-bastion
  connection: local
  gather_facts: false
  vars:
    oilscope_config: >-
      {{ lookup('ansible.builtin.file', project_config_path) | from_json }}
  tasks:
    - name: Include the resolve_secrets role
      ansible.builtin.include_role:
        name: resolve_secrets

    - name: Verify that the result is empty
      ansible.builtin.assert:
        that:
          - resolve_secrets_result == {}
