---
- name: Deploy Fetcher
  hosts: fetcher
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  roles:
    - role: host_baseline

    - role: docker_engine

    - role: compose_project
      vars:
        compose_project_workload: "{{ oilscope_role }}"

    - role: resolve_secrets

    - role: registry_auth
      vars:
        registry_auth_registry: >-
          {{ oilscope_config.registry.repository
             | regex_replace('/.*$', '') }}
        registry_auth_username: >-
          {{ oilscope_config.registry.username | default('') }}
        registry_auth_token: >-
          {{ resolve_secrets_result.GHCR_TOKEN | default('') }}

    - role: fetcher
      vars:
        fetcher_database_host: >-
          {{ hostvars[groups['database'][0]].internal_ip }}
        fetcher_postgres_password: "{{ resolve_secrets_result.POSTGRES_PASSWORD }}"
        fetcher_oilpriceapi_key: "{{ resolve_secrets_result.OILPRICEAPI_KEY }}"
