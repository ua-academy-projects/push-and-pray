---
- name: Deploy Fetcher
  hosts: fetcher
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  pre_tasks:
    - name: Validate Terraform service endpoints
      ansible.builtin.assert:
        that:
          - service_endpoints_path | length > 0
          - oilscope_cloud in oilscope_service_endpoints
        fail_msg: >-
          Export OILSCOPE_SERVICE_ENDPOINTS with the JSON file generated from
          terraform output -json service_endpoints.
  roles:
    - role: host_baseline

    - role: docker_engine

    - role: compose_project
      vars:
        compose_project_workload: "{{ oilscope_role }}"

    - role: resolve_secrets

    - role: registry_auth
      vars:
        registry_auth_registry: >-
          {{ oilscope_config.registry.repository
             | regex_replace('/.*$', '') }}
        registry_auth_username: >-
          {{ oilscope_config.registry.username | default('') }}
        registry_auth_token: >-
          {{ resolve_secrets_result.GHCR_TOKEN | default('') }}

    - role: fetcher
      vars:
        fetcher_rabbitmq_host: >-
          {{ oilscope_service_endpoints[oilscope_cloud].rabbitmq.host }}
        fetcher_rabbitmq_port: >-
          {{ oilscope_service_endpoints[oilscope_cloud].rabbitmq.port }}
        fetcher_rabbitmq_username: >-
          {{ oilscope_service_endpoints[oilscope_cloud].rabbitmq.username }}
        fetcher_rabbitmq_vhost: >-
          {{ oilscope_service_endpoints[oilscope_cloud].rabbitmq.vhost }}
        fetcher_rabbitmq_queue: >-
          {{ oilscope_service_endpoints[oilscope_cloud].rabbitmq.queue }}
        fetcher_rabbitmq_password: "{{ resolve_secrets_result.RABBITMQ_PASSWORD }}"
        fetcher_oilpriceapi_key: "{{ resolve_secrets_result.OILPRICEAPI_KEY }}"
