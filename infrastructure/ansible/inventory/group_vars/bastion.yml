---
bastion_ssh_port: >-
  {{ (lookup('ansible.builtin.file', project_config_path) | from_json)
     .vms.bastion.ssh_port | int }}

# Terraform boots the bastion listening on this port already, so there is no
# separate bootstrap port to fall back to.
ansible_port: "{{ bastion_ssh_port | int }}"
