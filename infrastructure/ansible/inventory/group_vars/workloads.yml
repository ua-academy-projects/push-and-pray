---
# Inventory selects management access within the same cloud and location.
# With no bastion, the controller must already have direct network access.
ansible_ssh_common_args: >-
  {{ oilscope_ssh_base_args }}
  {% if oilscope_bastion_host | default('') | length > 0 %}
  -o ProxyCommand="ssh -W %h:%p -q
  -p {{ hostvars[oilscope_bastion_host].bastion_ssh_port }}
  -i {{ ansible_ssh_private_key_file }}
  {{ oilscope_ssh_base_args }}
  {{ hostvars[oilscope_bastion_host].ansible_user }}@{{ hostvars[oilscope_bastion_host].ansible_host }}"
  {% endif %}
