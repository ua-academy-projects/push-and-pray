---
oilscope_cloud_bastions: >-
  {{ groups['bastion'] | intersect(groups['cloud_' ~ oilscope_cloud]) }}
oilscope_bastion_address: >-
  {{ hostvars[oilscope_cloud_bastions | first].ansible_host }}
oilscope_bastion_ssh_port: >-
  {{ hostvars[oilscope_cloud_bastions | first].bastion_ssh_port }}

ansible_ssh_common_args: >-
  {{ oilscope_ssh_base_args }}
  -o ProxyCommand="ssh -W %h:%p -q
  -p {{ oilscope_bastion_ssh_port }}
  -i {{ ansible_ssh_private_key_file }}
  {{ oilscope_ssh_base_args }}
  {{ ansible_user }}@{{ oilscope_bastion_address }}"
