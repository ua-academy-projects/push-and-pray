---
oilscope_bastion_host: "{{ groups['bastion'] | first }}"
oilscope_bastion_address: >-
  {{ hostvars[oilscope_bastion_host].ansible_host }}
oilscope_bastion_ssh_port: >-
  {{ hostvars[oilscope_bastion_host].bastion_ssh_port }}
oilscope_bastion_user: >-
  {{ hostvars[oilscope_bastion_host].ansible_user }}

ansible_ssh_common_args: >-
  {{ oilscope_ssh_base_args }}
  -o ProxyCommand="ssh -W %h:%p -q
  -p {{ oilscope_bastion_ssh_port }}
  -i {{ ansible_ssh_private_key_file }}
  {{ oilscope_ssh_base_args }}
  {{ oilscope_bastion_user }}@{{ oilscope_bastion_address }}"
