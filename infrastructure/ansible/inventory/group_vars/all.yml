---
ansible_user: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_USER')
     | default(lookup('ansible.builtin.env', 'USER'), true) }}

oilscope_cloud_ssh_key_env: >-
  OILSCOPE_{{ oilscope_cloud | default('gcp') | upper }}_SSH_KEY
oilscope_default_ssh_key: >-
  {{ (lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/google_compute_engine')
     if oilscope_cloud | default('gcp') == 'gcp'
     else (lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519') }}
ansible_ssh_private_key_file: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_KEY')
     | default(lookup('ansible.builtin.env', oilscope_cloud_ssh_key_env), true)
     | default(oilscope_default_ssh_key, true) }}

oilscope_ssh_base_args: >-
  -o StrictHostKeyChecking=accept-new
  -o IdentitiesOnly=yes
ansible_ssh_common_args: "{{ oilscope_ssh_base_args }}"
