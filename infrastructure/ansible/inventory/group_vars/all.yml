---
ansible_user: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_USER')
     | default(lookup('ansible.builtin.env', 'USER'), true) }}

ansible_ssh_private_key_file: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_KEY')
     | default(lookup('ansible.builtin.env', 'HOME')
               ~ '/.ssh/google_compute_engine', true) }}

oilscope_ssh_base_args: >-
  -o StrictHostKeyChecking=accept-new
  -o IdentitiesOnly=yes
ansible_ssh_common_args: "{{ oilscope_ssh_base_args }}"

# The cluster configuration Terraform reads. Exporting OILSCOPE_PROJECT_CONFIG
# points the inventory plugin and these variables at the same file; -e
# project_config_path=... still overrides it for one run.
project_config_path: "{{ lookup('ansible.builtin.env', 'OILSCOPE_PROJECT_CONFIG') }}"
oilscope_config: >-
  {{ lookup('ansible.builtin.file', project_config_path) | from_json }}

# The kubeconfig the k3s playbook saves on the controller. Every role that
# talks to the cluster from here - Helm releases, manifests - reads this one.
oilscope_kubeconfig: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/oilscope-dev.yaml"

# The namespace the application and its data services live in.
oilscope_namespace: oilscope
