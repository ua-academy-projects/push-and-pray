---
# Leave private-key selection to OpenSSH. This honors its standard identity
# files, agent, and per-host configuration without a repository-specific path.
oilscope_ssh_base_args: >-
  -o StrictHostKeyChecking=accept-new
ansible_ssh_common_args: "{{ oilscope_ssh_base_args }}"
