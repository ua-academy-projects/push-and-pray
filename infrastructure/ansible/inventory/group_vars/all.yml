---
oilscope_ssh_key: "{{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_KEY') }}"

oilscope_ssh_identity_args: >-
  {{ ('-i ' ~ (oilscope_ssh_key | quote))
     if (oilscope_ssh_key | length > 0)
     else '' }}

oilscope_ssh_base_args: >-
  -o StrictHostKeyChecking=accept-new
  -o IdentitiesOnly=yes

ansible_ssh_common_args: >-
  {{ oilscope_ssh_base_args }}
  {{ oilscope_ssh_identity_args }}
