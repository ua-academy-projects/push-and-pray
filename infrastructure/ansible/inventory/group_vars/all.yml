---
ansible_user: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_USER')
     | default(lookup('ansible.builtin.env', 'USER'), true) }}

ansible_ssh_private_key_file: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_SSH_KEY')
     | default(lookup('ansible.builtin.env', 'HOME')
               ~ '/.ssh/google_compute_engine', true) }}

oilscope_ssh_base_args: >-
  -o StrictHostKeyChecking=accept-new
  -o IdentitiesOnly=yes
ansible_ssh_common_args: "{{ oilscope_ssh_base_args }}"

oilscope_config: >-
  {{ lookup('ansible.builtin.file', project_config_path) | from_json }}

oilscope_database_mode: "{{ oilscope_config.database.mode | default('self-hosted') }}"
oilscope_database_managed: "{{ oilscope_database_mode == 'managed' }}"
oilscope_queue_backend: "{{ 'amqp' if oilscope_database_managed else 'pgmq' }}"
oilscope_session_backend: "{{ 'redis' if oilscope_database_managed else 'postgres' }}"

oilscope_database_name: "{{ oilscope_config.database.name | default('oil_tracker') }}"
oilscope_database_user: "{{ oilscope_config.database.username | default('oil_tracker') }}"
oilscope_database_sslmode: "{{ 'require' if oilscope_database_managed else 'disable' }}"

oilscope_postgresql_port: "{{ oilscope_config.service_ports.postgresql | default(5432) }}"
oilscope_amqp_port: "{{ oilscope_config.service_ports.amqp | default(5672) }}"
oilscope_redis_port: "{{ oilscope_config.service_ports.redis | default(6379) }}"

oilscope_amqp_user: "{{ oilscope_database_user }}"
oilscope_amqp_vhost: "{{ oilscope_database_name }}"
