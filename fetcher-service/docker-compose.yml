# Fetcher VM: a single container -- see Dockerfile for why this is deliberately
# not scaled to multiple worker processes. Runs on its own bridge network with its
# port published to this VM's bridged LAN IP (see ../Vagrantfile), so it stays
# reachable from other VMs the same way host networking was.
services:
  fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyivano/fetcher-service:${IMAGE_TAG:-latest}
    env_file: .env
    networks:
      - fetcher-net
    ports:
      - "8002:8002"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fetcher-net:
