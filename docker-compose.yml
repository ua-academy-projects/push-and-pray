services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:  
      POSTGRES_DB: taska-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d taska-db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s 
    

  backend-service:
    build: ./backend
    container_name: backend-service
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=taska-db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - PORT=5002
    ports:
      - "5002:5002"
    depends_on:
      postgres-db:
        condition: service_healthy   # <-- ключова зміна
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  proxy-service:
    build: ./proxy
    container_name: proxy-service
    environment:
      - BACKEND_SERVICE_URL=http://backend-service:5002
      - PORT=5001
    depends_on:
      - backend-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s 

  poller: 
    build: ./poller-service
    container_name: poller
    environment:
        PROXY_SERVICE_URL: http://proxy-service:5001
        WATCHED_CITIES: "Kyiv,Warsaw,Berlin"
        POLL_INTERVAL_SECONDS: "900"
    depends_on:
         proxy-service:
            condition: service_healthy

  ui-service:
    build: ./ui-service
    container_name: ui-service
    environment:
      - PROXY_SERVICE_URL=http://proxy-service:5001
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
       proxy-service:
            condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
