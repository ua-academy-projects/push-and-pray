services:

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: weather_history
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_history"]
      interval: 5s
      timeout: 5s
      retries: 10

  history:
    build: ./history-service
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5002"
      DATABASE_URL: "postgresql://weather_user:weather_password@postgres:5432/weather_history"
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend-service
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5001"
      HISTORY_URL: "http://history:5002"
    ports:
      - "5001:5001"
    depends_on:
      - history

  ui:
    build: ./ui-service
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5000"
      BACKEND_URL: "http://backend:5001"
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  postgres_data: