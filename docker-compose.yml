services:
  database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: weather_history
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U weather_user -d weather_history
      interval: 5s
      timeout: 5s
      retries: 10

  provider-service:
    build: ./provider-service
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5002"
      FLASK_DEBUG: "false"
      EXTERNAL_WEATHER_URL: "https://api.open-meteo.com/v1/forecast"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10

  backend-service:
    build: ./backend-service
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5001"
      FLASK_DEBUG: "false"
      DATABASE_URL: "postgresql://weather_user:weather_password@database:5432/weather_history"
      PROVIDER_URL: "http://provider-service:5002"
    depends_on:
      database:
        condition: service_healthy
      provider-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ui-service:
    build: ./ui-service
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5000"
      FLASK_DEBUG: "false"
      BACKEND_URL: "http://backend-service:5001"
    ports:
      - "0.0.0.0:8080:5000"
    depends_on:
      backend-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
