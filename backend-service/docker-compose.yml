# Backend Service VM: a single container running the FastAPI API. Its RabbitMQ consumer
# (app/broker/consumer.py) runs as a background task inside that same process via the
# lifespan in app/main.py, rather than as a separate container -- see docs/architecture.md
# §17, decision 27 for the history of why these were ever split. Uses network_mode: host so
# it's reachable at this VM's existing bridged LAN IP (see ../Vagrantfile), exactly like the
# old systemd deployment. Schema setup is not a separate step either -- the process creates
# any missing tables itself on startup (app.database.session.init_db), so there's no
# migration container to wait on either.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyivano/backend-service:${IMAGE_TAG:-latest}
    env_file: .env
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
