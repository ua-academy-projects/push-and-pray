name: airaware-fetcher

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  fetcher:
    build:
      context: ../../api-fetcher-service
      dockerfile: Dockerfile
    image: airaware/fetcher:local
    container_name: airaware-fetcher
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
