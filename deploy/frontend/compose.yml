name: airaware-frontend

services:
  frontend:
    build:
      context: ../../frontend-service
      dockerfile: Dockerfile
    image: airaware/frontend:local
    container_name: airaware-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
