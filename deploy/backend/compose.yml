name: airaware-backend

services:
  backend:
    build:
      context: ../../backend-service
      dockerfile: Dockerfile
    image: airaware/backend:local
    container_name: airaware-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
