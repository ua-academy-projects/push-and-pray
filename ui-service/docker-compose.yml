# UI VM: a single nginx container serving the production Vite build. Runs on its own
# bridge network with its port published to this VM's bridged LAN IP (see
# ../Vagrantfile), so it stays reachable from other VMs the same way host networking
# was, just via an explicit port mapping instead of sharing the host's network stack.
# VITE_BACKEND_BASE_URL is read from this directory's .env (docker compose loads it
# automatically for ${...} substitution) and passed in as a build arg -- it must be
# set before `docker compose build`, not just before `up`, since it's baked into the
# static bundle rather than read at container start.
services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL}
    image: skyivano/ui-service:${IMAGE_TAG:-latest}
    networks:
      - ui-net
    ports:
      - "5173:5173"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ui-net:
