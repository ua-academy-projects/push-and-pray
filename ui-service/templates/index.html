<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Погода — Надвірна</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">
                    Локальний моніторинг
                </p>

                <h1>Погода в Надвірній</h1>

                <p class="page-description">
                    Актуальні показники та історія
                    спостережень
                </p>
            </div>

            <div
                class="refresh-status"
                aria-label="Дані оновлюються щохвилини"
            >
                <span aria-hidden="true"></span>
                Оновлення щохвилини
            </div>
        </header>

        <section
            class="card weather-card"
            aria-labelledby="current-weather-title"
        >
            <div class="section-header">
                <div>
                    <p class="section-kicker">Зараз</p>
                    <h2 id="current-weather-title">
                        Останні дані
                    </h2>
                </div>
            </div>

            <div
                id="weather-result"
                class="weather-result empty-state"
            >
                Завантаження погоди...
            </div>
        </section>

        <section
            class="card chart-card"
            aria-labelledby="chart-title"
        >
            <div class="section-header">
                <div>
                    <p class="section-kicker">
                        Динаміка
                    </p>

                    <h2 id="chart-title">
                        Графік температури
                    </h2>
                </div>
            </div>

            <div
                id="chart-empty"
                class="empty-state"
            >
                Завантаження історії...
            </div>

            <div
                id="chart-container"
                class="chart-container"
                hidden
            >
                <svg
                    id="temperature-chart"
                    class="temperature-chart"
                    viewBox="0 0 800 360"
                    role="img"
                    aria-label="Графік температури у Надвірній"
                ></svg>
            </div>
        </section>

        <section
            class="card history-card"
            aria-labelledby="history-title"
        >
            <div class="section-header">
                <div>
                    <p class="section-kicker">
                        Архів
                    </p>

                    <h2 id="history-title">
                        Історія вимірювань
                    </h2>
                </div>

                <button
                    id="clear-history-button"
                    type="button"
                    class="secondary-button"
                >
                    Очистити історію
                </button>
            </div>

            <div
                id="history-result"
                class="history-result empty-state"
            >
                Завантаження історії...
            </div>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='script.js') }}"
        defer
    ></script>
</body>
</html>
