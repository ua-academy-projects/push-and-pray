<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Погода в Надвірній</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Погода в Надвірній</h1>
        </header>

        <section class="card">
            <div class="section-header">
                <h2>Останні дані</h2>
            </div>

            <div
                id="weather-result"
                class="weather-result empty-state"
            >
                Завантаження погоди...
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <div>
                    <h2>Графік температури</h2>
                </div>
            </div>

            <div
                id="chart-empty"
                class="empty-state"
            >
                Завантаження історії...
            </div>

            <div
                id="chart-container"
                class="chart-container"
                hidden
            >
                <svg
                    id="temperature-chart"
                    class="temperature-chart"
                    viewBox="0 0 800 360"
                    role="img"
                    aria-label="Графік температури у Надвірній"
                ></svg>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Історія вимірювань</h2>

                <button
                    id="clear-history-button"
                    type="button"
                    class="secondary-button"
                >
                    Очистити історію
                </button>
            </div>

            <div
                id="history-result"
                class="history-result empty-state"
            >
                Завантаження історії...
            </div>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='script.js') }}"
        defer
    ></script>
</body>
</html>
