<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather App</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Weather App</h1>

            <p>
                Enter a city to get the current weather.
            </p>
        </header>

        <form
            id="weather-form"
            class="weather-form"
        >
            <label for="city-input">
                City
            </label>

            <input
                id="city-input"
                name="city"
                type="text"
                placeholder="For example: Kyiv"
                autocomplete="off"
                required
            >

            <div class="form-buttons">
                <button type="submit">
                    Get weather
                </button>

                <button
                    id="refresh-button"
                    type="button"
                    class="secondary-button"
                >
                    Refresh
                </button>
            </div>
        </form>

        <p
            id="message"
            class="message"
            aria-live="polite"
        ></p>

        <section class="card">
            <h2>Current weather</h2>

            <div
                id="weather-result"
                class="weather-result empty-state"
            >
                No weather data loaded.
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Request history</h2>

                <div class="history-buttons">
                    <button
                        id="history-button"
                        type="button"
                    >
                        Load history
                    </button>

                    <button
                        id="clear-history-button"
                        type="button"
                        class="secondary-button"
                    >
                        Clear history
                    </button>
                </div>
            </div>

            <div
                id="history-result"
                class="history-result empty-state"
            >
                No history loaded.
            </div>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='script.js') }}"
        defer
    ></script>
</body>
</html>
